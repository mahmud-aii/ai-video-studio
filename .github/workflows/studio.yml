            <!-- مؤشر الماوس بنقطة استهداف آمنة لا تغطي النص العربي -->
            <svg id="cursor-svg" viewBox="0 0 1080 1920">
              <circle id="c-ring" cx="0" cy="0" r="38" fill="none" stroke="#00E5FF" stroke-width="5" opacity="0"/>
              <g id="c-arrow" transform="translate(500,500)">
                <path d="M0,0 L0,46 L14,35 L25,56 L36,50 L24,29 L42,29 Z" fill="#FFFFFF" stroke="#040714" stroke-width="3.5"/>
              </g>
            </svg>

            <script>
              const SCENES = __SCENES_JSON__;
              const TOTAL_DUR = __TOTAL_DUR__;

              const DOCK_DATA = [
                { tag: 'ALERT // 01', big: 'إعلانات بدون أتمتة = نزيف مستمر', sub: 'ضياع العملاء في زحمة الواتساب والورق اليدوي', metric: '-$4,850 / MO' },
                { tag: 'SHIFT // 02', big: 'نبني (عقل) أعمالك الرقمي المتكامل', sub: 'منظومة SaaS تربط التسويق بالإدارة والمبيعات', metric: '100% AUTOMATED' },
                { tag: 'MAGIC // 03', big: 'لا تدخل بشري.. ولا عملاء ضائعين!', sub: 'من إعلان فيسبوك لشاشة السكرتيرة والواتساب في ثانية', metric: '0.1s WEBHOOK' },
                { tag: 'CLOUD // 04', big: 'سيطرة كاملة من أي مكان في العالم', sub: 'عيادات طبية • شركات عقارية • مراكز أعمال', metric: '24/7 CONTROL' },
                { tag: 'START // 05', big: 'لا تسوّق فقط.. قُد سوقك بذكاء.', sub: 'تواصل مع Tekviyo اليوم واحجز استشارتك للمستقبل', metric: 'TEKVIYO.COM' }
              ];

              function easeOutBack(x) {
                x = Math.max(0, Math.min(1, x));
                return 1 + 2.1 * Math.pow(x - 1, 3) + 1.1 * Math.pow(x - 1, 2);
              }

              function wTime(sc, idx) {
                const wt = sc.word_times;
                const safeIdx = Math.max(0, Math.min(wt.length - 1, idx));
                return wt[safeIdx].start;
              }

              /* نقر الماوس على الحافة اليسرى السفلية للزر بعيداً تماماً عن النص العربي في المنتصف */
              function placeCursorSafeCorner(el, approachProg, isClicking) {
                const rect = el.getBoundingClientRect();
                const targetX = rect.left + 28;
                const targetY = rect.bottom - 16;
                const startX = targetX - 180;
                const startY = targetY + 210;
                const p = Math.max(0, Math.min(1, approachProg));
                const easeP = 1 - Math.pow(1 - p, 3);
                const cx = startX + (targetX - startX) * easeP;
                const cy = startY + (targetY - startY) * easeP;

                const cursorSvg = document.getElementById('cursor-svg');
                const cArrow = document.getElementById('c-arrow');
                const cRing = document.getElementById('c-ring');
                cursorSvg.style.display = 'block';
                cArrow.setAttribute('transform', 'translate(' + cx.toFixed(1) + ',' + cy.toFixed(1) + ')');
                cRing.setAttribute('cx', cx.toFixed(1));
                cRing.setAttribute('cy', cy.toFixed(1));
                cRing.setAttribute('opacity', isClicking ? '1' : '0');
              }

              window.renderFrame = function(scIdx, tGlobal, tScene) {
                const sc = SCENES[scIdx];
                document.getElementById('ch-num').innerText = sc.num_tag;
                document.getElementById('ch-title').innerText = sc.title_tag;
                document.getElementById('pace-fill').style.width = ((tGlobal / TOTAL_DUR) * 100).toFixed(2) + '%';

                /* تحريك هالات الألوان الخلفية بنعومة وتغيير طابعها اللوني حسب المشهد */
                const orbA = document.getElementById('orb-a');
                const orbB = document.getElementById('orb-b');
                orbA.style.background = (scIdx === 0) ? '#E11D48' : '#2563EB';
                orbB.style.background = (scIdx === 0) ? '#EA580C' : (scIdx === 2 ? '#10B981' : '#D946EF');
                orbA.style.transform = 'translate(' + (Math.sin(tGlobal*1.4)*40).toFixed(1) + 'px,' + (Math.cos(tGlobal*1.1)*35).toFixed(1) + 'px)';
                orbB.style.transform = 'translate(' + (Math.cos(tGlobal*1.3)*40).toFixed(1) + 'px,' + (Math.sin(tGlobal*1.5)*35).toFixed(1) + 'px)';

                for (let i = 1; i <= 5; i++) {
                  document.getElementById('sc-' + i).style.display = (i === scIdx + 1) ? 'flex' : 'none';
                }

                /* البكسلات المتطايرة في شعار Tekviyo */
                const pxList = document.querySelectorAll('.px-float');
                for (let p = 0; p < pxList.length; p++) {
                  const dy = Math.sin(tGlobal * 4.2 + p * 1.1) * 4.5;
                  pxList[p].setAttribute('transform', 'translate(0,' + dy.toFixed(1) + ')');
                }

                /* 1. شريط التركيز الثلاثي للكلمات (السابقة + الكبسولة الحالية + التالية) */
                const wt = sc.word_times;
                let wIdx = 0;
                for (let k = 0; k < wt.length; k++) {
                  if (tScene >= wt[k].start - 0.02) {
                    wIdx = k;
                  }
                }
                const wObj = wt[wIdx];
                const currentWord = wObj.word;
                document.getElementById('prev-word').innerText = (wIdx > 0) ? wt[wIdx - 1].word : '';
                document.getElementById('next-word').innerText = (wIdx + 1 < wt.length) ? wt[wIdx + 1].word : '';

                const wSpan = Math.max(0.08, wObj.end - wObj.start);
                const wLocalProg = Math.max(0, Math.min(1, (tScene - wObj.start) / wSpan));
                const isHighlight = sc.highlights.indexOf(currentWord) !== -1;
                const pill = document.getElementById('single-word-pill');
                pill.innerText = currentWord;
                const popBounce = Math.sin(wLocalProg * Math.PI);
                const pillScale = isHighlight ? (1.06 + 0.09 * popBounce) : (0.98 + 0.04 * popBounce);
                if (isHighlight) {
                  pill.style.background = (scIdx === 0)
                    ? 'linear-gradient(135deg, #E11D48, #FF6D00)'
                    : 'linear-gradient(135deg, #2563EB 0%, #D946EF 55%, #FF6D00 100%)';
                } else {
                  pill.style.background = 'linear-gradient(145deg, #0D173D, #080E26) padding-box, linear-gradient(90deg, #00E5FF, #D946EF) border-box';
                }
                pill.style.transform = 'scale(' + pillScale.toFixed(3) + ')';

                /* 2. تحديث البطاقة السفلية بنعومة دون إخفائها لمنع أي فراغ بصري */
                const dInfo = DOCK_DATA[scIdx];
                document.getElementById('dock-tag').innerText = dInfo.tag;
                document.getElementById('dock-big').innerText = dInfo.big;
                document.getElementById('dock-sub').innerText = dInfo.sub;
                document.getElementById('dock-metric').innerText = dInfo.metric;

                document.getElementById('cursor-svg').style.display = 'none';

                /* 3. تحريك المشاهد الخمسة بتزامن الكلمات وامتلاء بصري 100% */
                if (scIdx === 0) {
                  const tLost = wTime(sc, 7);
                  const tWa   = wTime(sc, 11);
                  const tMan  = wTime(sc, 15);
                  const tCh   = wTime(sc, 17);

                  const lossRatio = Math.min(1, tScene / Math.max(0.4, tLost));
                  const lossVal = Math.floor(1250 + lossRatio * 3600);
                  document.getElementById('s1-big-num').innerText = '-$' + lossVal.toLocaleString();

                  const stP = (tScene >= tLost) ? easeOutBack((tScene - tLost) / 0.25) : 0;
                  document.getElementById('s1-stamp').style.transform = 'rotate(-4deg) scale(' + stP.toFixed(3) + ')';

                  document.getElementById('b1').className = (tScene >= wTime(sc, 4)) ? 'ch-box warn' : 'ch-box';
                  const b2El = document.getElementById('b2');
                  b2El.className = (tScene >= tWa) ? 'ch-box warn' : 'ch-box';
                  b2El.style.transform = (tScene >= tWa && tScene < tMan) ? ('translateX(' + (Math.sin(tGlobal*34)*5).toFixed(1) + 'px)') : 'none';

                  ['b3', 'b4', 'b5'].forEach(function(bid, idx) {
                    document.getElementById(bid).className = (tScene >= tMan + idx*0.10) ? 'ch-box warn' : 'ch-box';
                  });

                  const isChaos = (tScene >= tCh - 0.05);
                  document.getElementById('b6-txt').innerText = isChaos ? 'فوضى شاملة!' : 'النتيجة؟';
                  document.getElementById('b6').style.transform = isChaos ? 'scale(1.04)' : 'scale(1)';
                }
                else if (scIdx === 1) {
                  const tBrand = wTime(sc, 6);
                  const logoPulse = (tScene >= tBrand && tScene < tBrand + 0.55)
                    ? (1 + 0.08 * Math.sin(((tScene - tBrand) / 0.55) * Math.PI))
                    : (1 + 0.02 * Math.sin(tGlobal * 3.0));
                  document.getElementById('hero-logo-svg').style.transform = 'scale(' + logoPulse.toFixed(3) + ')';

                  const dashOff = -(tGlobal * 72);
                  ['s2-line-1', 's2-line-2', 's2-line-3'].forEach(function(lid) {
                    document.getElementById(lid).setAttribute('stroke-dashoffset', dashOff.toFixed(1));
                  });
                }
                else if (scIdx === 2) {
                  const tClick = wTime(sc, 13);
                  const tShow  = wTime(sc, 17);
                  const tSec   = wTime(sc, 20);
                  const tMsg   = wTime(sc, 21);

                  const isClicking = (tScene >= tClick - 0.04 && tScene <= tClick + 0.22);
                  const btn3 = document.getElementById('s3-submit-btn');
                  btn3.style.background = (tScene >= tClick)
                    ? 'linear-gradient(135deg, #D946EF, #FF6D00)'
                    : 'linear-gradient(135deg, #00E5FF, #2563EB)';
                  btn3.style.color = (tScene >= tClick) ? '#FFFFFF' : '#040714';
                  btn3.innerText = (tScene >= tClick) ? 'تم التسجيل ✓' : 'تسجيل الموعد';
                  btn3.style.transform = isClicking ? 'scale(0.92)' : 'scale(1)';

                  document.getElementById('s3-pipe-1').setAttribute('stroke-dashoffset', (-(tGlobal * 85)).toFixed(1));
                  document.getElementById('s3-pipe-2').setAttribute('stroke-dashoffset', (-(tGlobal * 85)).toFixed(1));

                  /* اشتعال شاشة السكرتيرة عند كلمة "تظهر" (بعد أن كانت حاضرة بوضع الاستعداد بدون فراغ!) */
                  const dbActive = (tScene >= tShow - 0.08);
                  const dbEl = document.getElementById('s3-db');
                  dbEl.className = dbActive ? 'glass-card magenta' : 'glass-card standby';
                  document.getElementById('s3-db-status').innerText = dbActive ? '● وصل العميل فوراً!' : '● بانتظار ضغطة الإعلان...';
                  document.getElementById('s3-db-status').style.color = dbActive ? '#4ADE80' : '#94A3B8';

                  const st3 = (tScene >= tSec - 0.10) ? easeOutBack((tScene - (tSec - 0.10)) / 0.24) : 0;
                  document.getElementById('s3-stamp').style.transform = 'rotate(-4deg) scale(' + st3.toFixed(3) + ')';

                  /* اشتعال بطاقة الواتساب عند كلمة "ورسالة" */
                  const waActive = (tScene >= tMsg - 0.06);
                  const waEl = document.getElementById('s3-wa');
                  waEl.className = waActive ? 'glass-card ignited-emerald' : 'glass-card standby';
                  document.getElementById('s3-wa-status').style.color = waActive ? '#4ADE80' : '#94A3B8';
                  const sentTag = document.getElementById('s3-sent-tag');
                  sentTag.style.background = waActive ? 'linear-gradient(135deg,#00E5FF,#10B981)' : 'rgba(255,255,255,0.1)';
                  sentTag.style.color = waActive ? '#040714' : '#94A3B8';
                  sentTag.innerText = waActive ? 'SENT ✓✓' : 'READY';

                  if (tScene >= tClick - 0.70 && tScene <= tClick + 0.30) {
                    placeCursorSafeCorner(btn3, (tScene - (tClick - 0.70)) / 0.70, isClicking);
                  }
                }
                else if (scIdx === 3) {
                  /* اشتعال بطاقات القطاعات الثلاثة تباعاً مع بقائها مرئية منذ بداية المشهد */
                  const secTimes = [wTime(sc, 2), wTime(sc, 4), wTime(sc, 7)];
                  const secClasses = ['glass-card', 'glass-card magenta', 'glass-card ignited-emerald'];
                  ['s4-w1', 's4-w2', 's4-w3'].forEach(function(wid, idx) {
                    const active = (tScene >= secTimes[idx] - 0.12);
                    const el = document.getElementById(wid);
                    el.className = active ? secClasses[idx] : 'glass-card standby';
                    el.style.transform = active ? 'scale(1.015)' : 'scale(0.985)';
                  });

                  /* دوران حلقات القياس الثلاث بالتزامن مع: موظفيك (16)، مبيعاتك (17)، ونموك (18) */
                  const ringTimes = [wTime(sc, 16), wTime(sc, 17), wTime(sc, 18)];
                  ['ring-1', 'ring-2', 'ring-3'].forEach(function(rid, idx) {
                    const rt = ringTimes[idx];
                    const rProg = (tScene >= rt - 0.25) ? Math.min(1, (tScene - (rt - 0.25)) / 0.55) : 0.18;
                    const offset = 302 * (1 - rProg);
                    document.getElementById(rid).setAttribute('stroke-dashoffset', offset.toFixed(1));
                  });
                }
                else if (scIdx === 4) {
                  const tUnb  = wTime(sc, 7);
                  const tCont = wTime(sc, 8);
                  const tBook = wTime(sc, 12);

                  const st5 = (tScene >= tUnb - 0.05) ? easeOutBack((tScene - (tUnb - 0.05)) / 0.25) : 0;
                  document.getElementById('s5-stamp').style.transform = 'rotate(-4deg) scale(' + st5.toFixed(3) + ')';

                  const domainStr = 'https://tekviyo.com';
                  const typeRatio = Math.max(0.25, Math.min(1, (tScene - (tCont - 0.3)) / Math.max(0.35, tBook - tCont)));
                  const cLen = Math.floor(typeRatio * domainStr.length);
                  document.getElementById('s5-typed').innerText = domainStr.substring(0, cLen);

                  const sendBtn = document.getElementById('s5-send');
                  const click5 = (tScene >= tBook - 0.04 && tScene <= tBook + 0.24);
                  const booked = (tScene >= tBook + 0.12);
                  sendBtn.style.background = booked
                    ? 'linear-gradient(135deg, #00E5FF, #10B981)'
                    : 'linear-gradient(135deg, #00E5FF 0%, #D946EF 55%, #FF6D00 100%)';
                  sendBtn.style.color = booked ? '#040714' : '#FFFFFF';
                  sendBtn.innerText = booked ? 'تم الحجز ✓' : 'احجز الآن ↗';
                  sendBtn.style.transform = click5 ? 'scale(0.93)' : 'scale(1)';

                  if (tScene >= tBook - 0.70 && tScene <= tBook + 0.45) {
                    placeCursorSafeCorner(sendBtn, (tScene - (tBook - 0.70)) / 0.70, click5);
                  }
                }
              };
            </script>
          </body>
          </html>""".replace("__SCENES_JSON__", scenes_json).replace("__TOTAL_DUR__", f"{total_dur:.4f}")

          Path("tekviyo_v3_stage.html").write_text(html_stage, encoding="utf-8")

          print("🎬 [4/5] رندر 30FPS للمسرح الزجاجي الممتلئ بدون أي فراغات...", flush=True)
          fps = 30
          total_frames = int(total_dur * fps)

          ffmpeg_proc = subprocess.Popen([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "image2pipe", "-vcodec", "mjpeg", "-r", str(fps), "-i", "-",
              "-i", "final_audio.aac",
              "-c:v", "libx264", "-preset", "superfast", "-crf", "16", "-pix_fmt", "yuv420p",
              "-c:a", "copy", "-shortest", "Tekviyo_Pro_Brand_v3.mp4"
          ], stdin=subprocess.PIPE)

          qa_snapshots = {}
          t0 = time.time()

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 1920})
              page.goto(f"file://{os.path.abspath('tekviyo_v3_stage.html')}", wait_until="networkidle")
              page.evaluate("() => document.fonts.ready")
              page.wait_for_timeout(300)

              for i in range(total_frames):
                  t = i / fps
                  sc_idx = 0
                  for k in range(5):
                      if t >= s_starts[k]:
                          sc_idx = k
                  t_sc = t - s_starts[sc_idx]
                  dur_sc = scene_durations[sc_idx]
                  prog_sc = t_sc / max(0.1, dur_sc)

                  page.evaluate(f"window.renderFrame({sc_idx}, {t:.4f}, {t_sc:.4f})")
                  jpg_bytes = page.screenshot(type="jpeg", quality=95)

                  if abs(prog_sc - 0.72) < 0.03 and sc_idx not in qa_snapshots:
                      Path(f"qa_v3_{sc_idx}.jpg").write_bytes(jpg_bytes)
                      qa_snapshots[sc_idx] = f"qa_v3_{sc_idx}.jpg"

                  try:
                      ffmpeg_proc.stdin.write(jpg_bytes)
                  except BrokenPipeError:
                      break

                  if i % 150 == 0 or i == total_frames - 1:
                      print(f"⚡ رندر النسخة الاحترافية v3: {i+1}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

              browser.close()

          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()

          print("🔍 [5/5] تجميع لوحة الفحص البصري...", flush=True)
          sheet = Image.new("RGB", (1800, 640), (4, 7, 20))
          for k in range(5):
              if k in qa_snapshots:
                  im = Image.open(qa_snapshots[k]).resize((360, 640))
                  sheet.paste(im, (k * 360, 0))
          sheet.save("QA_Tekviyo_v3_Sheet.jpg", quality=94)
          print("✅ اكتمل إنتاج النسخة الاحترافية الثالثة بنجاح كامل!", flush=True)
          EOF
          python3 -u build_tekviyo_v3.py

      - name: 📦 4. رفع الفيديو الاحترافي ولوحة الفحص
        uses: actions/upload-artifact@v4
        with:
          name: 🌌-Tekviyo-Pro-Brand-v3
          path: |
            Tekviyo_Pro_Brand_v3.mp4
            QA_Tekviyo_v3_Sheet.jpg
          retention-days: 30

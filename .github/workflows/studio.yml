              (16 + 50*(1-d_mid)).astype(np.uint8),
              (34 + 98*(1-d_mid)).astype(np.uint8)
          ], axis=-1), "RGB").convert("RGBA")

          for bg_im, col_g in [(bg_chaos, (239,68,68,24)), (bg_tech, (56,189,248,24)), (bg_cta, (74,222,128,26))]:
              dr = ImageDraw.Draw(bg_im)
              for gx in range(60, W, 64):
                  for gy in range(120, H-100, 64):
                      dr.ellipse([gx-1.5, gy-1.5, gx+1.5, gy+1.5], fill=col_g)

          def ease_out_back(x):
              x = float(np.clip(x, 0.0, 1.0))
              return 1.0 + 2.2 * ((x - 1.0)**3) + 1.2 * ((x - 1.0)**2)

          def paste_c(canvas, im, cx, cy, scale=1.0, alpha=1.0):
              if alpha <= 0.01 or scale <= 0.1:
                  return
              w = im if abs(scale - 1.0) < 0.01 else im.resize((max(10, int(im.width*scale)), max(10, int(im.height*scale))), Image.Resampling.BILINEAR)
              if alpha < 0.99:
                  w = w.copy()
                  w.putalpha(w.getchannel("A").point(lambda p: int(p * alpha)))
              canvas.paste(w, (int(cx - w.width/2), int(cy - w.height/2)), w)

          def draw_cursor(draw_obj, cx, cy, clicked=False):
              if clicked:
                  draw_obj.ellipse([cx-36, cy-36, cx+36, cy+36], outline=(255, 255, 255, 230), width=4)

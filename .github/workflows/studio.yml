          ui = {uid: Image.open(f"ui/{uid}.png").convert("RGBA") for uid in ui_ids}

          print("🎬 [3/5] بدء الرندر المتزامن مع الصوت الصافي...", flush=True)
          W, H = 1080, 1920
          y_i, x_i = np.ogrid[:H, :W]

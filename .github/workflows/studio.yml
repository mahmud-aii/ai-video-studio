                  <span class="brand-en" style="font-size:26px;color:#FFF">Tek<span class="viyo-grad">viyo</span></span>
                  <span class="num-ltr" style="background:rgba(0,229,255,0.16);border:1px solid #00E5FF;color:#00E5FF;padding:2px 10px;border-radius:8px;font-size:17px;font-weight:800">2.0</span>

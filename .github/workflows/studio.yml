name: ⚡ TEKVIYO 2026 Whisper-Synced High-Tempo Studio

on:name: 🌌 Tekviyo 2.0 Brand Identity & Emotional Voice Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_name:
        description: 'شخصية المعلق في Gemini TTS (Charon = عميق وفخم / Fenrir = حماسي وتشويقي / Orus = واثق)'
        required: false
        default: 'Charon'

jobs:
  render_tekviyo_brand:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت محركات الصوت العاطفي، Faster-Whisper، والرندر
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper playwright edge-tts pillow numpy requests
          playwright install chromium

      - name: 🚀 3. توليد الإلقاء العاطفي المتدرج + رندر هوية Tekviyo النيونية المتزامنة
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_PERSONA: ${{ github.event.inputs.voice_name || 'Charon' }}
        run: |
          cat << 'EOF' > build_tekviyo_brand.py
          import os, re, subprocess, time, wave, math, base64, json, difflib
          import requests
          from pathlib import Path
          from PIL import Image
          from faster_whisper import WhisperModel
          from playwright.sync_api import sync_playwright

          os.makedirs("audio", exist_ok=True)

          # سيناريو المشاهد الخمسة مع التوجيه التمثيلي والمشاعر الصوتية الخاصة بكل مشهد
          scenes_script = [
              {
                  "id": 1,
                  "num_tag": "05",
                  "title_tag": "01 // نزيف الإعلانات",
                  "emotion_director": (
                      "Audio Profile: Expressive, charismatic Arabic B2B narrator.\n"
                      "Director's Notes: Speak with suspenseful urgency, tension, and empathetic frustration. "
                      "Start with an intriguing, dramatic buildup on wasted thousands of dollars, accelerate with tense energy "
                      "when describing lost WhatsApp leads, and end with a sharp, gripping rhetorical question. "
                      "Read ONLY the Arabic text under Transcript.\n\nTranscript:\n"
                  ),
                  "edge_rate": "+14%",
                  "edge_pitch": "+3Hz",
                  "tempo": "1.12",
                  "stop_sil": "0.10",
                  "voice": "تَصْرِفُ آلافَ الدُّولَارَاتِ عَلَى الإِعْلَانَات... لَكِنَّ العُمَلَاءَ يَضِيعُونَ فِي زَحْمَةِ رَسَائِلِ الوَاتْسَاب، وَمُوَظَّفُوكَ غَارِقُونَ فِي الإِدْخَالِ اليَدَوِيِّ وَالفَوْضَى؟!",
                  "words": ["تصرف", "آلاف", "الدولارات", "على", "الإعلانات،", "لكن", "العملاء", "يضيعون!", "في", "زحمة", "رسائل", "الواتساب،", "وموظفوك", "غارقون", "في", "الإدخال", "اليدوي", "والفوضى؟"],
                  "highlights": ["آلاف", "الدولارات", "يضيعون!", "الواتساب،", "غارقون", "والفوضى؟"]
              },
              {
                  "id": 2,
                  "num_tag": "04",
                  "title_tag": "02 // عقل الأعمال",
                  "emotion_director": (
                      "Audio Profile: Deep, magnetic, visionary tech leader speaking Arabic.\n"
                      "Director's Notes: Deliver a powerful dramatic shift! Speak the opening exclamation boldly and decisively to cut through the chaos, "
                      "then lower your voice into a calm, resonant, deeply confident tone full of pride and gravitas, "
                      "taking a brief dramatic breath before emphasizing the final two words with goosebump-inducing authority. "
                      "Read ONLY the Arabic text under Transcript.\n\nTranscript:\n"
                  ),
                  "edge_rate": "+5%",
                  "edge_pitch": "-4Hz",
                  "tempo": "1.07",
                  "stop_sil": "0.17",
                  "voice": "التَّسْوِيقُ وَحْدَهُ، لَمْ يَعُدْ يَكْفِي! فِي تِكْ فِيُو، نَحْنُ لَا نُصَمِّمُ لَكَ إِعْلَانَاتٍ فَقَط... نَحْنُ نَبْنِي، عَقْلَ أَعْمَالِكَ!",
                  "words": ["التسويق", "وحده", "لم", "يعد", "يكفي!", "في", "Tekviyo", "نحن", "لا", "نصمم", "لك", "إعلانات", "فقط،", "نحن", "نبني", "(عقل)", "أعمالك!"],
                  "highlights": ["يكفي!", "Tekviyo", "نبني", "(عقل)", "أعمالك!"]
              },
              {
                  "id": 3,
                  "num_tag": "03",
                  "title_tag": "03 // الربط اللحظي",
                  "emotion_director": (
                      "Audio Profile: Energetic, crisp, fascinated tech innovator speaking Arabic.\n"
                      "Director's Notes: Speak with sparkling excitement, amazement, and sleek high-tech momentum! "
                      "Make the listener feel the lightning speed as the customer clicks, the data appears on the secretary's screen, "
                      "and the confirmation fires automatically—then land the final sentence with crisp, rock-solid reassurance. "
                      "Read ONLY the Arabic text under Transcript.\n\nTranscript:\n"
                  ),
                  "edge_rate": "+17%",
                  "edge_pitch": "+2Hz",
                  "tempo": "1.14",
                  "stop_sil": "0.09",
                  "voice": "اِكْتَشِفْ قُوَّةَ الرَّبْطِ الذَّكِيّ! إِعْلَانَاتُكَ الآنَ تَصُبُّ مُبَاشَرَةً فِي نِظَامِكَ الإِدَارِيِّ لَحْظِيًّا! العَمِيلُ يَضْغَطُ عَلَى الإِعْلَان، بَيَانَاتُهُ تَظْهَرُ فِي شَاشَةِ سِكْرِتِيرَتِكَ، وَرِسَالَةُ التَّأْكِيدِ تَصِلُهُ أُوتُومَاتِيكِيًّا! لَا تَدَخُّلَ بَشَرِيّ، وَلَا عُمَلَاءَ ضَائِعِين.",
                  "words": ["اكتشف", "قوة", "الربط", "الذكي!", "إعلاناتك", "الآن", "تصب", "مباشرة", "في", "نظامك", "الإداري", "لحظياً!", "العميل", "يضغط", "على", "الإعلان،", "بياناته", "تظهر", "في", "شاشة", "سكرتيرتك،", "ورسالة", "التأكيد", "تصله", "أوتوماتيكياً!", "لا", "تدخل", "بشري،", "ولا", "عملاء", "ضائعين!"],
                  "highlights": ["الذكي!", "لحظياً!", "يضغط", "تظهر", "سكرتيرتك،", "أوتوماتيكياً!", "ضائعين!"]
              },
              {
                  "id": 4,
                  "num_tag": "02",
                  "title_tag": "04 // الأنظمة السحابية",
                  "emotion_director": (
                      "Audio Profile: Warm, assured, executive B2B advisor speaking Arabic.\n"
                      "Director's Notes: Speak with expansive pride, prestige, and trustworthy executive confidence. "
                      "Give each business sector a distinct, respectful cadence, and build warm, empowering momentum on "
                      "employees, sales, and growth from anywhere in the world. "
                      "Read ONLY the Arabic text under Transcript.\n\nTranscript:\n"
                  ),
                  "edge_rate": "+11%",
                  "edge_pitch": "-1Hz",
                  "tempo": "1.11",
                  "stop_sil": "0.12",
                  "voice": "سَوَاءٌ كُنْتَ عِيَادَةً طِبِّيَّة، مُؤَسَّسَةً عَقَارِيَّة، أَوْ مَرْكَزَ أَعْمَال، أَنْظِمَتُنَا السَّحَابِيَّةُ المُخَصَّصَةُ تَمْنَحُكَ السَّيْطَرَةَ الكَامِلَةَ عَلَى مُوَظَّفِيك، مَبِيعَاتِك، وَنُمُوِّك، مِنْ أَيِّ مَكَانٍ فِي العَالَم!",
                  "words": ["سواء", "كنت", "عيادة", "طبية،", "مؤسسة", "عقارية،", "أو", "مركز", "أعمال،", "أنظمتنا", "السحابية", "المخصصة", "تمنحك", "السيطرة", "الكاملة", "على", "موظفيك،", "مبيعاتك،", "ونموك،", "من", "أي", "مكان", "في", "العالم!"],
                  "highlights": ["عيادة", "عقارية،", "أعمال،", "السيطرة", "موظفيك،", "مبيعاتك،", "ونموك،", "العالم!"]
              },
              {
                  "id": 5,
                  "num_tag": "∑",
                  "title_tag": "05 // قُد سوقك بذكاء",
                  "emotion_director": (
                      "Audio Profile: Inspiring, triumphant, magnetic Arabic brand narrator.\n"
                      "Director's Notes: Deliver an unforgettable, inspiring finale! Start with bold leadership conviction, "
                      "emphasize building an unbeatable ecosystem with power, and invite the listener warmly and decisively "
                      "to contact Tekviyo today and step into the future. "
                      "Read ONLY the Arabic text under Transcript.\n\nTranscript:\n"
                  ),
                  "edge_rate": "+9%",
                  "edge_pitch": "+1Hz",
                  "tempo": "1.09",
                  "stop_sil": "0.14",
                  "voice": "لَا تَكْتَفِ بِالوَاجِهَة... اِبْنِ مَنْظُومَةً مُتَكَامِلَةً لَا تُقْهَر! تَوَاصَلْ مَعَ تِكْ فِيُو اليَوْم، وَاحْجِزْ اسْتِشَارَتَكَ التِّقْنِيَّةَ لِنَقْلِ أَعْمَالِكَ لِلْمُسْتَقْبَل!",
                  "words": ["لا", "تكتفِ", "بالواجهة،", "ابنِ", "منظومة", "متكاملة", "لا", "تُقهر!", "تواصل", "مع", "Tekviyo", "اليوم،", "واحجز", "استشارتك", "التقنية", "لنقل", "أعمالك", "للمستقبل!"],
                  "highlights": ["منظومة", "تُقهر!", "Tekviyo", "واحجز", "للمستقبل!"]
              }
          ]

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          persona = os.environ.get("VOICE_PERSONA", "Charon").strip()

          def norm_ar(w):
              if "tekviyo" in w.lower():
                  return "تكفيو"
              w = re.sub(r"[\u064B-\u065F\u0670\W_]+", "", w)
              w = re.sub(r"[أإآ]", "ا", w)
              w = w.replace("ة", "ه").replace("ى", "ي").replace("ڤ", "ف")
              return w

          print("🎯 [1/5] تهيئة محرك Faster-Whisper لفحص المشاعر ومزامنة الكلمات...", flush=True)
          whisper_model = None
          try:
              whisper_model = WhisperModel("base", device="cpu", compute_type="int8")
          except Exception as e:
              print("⚠️ ملاحظة Whisper:", e, flush=True)

          def call_gemini_tts(model_id, prompt_text, out_raw_wav):
              r = requests.post(
                  f"https://generativelanguage.googleapis.com/v1beta/models/{model_id}:generateContent?key={gemini_key}",
                  json={
                      "contents": [{"parts": [{"text": prompt_text}]}],
                      "generationConfig": {
                          "responseModalities": ["AUDIO"],
                          "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": persona}}}
                      }
                  },
                  timeout=40
              )
              if r.status_code == 200:
                  part = r.json()["candidates"][0]["content"]["parts"][0]["inlineData"]
                  raw_b = base64.b64decode(part["data"])
                  if "wav" in part.get("mimeType", "") or raw_b[:4] == b"RIFF":
                      Path(out_raw_wav).write_bytes(raw_b)
                  else:
                      pcm_p = out_raw_wav + ".pcm"
                      Path(pcm_p).write_bytes(raw_b)
                      subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", pcm_p, out_raw_wav], check=True)
                  return True
              return False

          def surgical_prompt_guard(raw_wav, expected_words):
              """يتأكد عبر Whisper أن المعلق لم ينطق أي كلمة من تعليمات الإخراج ويقص أي مقدمة زائدة فوراً"""
              if whisper_model is None or not os.path.exists(raw_wav):
                  return True
              try:
                  segs, _ = whisper_model.transcribe(raw_wav, language="ar", word_timestamps=True, condition_on_previous_text=False)
                  sp = []
                  for s in segs:
                      for w in (s.words or []):
                          if w.word.strip():
                              sp.append({"n": norm_ar(w.word.strip()), "s": float(w.start), "e": float(w.end)})
                  if not sp:
                      return False
                  n_exp = [norm_ar(x) for x in expected_words]
                  n_sp = [x["n"] for x in sp]
                  sm = difflib.SequenceMatcher(None, n_exp, n_sp)
                  blocks = [b for b in sm.get_matching_blocks() if b.size > 0]
                  matched_total = sum(b.size for b in blocks)
                  if matched_total < max(3, int(len(n_exp) * 0.35)):
                      return False
                  first_blk = blocks[0]
                  est_start_idx = max(0, first_blk.b - first_blk.a)
                  if est_start_idx >= 2 and sp[est_start_idx]["s"] > 0.45:
                      cut_t = max(0.0, sp[est_start_idx]["s"] - 0.05)
                      trimmed = raw_wav + ".trim.wav"
                      subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-ss", f"{cut_t:.3f}", "-i", raw_wav, trimmed], check=True)
                      os.replace(trimmed, raw_wav)
                      print(f"✂️ حارس Whisper قص مقدمة توجيهية عند {cut_t:.2f}s وأبقى الأداء العاطفي الصافي!", flush=True)
                  return True
              except Exception:
                  return True

          def generate_emotional_scene_voice(sc, out_wav):
              idx = sc["id"]
              raw_wav = f"audio/raw_{idx}.wav"
              used_gem = False
              if gemini_key:
                  directed_prompt = sc["emotion_director"] + sc["voice"]
                  for m_id in ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]:
                      try:
                          if call_gemini_tts(m_id, directed_prompt, raw_wav):
                              if surgical_prompt_guard(raw_wav, sc["words"]):
                                  used_gem = True
                                  print(f"🎭 المشهد {idx}: تم توليد الأداء التمثيلي العاطفي عبر {m_id}", flush=True)
                                  break
                              elif call_gemini_tts(m_id, sc["voice"], raw_wav):
                                  used_gem = True
                                  print(f"🎙️ المشهد {idx}: تم توليد الصوت الصافي الاحتياطي عبر {m_id}", flush=True)
                                  break
                      except Exception:
                          pass

              if not used_gem:
                  subprocess.run([
                      "python3", "-m", "edge_tts",
                      "--voice", "ar-SA-HamedNeural",
                      f"--rate={sc['edge_rate']}",
                      f"--pitch={sc['edge_pitch']}",
                      "--text", sc["voice"],
                      "--write-media", f"audio/raw_{idx}.mp3"
                  ], check=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.mp3", raw_wav], check=True)
                  print(f"🎙️ المشهد {idx}: تم التوليد بنبرة مخصصة عبر المحرك الرديف", flush=True)

              tempo_f = f"atempo={sc['tempo']}," if used_gem else ""
              stop_s = sc["stop_sil"]
              # ماسترينغ صوتي سينمائي يبرز دفء القرار (115Hz) وحضور الحروف (3.9kHz) مع الحفاظ على الوقفات العاطفية
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", raw_wav,
                  "-af", f"silenceremove=start_periods=1:start_silence=0.03:start_threshold=-40dB:stop_periods=-1:stop_duration=0.34:stop_silence={stop_s}:stop_threshold=-39dB,{tempo_f}highpass=f=70,equalizer=f=115:width_type=o:width=1.8:g=3.6,equalizer=f=3900:width_type=o:width=2.0:g=2.8,acompressor=threshold=-16dB:ratio=2.5:makeup=3.4dB,apad=pad_dur=0.16",
                  "-ar", "48000", "-ac", "2", out_wav
              ], check=True)

          print("🔊 [2/5] توليد التعليق الصوتي المشحون بالمشاعر للمشاهد الخمسة...", flush=True)
          for sc in scenes_script:
              generate_emotional_scene_voice(sc, f"audio/v_{sc['id']}.wav")

          def align_scene_words(wav_path, display_words, dur):
              spoken = []
              if whisper_model is not None:
                  try:
                      segs, _ = whisper_model.transcribe(wav_path, language="ar", word_timestamps=True, condition_on_previous_text=False)
                      raw_w = []
                      for s in segs:
                          for w in (s.words or []):
                              txt = w.word.strip()
                              if txt:
                                  raw_w.append({"w": txt, "n": norm_ar(txt), "s": float(w.start), "e": float(w.end)})
                      i = 0
                      while i < len(raw_w):
                          if i + 1 < len(raw_w) and raw_w[i]["n"] in ("تيك", "تك") and raw_w[i+1]["n"] in ("فيو", "فيوا", "فييو"):
                              spoken.append({"n": "تكفيو", "s": raw_w[i]["s"], "e": raw_w[i+1]["e"]})
                              i += 2
                          else:
                              spoken.append(raw_w[i])
                              i += 1
                  except Exception as e:
                      print("Whisper align note:", e, flush=True)

              n_disp = [norm_ar(x) for x in display_words]
              n_spok = [x["n"] for x in spoken]
              anchors = {}

              if spoken:
                  sm = difflib.SequenceMatcher(None, n_disp, n_spok)
                  for blk in sm.get_matching_blocks():
                      di, sj, ln = blk.a, blk.b, blk.size
                      for k in range(ln):
                          anchors[di + k] = (spoken[sj + k]["s"], spoken[sj + k]["e"])

                  # ربط ذكي إضافي للكلمات المتقاربة لفظياً لضمان دقة أعلى
                  used_sj = set()
                  for blk in sm.get_matching_blocks():
                      for k in range(blk.size):
                          used_sj.add(blk.b + k)
                  for di in range(len(n_disp)):
                      if di in anchors:
                          continue
                      t_min = anchors[max([k for k in anchors if k < di], default=-1)][1] if any(k < di for k in anchors) else 0.0
                      t_max = anchors[min([k for k in anchors if k > di], default=999)][0] if any(k > di for k in anchors) else dur
                      for sj, sp_item in enumerate(spoken):
                          if sj in used_sj:
                              continue
                          if t_min - 0.05 <= sp_item["s"] <= t_max + 0.05:
                              if difflib.SequenceMatcher(None, n_disp[di], sp_item["n"]).ratio() >= 0.70:
                                  anchors[di] = (sp_item["s"], sp_item["e"])
                                  used_sj.add(sj)
                                  break

              N = len(display_words)
              result = [None] * N
              speech_end = max(0.2, dur - 0.15)
              weights = [max(2, len(norm_ar(w))) + (2.4 if any(p in w for p in "،.!؟") else 0.0) for w in display_words]

              idx = 0
              while idx < N:
                  if idx in anchors:
                      s_t, e_t = anchors[idx]
                      result[idx] = {"word": display_words[idx], "start": round(s_t, 3), "end": round(max(s_t + 0.08, e_t), 3)}
                      idx += 1
                  else:
                      g_start = idx
                      while idx < N and idx not in anchors:
                          idx += 1
                      g_end = idx
                      t_left = result[g_start - 1]["end"] if g_start > 0 else 0.02
                      t_right = anchors[g_end][0] if g_end < N else speech_end
                      if t_right <= t_left + 0.05:
                          t_right = min(dur, t_left + 0.12 * (g_end - g_start))
                      w_slice = weights[g_start:g_end]
                      w_sum = sum(w_slice) or 1.0
                      cur = t_left
                      for offset, wt in enumerate(w_slice):
                          span = (t_right - t_left) * (wt / w_sum)
                          result[g_start + offset] = {"word": display_words[g_start + offset], "start": round(cur, 3), "end": round(cur + span, 3)}
                          cur += span
              return result

          # تصميم المؤثرات الصوتية النيونية المتناغمة مع هوية Tekviyo
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "anoisesrc=d=0.19:c=pink:r=48000:a=0.38", "-af", "bandpass=f=1150:width_type=h:w=750,afade=t=in:st=0:d=0.03,afade=t=out:st=0.07:d=0.12", "-ar", "48000", "-ac", "2", "audio/whoosh.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.68*sin(2*PI*1650*t)*exp(-55*t)+0.42*sin(2*PI*3200*t)*exp(-75*t)':s=48000:d=0.09", "-ar", "48000", "-ac", "2", "audio/click.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.52*sin(2*PI*(560+720*t)*t)*exp(-24*t)':s=48000:d=0.16", "-ar", "48000", "-ac", "2", "audio/pop.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.62*sin(2*PI*(150-85*t)*t)*exp(-11*t)+0.26*sin(2*PI*780*t)*exp(-24*t)':s=48000:d=0.30", "-ar", "48000", "-ac", "2", "audio/stamp.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.44*sin(2*PI*(400+1100*t)*t)*exp(-7*t)':s=48000:d=0.32", "-ar", "48000", "-ac", "2", "audio/zap.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.46*sin(2*PI*988*t)*exp(-9*t)+0.38*sin(2*PI*1480*t)*exp(-7*t)':s=48000:d=0.45", "-ar", "48000", "-ac", "2", "audio/ping.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.52*sin(2*PI*(130-60*t)*t)*exp(-3.8*t)+0.24*sin(2*PI*523.25*t)*exp(-5*t)+0.20*sin(2*PI*659.25*t)*exp(-4.5*t)':s=48000:d=0.75", "-ar", "48000", "-ac", "2", "audio/power.wav"], check=True)

          scene_durations = []
          s_starts = [0.0]
          sfx_events = []

          for sc in scenes_script:
              sid = sc["id"]
              v_wav = f"audio/v_{sid}.wav"
              with wave.open(v_wav, "rb") as wf:
                  dur = wf.getnframes() / float(wf.getframerate())
              scene_durations.append(dur)
              wt = align_scene_words(v_wav, sc["words"], dur)
              sc["word_times"] = wt
              sc["duration"] = round(dur, 4)
              sc_base = s_starts[-1]
              sc["start_global"] = round(sc_base, 4)
              s_starts.append(sc_base + dur)

              def w_ms(w_idx, offset=0.0):
                  w_idx = max(0, min(len(wt) - 1, w_idx))
                  return int(max(0.0, (sc_base + wt[w_idx]["start"] + offset)) * 1000)

              if sid == 1:
                  sfx_events.append((20, "whoosh", 0.90))
                  sfx_events.append((w_ms(7), "stamp", 1.15))   # "يضيعون!"
                  sfx_events.append((w_ms(11), "pop", 1.05))    # "الواتساب،"
                  sfx_events.append((w_ms(17), "stamp", 1.25))  # "والفوضى؟"
              elif sid == 2:
                  sfx_events.append((int(sc_base * 1000) + 10, "power", 1.15)) # تحول درامي عند دخول المشهد الثاني
                  sfx_events.append((w_ms(6), "ping", 1.10))    # "Tekviyo"
                  sfx_events.append((w_ms(15), "power", 1.05))  # "(عقل)"
              elif sid == 3:
                  sfx_events.append((int(sc_base * 1000) + 20, "whoosh", 0.90))
                  sfx_events.append((w_ms(13), "click", 1.35))       # "يضغط"
                  sfx_events.append((w_ms(14, 0.04), "zap", 1.15))   # شعاع الـ Webhook
                  sfx_events.append((w_ms(17), "pop", 1.15))         # "تظهر"
                  sfx_events.append((w_ms(20), "stamp", 1.10))        # "سكرتيرتك،"
                  sfx_events.append((w_ms(21), "ping", 1.20))         # "ورسالة"
              elif sid == 4:
                  sfx_events.append((int(sc_base * 1000) + 20, "whoosh", 0.90))
                  sfx_events.append((w_ms(2), "whoosh", 0.95))  # "عيادة"
                  sfx_events.append((w_ms(4), "whoosh", 0.95))  # "مؤسسة"
                  sfx_events.append((w_ms(7), "whoosh", 0.95))  # "مركز"
                  sfx_events.append((w_ms(16), "pop", 1.00))     # "موظفيك،"
                  sfx_events.append((w_ms(17), "pop", 1.00))     # "مبيعاتك،"
                  sfx_events.append((w_ms(18), "ping", 1.10))    # "ونموك،"
              elif sid == 5:
                  sfx_events.append((int(sc_base * 1000) + 15, "power", 1.05))
                  sfx_events.append((w_ms(7), "stamp", 1.15))        # "تُقهر!"
                  sfx_events.append((w_ms(10), "ping", 1.05))        # "Tekviyo"
                  sfx_events.append((w_ms(12), "click", 1.35))       # "واحجز"
                  sfx_events.append((w_ms(12, 0.08), "ping", 1.25))

          total_dur = sum(scene_durations)
          t_shift = s_starts[1]
          print(f"⚡ إجمالي مدة الفيديو المتزامن بالمشاعر: {total_dur:.2f} ثانية", flush=True)

          concat_in = []
          for k in range(1, 6):
              concat_in.extend(["-i", f"audio/v_{k}.wav"])
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + concat_in + ["-filter_complex", "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1[vo]", "-map", "[vo]", "audio/full_voice.wav"], check=True)

          # موسيقى خلفية تتغير مشاعرها تلقائياً: توتر درامي في المشهد 1 ثم إشراقة تقنية واثقة من المشهد 2 للنهاية!
          expr_bg = (
              f"lte(t,{t_shift:.3f})*(0.024*sin(2*PI*58*t)+0.015*sin(2*PI*87*t))*(0.6+0.4*sin(2*PI*2.4*t))"
              f"+gt(t,{t_shift:.3f})*((0.022*sin(2*PI*65.4*t)+0.015*sin(2*PI*98*t)+0.011*sin(2*PI*164.8*t))*(0.68+0.32*sin(2*PI*2.0*t)))"
          )
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", f"aevalsrc='{expr_bg}':s=48000:d={total_dur}",
              "-af", f"afade=t=in:st=0:d=0.5,afade=t=out:st={max(0.4, total_dur-1.4)}:d=1.4",
              "-ar", "48000", "-ac", "2", "audio/emotional_bg.wav"
          ], check=True)

          sfx_files_map = {
              "whoosh": "audio/whoosh.wav",
              "click": "audio/click.wav",
              "pop": "audio/pop.wav",
              "stamp": "audio/stamp.wav",
              "zap": "audio/zap.wav",
              "ping": "audio/ping.wav",
              "power": "audio/power.wav"
          }
          mix_inputs = ["-i", "audio/full_voice.wav", "-i", "audio/emotional_bg.wav"]
          fc_delays = []
          mix_labels = "[0:a][1:a]"
          weights_list = ["2.5", "0.52"]

          for idx_e, (ms_delay, s_key, wt_val) in enumerate(sfx_events):
              mix_inputs.extend(["-i", sfx_files_map[s_key]])
              in_idx = idx_e + 2
              lbl = f"s{idx_e}"
              fc_delays.append(f"[{in_idx}:a]adelay={ms_delay}|{ms_delay}[{lbl}];")
              mix_labels += f"[{lbl}]"
              weights_list.append(f"{wt_val:.2f}")

          fc_full = "".join(fc_delays) + f"{mix_labels}amix=inputs={len(weights_list)}:duration=first:dropout_transition=0:weights='{' '.join(weights_list)}'[aout]"
          subprocess.run(
              ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + mix_inputs +
              ["-filter_complex", fc_full, "-map", "[aout]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"],
              check=True
          )

          print("🎨 [3/5] بناء المسرح السيبراني المطابق لهوية وشعار Tekviyo...", flush=True)
          scenes_json = json.dumps(scenes_script, ensure_ascii=False)

          html_stage = """<!DOCTYPE html>

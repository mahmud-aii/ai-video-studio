name: 🚀 TEKVIYO 2.0 Official Launch Video Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_name:
        description: 'شخصية المعلق في Gemini 3.8 TTS (Charon = فخم / Fenrir = وثائقي واثق)'
        required: false
        default: 'Charon'

jobs:
  render_tekviyo_launch:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت محركات الجرافيك والصوتيات
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright edge-tts pillow numpy requests
          playwright install chromium

      - name: 🎬 3. بناء المشاهد الخمسة وهندسة الصوت المؤتمتة (TEKVIYO 2.0)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_PERSONA: ${{ github.event.inputs.voice_name || 'Charon' }}
        run: |
          cat << 'EOF' > build_tekviyo.py
          import os, subprocess, time, wave, math, base64
          import numpy as np
          import requests
          from pathlib import Path
          from PIL import Image, ImageDraw
          from playwright.sync_api import sync_playwright

          os.makedirs("ui", exist_ok=True)
          os.makedirs("audio", exist_ok=True)

          # نصوص المشاهد الخمسة مشكولة بالكامل لضمان نطق B2B فخم وسليم 100%
          scenes_script = [
              {
                  "id": 1,
                  "step": "01/05 • الفوضى اليدوية",
                  "voice": "تَصْرِفُ آلافَ الدُّولَارَاتِ عَلَى الإِعْلَانَات... لَكِنَّ العُمَلَاءَ يَضِيعُونَ فِي زَحْمَةِ رَسَائِلِ الوَاتْسَاب، وَمُوَظَّفُوكَ غَارِقُونَ فِي الإِدْخَالِ اليَدَوِيِّ وَالفَوْضَى؟",
                  "cap1": "تصرف آلاف الدولارات على الإعلانات..",
                  "cap2": "والعملاء يضيعون في زحمة الواتساب والفوضى؟ ⚠️"
              },
              {
                  "id": 2,
                  "step": "02/05 • تغيير قواعد اللعبة",
                  "voice": "التَّسْوِيقُ وَحْدَهُ لَمْ يَعُدْ يَكْفِي! فِي تِكْ فِيو، نَحْنُ لَا نُصَمِّمُ لَكَ إِعْلَانَاتٍ فَقَط... نَحْنُ نَبْنِي عَقْلَ أَعْمَالِكَ.",
                  "cap1": "التسويق وحده لم يعد يكفي!",
                  "cap2": "في TEKVIYO.. نحن نبني (عقل) أعمالك 🧠"
              },
              {
                  "id": 3,
                  "step": "03/05 • السحر التقني Webhooks",
                  "voice": "اِكْتَشِفْ قُوَّةَ الرَّبْطِ الذَّكِيّ! إِعْلَانَاتُكَ الآنَ تَصُبُّ مُبَاشَرَةً فِي نِظَامِكَ الإِدَارِيِّ لَحْظِيًّا. العَمِيلُ يَضْغَطُ عَلَى الإِعْلَان، بَيَانَاتُهُ تَظْهَرُ فِي شَاشَةِ سِكْرِتِيرَتِكَ، وَرِسَالَةُ التَّأْكِيدِ تَصِلُهُ أُوتُومَاتِيكِيًّا. لَا تَدَخُّلَ بَشَرِيّ، وَلَا عُمَلَاءَ ضَائِعِين.",
                  "cap1": "العميل يضغط الإعلان ⬅ يظهر بشاشة السكرتيرة",
                  "cap2": "ورسالة تأكيد الموعد تصله بالواتساب لحظياً! ⚡"
              },
              {
                  "id": 4,
                  "step": "04/05 • الأنظمة السحابية",
                  "voice": "سَوَاءٌ كُنْتَ عِيَادَةً طِبِّيَّة، مُؤَسَّسَةً عَقَارِيَّة، أَوْ مَرْكَزَ أَعْمَال.. أَنْظِمَتُنَا السَّحَابِيَّةُ المُخَصَّصَةُ تَمْنَحُكَ السَّيْطَرَةَ الكَامِلَةَ عَلَى مُوَظَّفِيك، مَبِيعَاتِك، وَنُمُوِّك، مِنْ أَيِّ مَكَانٍ فِي العَالَم.",
                  "cap1": "عيادات طبية • شركات عقارية • مراكز أعمال",
                  "cap2": "سيطرة سحابية كاملة من أي مكان في العالم 🌐"
              },
              {
                  "id": 5,
                  "step": "05/05 • انطلق للمستقبل",
                  "voice": "لَا تَكْتَفِ بِالوَاجِهَة.. اِبْنِ مَنْظُومَةً مُتَكَامِلَةً لَا تُقْهَر. تَوَاصَلْ مَعَ تِكْ فِيو اليَوْم، وَاحْجِزْ اسْتِشَارَتَكَ التِّقْنِيَّةَ لِنَقْلِ أَعْمَالِكَ لِلْمُسْتَقْبَل.",
                  "cap1": "لا تكتفِ بالواجهة.. ابنِ منظومة لا تُقهر",
                  "cap2": "تواصل مع TEKVIYO واحجز استشارتك اليوم 🚀"
              }
          ]

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          persona = os.environ.get("VOICE_PERSONA", "Charon").strip()

          def generate_scene_voice(idx, text_ar, out_wav):
              used_gem = False
              if gemini_key:
                  for m_id in ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]:
                      try:
                          prompt = f"اقرأ هذا النص الإعلاني بنبرة معلق شركات B2B واثق وهادئ وفخم يبعث على الطمأنينة:\n{text_ar}"
                          r = requests.post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/{m_id}:generateContent?key={gemini_key}",
                              json={
                                  "contents": [{"parts": [{"text": prompt}]}],
                                  "generationConfig": {
                                      "responseModalities": ["AUDIO"],
                                      "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": persona}}}
                                  }
                              },
                              timeout=35
                          )
                          if r.status_code == 200:
                              part = r.json()["candidates"][0]["content"]["parts"][0]["inlineData"]
                              raw_b = base64.b64decode(part["data"])
                              if "wav" in part.get("mimeType", "") or raw_b[:4] == b"RIFF":
                                  Path(f"audio/raw_{idx}.wav").write_bytes(raw_b)
                              else:
                                  Path(f"audio/raw_{idx}.pcm").write_bytes(raw_b)
                                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", f"audio/raw_{idx}.pcm", f"audio/raw_{idx}.wav"], check=True)
                              used_gem = True
                              print(f"🎙️ المشهد {idx}: تم توليد الصوت البشري عبر {m_id}", flush=True)
                              break
                      except Exception:
                          pass
              if not used_gem:
                  subprocess.run(["python3", "-m", "edge_tts", "--voice", "ar-SA-HamedNeural", "--rate=+2%", "--pitch=+0Hz", "--text", text_ar, "--write-media", f"audio/raw_{idx}.mp3"], check=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.mp3", f"audio/raw_{idx}.wav"], check=True)
                  print(f"🎙️ المشهد {idx}: تم توليد الصوت الإذاعي المشكول", flush=True)

              # ماسترينغ الصوت + إضافة 0.65 ثانية راحة في نهاية المشهد
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.wav",
                  "-af", "highpass=f=75,equalizer=f=120:width_type=o:width=2:g=3.5,equalizer=f=3800:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=2.5:makeup=3dB,apad=pad_dur=0.65",
                  "-ar", "48000", "-ac", "2", out_wav
              ], check=True)

          print("🔊 [1/5] توليد التعليق الصوتي والمؤثرات الخاصة بكل مشهد...", flush=True)

          # توليد المؤثرات الصوتية الأساسية (Clicks, Pings, Whooshes, Alarm, Webhook Zap)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "anoisesrc=d=0.32:c=pink:r=48000:a=0.40", "-af", "bandpass=f=850:width_type=h:w=550,afade=t=in:st=0:d=0.06,afade=t=out:st=0.14:d=0.18", "-ar", "48000", "-ac", "2", "audio/whoosh.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.60*sin(2*PI*1400*t)*exp(-45*t)+0.35*sin(2*PI*2800*t)*exp(-60*t)':s=48000:d=0.12", "-ar", "48000", "-ac", "2", "audio/click.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.45*sin(2*PI*880*t)*exp(-8*t)+0.35*sin(2*PI*1320*t)*exp(-6*t)':s=48000:d=0.55", "-ar", "48000", "-ac", "2", "audio/ping.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.35*sin(2*PI*(320+900*t)*t)*exp(-5*t)':s=48000:d=0.45", "-ar", "48000", "-ac", "2", "audio/zap.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.30*sin(2*PI*780*t)*(1+sin(2*PI*14*t))/2*exp(-2.2*t)':s=48000:d=0.90", "-ar", "48000", "-ac", "2", "audio/ring.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.50*sin(2*PI*(150-80*t)*t)*exp(-3.5*t)+0.25*sin(2*PI*528*t)*exp(-4*t)':s=48000:d=0.80", "-ar", "48000", "-ac", "2", "audio/shift.wav"], check=True)

          scene_durations = []
          for sc in scenes_script:
              sid = sc["id"]
              v_wav = f"audio/v_{sid}.wav"
              generate_scene_voice(sid, sc["voice"], v_wav)
              with wave.open(v_wav, "rb") as wf:
                  dur = wf.getnframes() / float(wf.getframerate())
              scene_durations.append(dur)

              # دمج المؤثرات الصوتية المخصصة لكل مشهد بدقة
              s_out = f"audio/scene_{sid}_mix.wav"
              if sid == 1:
                  # رنين هاتف مزعج + تطاير أوراق
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-i", v_wav, "-i", "audio/ring.wav", "-i", "audio/whoosh.wav",
                      "-filter_complex", "[1:a]adelay=400|400[r1];[2:a]adelay=1800|1800[w1];[1:a]adelay=3400|3400[r2];[0:a][r1][w1][r2]amix=inputs=4:duration=first:weights='2.2 0.7 0.9 0.7'[a]",
                      "-map", "[a]", "-ar", "48000", "-ac", "2", s_out
                  ], check=True)
              elif sid == 2:
                  # توقف الفوضى + إشراقة شعار TEKVIYO وبناء النظام
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-i", v_wav, "-i", "audio/shift.wav", "-i", "audio/ping.wav",
                      "-filter_complex", "[1:a]adelay=50|50[sh];[2:a]adelay=2400|2400[pg];[0:a][sh][pg]amix=inputs=3:duration=first:weights='2.2 1.1 0.9'[a]",
                      "-map", "[a]", "-ar", "48000", "-ac", "2", s_out
                  ], check=True)
              elif sid == 3:
                  # نقرة الماوس + طيران الـ Webhook + إشعار السكرتيرة + رسالة الواتساب
                  t_click = int(dur * 0.28 * 1000)
                  t_zap   = int(dur * 0.34 * 1000)
                  t_ping1 = int(dur * 0.52 * 1000)
                  t_ping2 = int(dur * 0.70 * 1000)
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-i", v_wav, "-i", "audio/click.wav", "-i", "audio/zap.wav", "-i", "audio/ping.wav",
                      "-filter_complex",
                      f"[1:a]adelay={t_click}|{t_click}[c];[2:a]adelay={t_zap}|{t_zap}[z];[3:a]adelay={t_ping1}|{t_ping1}[p1];[3:a]adelay={t_ping2}|{t_ping2}[p2];"
                      "[0:a][c][z][p1][p2]amix=inputs=5:duration=first:weights='2.2 1.3 1.1 1.0 1.0'[a]",
                      "-map", "[a]", "-ar", "48000", "-ac", "2", s_out
                  ], check=True)
              elif sid == 4:
                  # ظهور الشاشات الثلاث والشارات الأربع
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-i", v_wav, "-i", "audio/whoosh.wav", "-i", "audio/click.wav",
                      "-filter_complex", "[1:a]adelay=200|200[w1];[1:a]adelay=1400|1400[w2];[1:a]adelay=2600|2600[w3];[2:a]adelay=4200|4200[c1];[0:a][w1][w2][w3][c1]amix=inputs=5:duration=first:weights='2.2 0.9 0.9 0.9 1.0'[a]",
                      "-map", "[a]", "-ar", "48000", "-ac", "2", s_out
                  ], check=True)
              else:
                  # المشهد الخامس: الخاتمة الملهمة ونقرة حجز الاستشارة
                  t_end_ping = int(max(1.0, dur - 1.2) * 1000)
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-i", v_wav, "-i", "audio/shift.wav", "-i", "audio/click.wav", "-i", "audio/ping.wav",
                      "-filter_complex", f"[1:a]adelay=100|100[s];[2:a]adelay=3200|3200[c];[3:a]adelay={t_end_ping}|{t_end_ping}[p];[0:a][s][c][p]amix=inputs=4:duration=first:weights='2.2 0.9 1.2 1.2'[a]",
                      "-map", "[a]", "-ar", "48000", "-ac", "2", s_out
                  ], check=True)

          total_dur = sum(scene_durations)
          print(f"✅ مدد المشاهد الخمسة: {[round(d,2) for d in scene_durations]} (الإجمالي: {total_dur:.2f} ثانية)", flush=True)

          # دمج صوت المشاهد الخمسة مع خلفية موسيقية تقنية هادئة (Ambient B2B Pad)
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", f"aevalsrc='0.020*sin(2*PI*65*t)+0.015*sin(2*PI*98*t)+0.010*sin(2*PI*147*t)':s=48000:d={total_dur}",
              "-af", f"afade=t=in:st=0:d=1.5,afade=t=out:st={max(0.5, total_dur-2.0)}:d=2.0",
              "-ar", "48000", "-ac", "2", "audio/ambient.wav"
          ], check=True)

          concat_in = []
          for k in range(1, 6):
              concat_in.extend(["-i", f"audio/scene_{k}_mix.wav"])
          subprocess.run(
              ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + concat_in +
              ["-filter_complex", "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1[vo]", "-map", "[vo]", "audio/all_vo.wav"],
              check=True
          )
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", "audio/all_vo.wav", "-i", "audio/ambient.wav",
              "-filter_complex", "[0:a][1:a]amix=inputs=2:duration=first:weights='1.8 0.45'[aout]",
              "-map", "[aout]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"
          ], check=True)

          # 2. بناء الطبقات البصرية عالية الدقة للمشاهد الخمسة عبر HTML5/CSS3
          print("🎨 [2/5] تصميم كروت الـ Micro-UI، لوحات التحكم، والكلمات التفاعلية...", flush=True)
          caps_html = ""
          for sc in scenes_script:
              sid = sc["id"]
              col = "#ef4444" if sid == 1 else ("#38bdf8" if sid in (2, 4) else "#10b981")
              caps_html += f"""
              <div id="cap_{sid}_a" class="cap-bar" style="border-bottom-color:{col}">
                <div class="cap-txt">{sc['cap1']}</div>
              </div>
              <div id="cap_{sid}_b" class="cap-bar" style="border-bottom-color:{col}">
                <div class="cap-txt hl" style="color:{col}">{sc['cap2']}</div>
              </div>"""

          html_ui = f"""<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
          <style>
            * {{ box-sizing: border-box; margin: 0; padding: 0; }}
            body {{ background: transparent; font-family: 'Cairo', sans-serif; color: #fff; width: 1080px; padding: 25px; }}
            .blk {{ margin-bottom: 35px; }}

            /* المشهد 1: الفوضى */
            #s1_title {{ width: 960px; text-align: center; padding: 20px; }}
            .h-small {{ font-size: 40px; font-weight: 800; color: #fca5a5; }}
            .h-big {{ font-size: 62px; font-weight: 900; color: #fff; line-height: 1.2; }}
            .red-pill {{ display: inline-block; background: #ef4444; color: #fff; padding: 4px 24px; border-radius: 20px; }}

            .chaos-card {{
              width: 460px; background: linear-gradient(145deg, #1f1218, #12090d);
              border: 2.5px solid #ef4444; border-radius: 32px; padding: 26px;
              box-shadow: 0 20px 45px rgba(0,0,0,0.85);
            }}
            .chaos-card.wa {{ border-color: #f97316; background: linear-gradient(145deg, #1e1610, #110c08); }}
            .ch-tag {{ font-size: 21px; font-weight: 900; color: #f87171; margin-bottom: 10px; display: block; }}
            .ch-num {{ font-size: 54px; font-weight: 900; color: #ef4444; font-family: 'JetBrains Mono', monospace; }}
            .ch-sub {{ font-size: 24px; font-weight: 700; color: #fecaca; margin-top: 8px; }}
            .msg-row {{ background: rgba(255,255,255,0.06); border-right: 5px solid #f97316; padding: 10px 16px; border-radius: 12px; margin-top: 10px; font-size: 21px; font-weight: 700; color: #fed7aa; }}

            #s1_paper {{
              width: 950px; background: #181216; border: 2.5px dashed #f87171;
              border-radius: 28px; padding: 22px 32px; display: flex; align-items: center; justify-content: space-between;
            }}

            /* المشهد 2: عقل أعمالك TEKVIYO */
            #s2_logo {{
              width: 760px; background: linear-gradient(135deg, rgba(14,25,45,0.96), rgba(6,11,22,0.98));
              border: 3px solid #38bdf8; border-radius: 40px; padding: 34px 44px; text-align: center;
              box-shadow: 0 25px 60px rgba(56,189,248,0.28);
            }}
            .tk-brand {{ font-size: 80px; font-weight: 900; color: #fff; font-family: 'JetBrains Mono', monospace; letter-spacing: 3px; }}
            .tk-brand span {{ color: #38bdf8; }}
            .tk-tag {{ font-size: 30px; font-weight: 800; color: #4ade80; margin-top: 8px; }}

            #s2_dash {{
              width: 960px; background: rgba(11,18,32,0.95); border: 2px solid rgba(56,189,248,0.45);
              border-radius: 34px; padding: 28px 34px;
            }}
            .dash-top {{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 14px; }}
            .dash-grid {{ display: flex; gap: 20px; }}
            .d-box {{ flex: 1; background: rgba(20,32,54,0.9); border: 1.5px solid rgba(74,222,128,0.4); border-radius: 22px; padding: 18px; text-align: center; }}
            .d-val {{ font-size: 38px; font-weight: 900; color: #4ade80; font-family: 'JetBrains Mono', monospace; }}
            .d-lbl {{ font-size: 22px; font-weight: 800; color: #e2e8f0; margin-top: 4px; }}

            /* المشهد 3: السحر التقني Webhooks */
            #s3_ad {{
              width: 920px; background: #111827; border: 2.5px solid #38bdf8;
              border-radius: 32px; padding: 24px 32px; display: flex; align-items: center; justify-content: space-between;
            }}
            .ad-btn {{
              background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff;
              padding: 14px 34px; border-radius: 20px; font-size: 28px; font-weight: 900;
              box-shadow: 0 10px 25px rgba(56,189,248,0.4);
            }}
            #s3_popup {{
              width: 920px; background: linear-gradient(135deg, #06281e, #051812);
              border: 3px solid #10b981; border-radius: 32px; padding: 24px 32px;

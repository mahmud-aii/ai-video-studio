name: 🎬 Turkish Viral Style Editor (0$ Cost + Micro-UI + PiP Speaker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render_viral_style:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت المحركات المفتوحة المصدر (0$ تكلفة)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright pillow numpy opencv-python-headless requests
          playwright install chromium

      - name: 🚀 3. مونتاج الفيديو بستايل الشاب التركي (إطار سفلي متحرك + واجهات Micro-UI)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > viral_turkish_style.py
          import os, glob, subprocess, time, math, urllib.request
          import numpy as np
          import cv2
          import requests
          from pathlib import Path
          from PIL import Image, ImageDraw
          from playwright.sync_api import sync_playwright

          os.makedirs("ui_cards", exist_ok=True)
          input_video = None

          # 1. سحب الفيديو الخام من Releases تلقائياً
          repo = os.environ.get("GH_REPO", "")
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Authorization": f"token {token}"} if token else {}
          try:
              resp = requests.get(f"https://api.github.com/repos/{repo}/releases", headers=headers, timeout=15)
              if resp.status_code == 200:
                  for rel in resp.json():
                      for asset in rel.get("assets", []):
                          if asset.get("name", "").lower().endswith((".mp4", ".mov", ".mkv")):
                              print(f"📦 [1/4] سحب الفيديو الخام من Releases: {asset['name']}", flush=True)
                              urllib.request.urlretrieve(asset["browser_download_url"], "raw_input.mp4")
                              input_video = "raw_input.mp4"
                              break
                      if input_video:
                          break
          except Exception as e:
              print(f"⚠️ فحص Releases: {e}", flush=True)

          if not input_video or not os.path.exists(input_video):
              files = [f for f in glob.glob("*.mp4") if "Edited_" not in f and "clean_" not in f]
              if files:
                  input_video = files[0]

          if not input_video:
              raise FileNotFoundError("⚠️ لم يتم العثور على الفيديو الخام في Releases!")

          # 2. تجهيز كاميرا المتحدث ومعالجة الصوت مع مؤثرات النقرات والـ Whoosh الناعمة
          print("✂️ [2/4] تجهيز إطار المتحدث وهندسة الصوت والمؤثرات...", flush=True)
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", input_video, "-t", "16.4",
              "-vf", "scale=640:800:force_original_aspect_ratio=increase,crop=640:800,fps=30,eq=contrast=1.08:saturation=1.12",
              "-an", "speaker_cam.mp4"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", input_video, "-t", "16.4",
              "-af", "highpass=f=80,equalizer=f=130:width_type=o:width=2:g=3.5,equalizer=f=3800:width_type=o:width=2:g=3.0,acompressor=threshold=-18dB:ratio=3:attack=5:release=60:makeup=4dB",
              "-ar", "48000", "-ac", "2", "voice_clean.wav"
          ], check=True)

          # مؤثر انتقال ناعم + نقرة زر تفاعلية
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "anoisesrc=d=0.25:c=pink:r=48000:a=0.16",
              "-af", "bandpass=f=1100:width_type=h:w=700,afade=t=in:st=0:d=0.05,afade=t=out:st=0.10:d=0.15",
              "-ar", "48000", "-ac", "2", "ui_whoosh.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "aevalsrc='0.25*sin(2*PI*880*t)*exp(-25*t)':s=48000:d=0.18",
              "-ar", "48000", "-ac", "2", "ui_ding.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", "voice_clean.wav", "-i", "ui_whoosh.wav", "-i", "ui_ding.wav",
              "-filter_complex",
              "[1:a]adelay=300|300[w1];"
              "[1:a]adelay=4500|4500[w2];"
              "[2:a]adelay=5300|5300[d1];"
              "[1:a]adelay=6800|6800[w3];"
              "[1:a]adelay=9100|9100[w4];"
              "[1:a]adelay=11200|11200[w5];"
              "[2:a]adelay=14200|14200[d2];"
              "[0:a][w1][w2][d1][w3][w4][w5][d2]amix=inputs=8:duration=first:dropout_transition=0:weights='2.0 0.6 0.6 0.8 0.6 0.6 0.6 0.8'[aout]",
              "-map", "[aout]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"
          ], check=True)

          # 3. بناء مشاهد الـ Micro-UI على غرار فيديو الشاب التركي (أسود صافي + أصفر ذهبي + كروت تفاعلية)
          print("🎨 [3/4] بناء مشاهد الـ Micro-UI التفاعلية (ستايل omergocmen)...", flush=True)
          html_scenes = """<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; width: 1080px; padding: 30px; }
            .scene-block { width: 940px; padding: 20px; margin-bottom: 50px; }

            /* العناوين العلوية الجريئة بالأبيض والأصفر الذهبي */
            .viral-title { font-size: 64px; font-weight: 900; line-height: 1.22; letter-spacing: -0.5px; margin-bottom: 28px; }
            .hl-yellow { color: #facc15; }
            .hl-orange { color: #fb923c; }
            .hl-green { color: #4ade80; }

            /* المشهد 1: قائمة الكورسات/الأدوات المدفوعة مع ختم 0$ الأصفر المائل */
            .course-item {
              background: #141417; border: 2px solid #27272a; border-radius: 24px;
              padding: 24px 30px; margin-bottom: 18px;
              display: flex; align-items: center; justify-content: space-between;
            }
            .course-left { display: flex; align-items: center; gap: 22px; }
            .play-box {
              width: 64px; height: 64px; border-radius: 18px; background: #1f1f24;
              display: flex; align-items: center; justify-content: center; font-size: 26px; color: #71717a;
            }
            .c-title { font-size: 30px; font-weight: 800; color: #f4f4f5; }
            .c-sub { font-size: 21px; font-weight: 600; color: #71717a; }
            .price-btn {
              background: #3f1d24; color: #f87171; border: 1.5px solid #7f1d1d;
              padding: 10px 26px; border-radius: 14px; font-size: 24px; font-weight: 800;
              text-decoration: line-through;
            }

            /* ختم 0$ المجاني المائل */
            #zero_stamp {
              width: 520px; background: #09090b; border: 5px solid #facc15;
              border-radius: 32px; padding: 28px 40px; text-align: center;
              box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(250,204,21,0.25);
            }
            .zero-big { font-size: 92px; font-weight: 900; color: #facc15; font-family: 'JetBrains Mono', monospace; line-height: 1; }
            .zero-txt { font-size: 36px; font-weight: 900; color: #ffffff; margin-top: 8px; }

            /* المشهد 2: شريط البحث التفاعلي وأشرطة التحميل 100% */
            .browser-box {
              background: #121215; border: 2px solid #27272a; border-radius: 28px; padding: 30px;
            }
            .browser-dots { display: flex; gap: 10px; margin-bottom: 22px; align-items: center; }
            .b-dot { width: 14px; height: 14px; border-radius: 50%; background: #3f3f46; }
            .search-bar {
              background: #09090b; border: 2.5px solid #facc15; border-radius: 18px;
              padding: 18px 26px; font-size: 30px; font-weight: 800; color: #fff;
              display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px;
            }
            .prog-row { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; }
            .prog-label { width: 280px; font-size: 22px; color: #a1a1aa; text-align: left; direction: ltr; }
            .prog-track { flex: 1; height: 12px; background: #27272a; border-radius: 6px; overflow: hidden; }
            .prog-fill { height: 100%; background: #facc15; border-radius: 6px; width: 100%; }
            .prog-pct { font-size: 22px; color: #facc15; font-weight: 800; }

            /* المشهد 3: مقارنة (التقليدي الممل vs مصنعك الذكي) */
            .compare-grid { display: flex; gap: 26px; }
            .cmp-card {
              flex: 1; background: #121215; border: 2px solid #27272a; border-radius: 28px; padding: 28px;
            }
            .cmp-card.pro { border-color: #facc15; background: linear-gradient(180deg, rgba(250,204,21,0.08), #121215); }
            .cmp-num { font-size: 24px; font-weight: 800; color: #71717a; font-family: 'JetBrains Mono', monospace; }
            .pro .cmp-num { color: #facc15; }
            .cmp-head { font-size: 34px; font-weight: 900; margin: 10px 0 20px; }
            .cmp-step {
              background: #1c1c21; padding: 14px 20px; border-radius: 14px;
              margin-bottom: 12px; font-size: 23px; font-weight: 700; color: #d4d4d8;
              border-right: 4px solid #3f3f46;
            }
            .pro .cmp-step { border-right-color: #facc15; color: #fff; }

            /* المشهد 4: الأدوات المجانية + زر الإرسال التفاعلي */
            .stack-row {
              background: #141417; border: 2px solid #27272a; border-radius: 22px;
              padding: 20px 28px; margin-bottom: 14px;
              display: flex; align-items: center; justify-content: space-between;
            }
            .stack-name { font-size: 29px; font-weight: 800; color: #fff; }
            .stack-free { font-size: 32px; font-weight: 900; color: #facc15; font-family: 'JetBrains Mono', monospace; }

            #cta_btn {
              width: 620px; background: #facc15; color: #09090b;
              border-radius: 26px; padding: 24px 40px; text-align: center;
              font-size: 36px; font-weight: 900;
              box-shadow: 0 20px 45px rgba(250,204,21,0.35);
            }

            /* شريط الكابشن السفلي المدمج فوق المتحدث */
            .mini-cap {
              width: 860px; background: rgba(20,20,23,0.92);
              border: 2px solid #27272a; border-radius: 24px;
              padding: 16px 30px; text-align: center;
              font-size: 34px; font-weight: 800; color: #fff;
            }
            .mini-cap span { color: #facc15; }
          </style>
          </head>
          <body>
            <!-- المشهد 1 (0.0 -> 4.5s) -->
            <div id="sc1" class="scene-block">
              <div class="viral-title">لا تدفع <span class="hl-yellow">ليرة واحدة</span><br>على أدوات المونتاج.</div>
              <div class="course-item">
                <div class="course-left"><div class="play-box">▶</div><div><div class="c-title">اشتراكات برامج المونتاج</div><div class="c-sub">قيود شهرية • استهلاك للجهاز</div></div></div>
                <div class="price-btn">$49/شهر</div>
              </div>
              <div class="course-item">
                <div class="course-left"><div class="play-box">▶</div><div><div class="c-title">واجهات API الصوتية المدفوعة</div><div class="c-sub">تكلفة على كل دقيقة</div></div></div>
                <div class="price-btn">$29/شهر</div>
              </div>
            </div>

            <div id="zero_stamp">
              <div class="zero-big">$0</div>
              <div class="zero-txt">مجاني بالكامل 100%</div>
            </div>

            <!-- المشهد 2 (4.5 -> 9.0s) -->
            <div id="sc2" class="scene-block">
              <div class="viral-title">مشاهد تفاعلية حية<br><span class="hl-yellow">تُبنى أوتوماتيكياً.</span></div>
              <div class="browser-box">
                <div class="browser-dots"><div class="b-dot"></div><div class="b-dot"></div><div class="b-dot"></div><span style="color:#71717a;font-size:20px;margin-right:10px">studio.24ofis.com</span></div>
                <div class="search-bar"><span>🔍 تحليل الفيديو وتوليد المشاهد...</span><span style="color:#facc15">AI</span></div>
                <div class="prog-row"><div class="prog-pct">100%</div><div class="prog-track"><div class="prog-fill"></div></div><div class="prog-label">video_01 • transcript</div></div>
                <div class="prog-row"><div class="prog-pct">100%</div><div class="prog-track"><div class="prog-fill"></div></div><div class="prog-label">video_02 • micro_ui</div></div>
                <div class="prog-row"><div class="prog-pct">100%</div><div class="prog-track"><div class="prog-fill"></div></div><div class="prog-label">video_03 • sfx_sync</div></div>
              </div>
            </div>

            <!-- المشهد 3 (9.0 -> 13.0s) -->
            <div id="sc3" class="scene-block">
              <div class="viral-title">الفرق بين العادي<br><span class="hl-yellow">ومصنعك السحابي.</span></div>
              <div class="compare-grid">
                <div class="cmp-card">
                  <div class="cmp-num">01 • قبل</div>
                  <div class="cmp-head" style="color:#a1a1aa">مونتاج تقليدي</div>
                  <div class="cmp-step">نفس الكروت المكررة</div>
                  <div class="cmp-step">عزل خلفية بطيء ومشوه</div>
                  <div class="cmp-step">صوت آلي بدون روح</div>
                </div>
                <div class="cmp-card pro">
                  <div class="cmp-num">02 • الآن ✨</div>
                  <div class="cmp-head" style="color:#facc15">استوديو 24.ofis</div>
                  <div class="cmp-step">واجهات Micro-UI حية</div>
                  <div class="cmp-step">إطار متحدث سينمائي</div>
                  <div class="cmp-step">يعمل بالخلفية بـ 0$</div>
                </div>
              </div>
            </div>

            <!-- المشهد 4 (13.0 -> 16.4s) -->
            <div id="sc4" class="scene-block">
              <div class="viral-title">كل شيء بالخلفية<br><span class="hl-yellow">مجاناً تماماً.</span></div>
              <div class="stack-row"><span class="stack-name">🎬 GitHub Cloud Render</span><span class="stack-free">$0</span></div>
              <div class="stack-row"><span class="stack-name">🎙️ Gemini Director + Whisper</span><span class="stack-free">$0</span></div>
              <div class="stack-row"><span class="stack-name">⚡ FFmpeg + Micro-UI Engine</span><span class="stack-free">$0</span></div>
            </div>

            <div id="cta_btn">🚀 جاهز للنشر الفوري • $0</div>

            <!-- الكابشنات السريعة -->
            <div id="mcap1" class="mini-cap">اختبار المونتاج الذكي <span>بستايل القنوات الكبرى</span></div>
            <div id="mcap2" class="mini-cap">واجهات تفاعلية <span>ومؤثرات في مكانها الدقيق</span></div>
            <div id="mcap3" class="mini-cap">مقارنة حية <span>وكابشن متزامن تلقائياً</span></div>
            <div id="mcap4" class="mini-cap">بدون أي تكاليف إضافية <span>الكرة بملعبك! 🔥</span></div>
          </body>
          </html>"""

          Path("scenes.html").write_text(html_scenes, encoding="utf-8")

          ui_ids = ["sc1", "zero_stamp", "sc2", "sc3", "sc4", "cta_btn", "mcap1", "mcap2", "mcap3", "mcap4"]
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 4000})
              page.goto(f"file://{os.path.abspath('scenes.html')}", wait_until="networkidle")
              page.wait_for_timeout(600)
              for uid in ui_ids:
                  page.locator(f"#{uid}").screenshot(path=f"ui_cards/{uid}.png", omit_background=True)
              browser.close()

          ui = {uid: Image.open(f"ui_cards/{uid}.png").convert("RGBA") for uid in ui_ids}

          # 4. الرندر السريع (بدون rembg - يستغرق ثوانٍ معدودة فقط!)
          print("🎬 [4/4] جاري رندر الفيديو بستايل الإطار السفلي المتحرك والـ Micro-UI...", flush=True)
          W, H = 1080, 1920
          bg_base = Image.new("RGBA", (W, H), (9, 9, 11, 255))
          bg_draw = ImageDraw.Draw(bg_base)
          # نقاط شبكة خفيفة جداً في الخلفية السوداء مثل الفيديو التركي
          for gx in range(60, W, 64):
              for gy in range(60, H, 64):
                  bg_draw.ellipse([gx-1, gy-1, gx+1, gy+1], fill=(255, 255, 255, 18))

          # قناع دائري الحواف لإطار المتحدث السفلي (PiP Rounded Mask)
          CAM_W, CAM_H = 520, 650
          cam_mask = Image.new("L", (CAM_W, CAM_H), 0)
          ImageDraw.Draw(cam_mask).rounded_rectangle([0, 0, CAM_W-1, CAM_H-1], radius=44, fill=255)

          cam_border = Image.new("RGBA", (CAM_W+8, CAM_H+8), (0, 0, 0, 0))
          ImageDraw.Draw(cam_border).rounded_rectangle([0, 0, CAM_W+7, CAM_H+7], radius=48, outline=(63, 63, 70, 220), width=4)

          def ease_out_back(x):
              x = float(np.clip(x, 0.0, 1.0))
              return 1.0 + 2.2 * ((x - 1.0) ** 3) + 1.2 * ((x - 1.0) ** 2)

          def paste_centered(canvas, img, cx, cy, scale=1.0, alpha=1.0, angle=0.0):
              if alpha <= 0.01 or scale <= 0.1:
                  return
              work = img
              if abs(scale - 1.0) > 0.01:
                  work = work.resize((max(10, int(work.width*scale)), max(10, int(work.height*scale))), Image.Resampling.BILINEAR)
              if abs(angle) > 0.2:
                  work = work.rotate(angle, expand=True, resample=Image.Resampling.BICUBIC)
              if alpha < 0.99:
                  work = work.copy()
                  work.putalpha(work.getchannel("A").point(lambda p: int(p * alpha)))
              canvas.paste(work, (int(cx - work.width/2), int(cy - work.height/2)), work)

          cap = cv2.VideoCapture("speaker_cam.mp4")
          fps = 30
          total_frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))

          ffmpeg_proc = subprocess.Popen([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgba", "-r", str(fps), "-i", "-",
              "-i", "final_audio.aac", "-c:v", "libx264", "-preset", "superfast",
              "-crf", "16", "-pix_fmt", "yuv420p", "-c:a", "copy",
              "-shortest", "Turkish_Style_Master.mp4"
          ], stdin=subprocess.PIPE)

          t0 = time.time()
          frame_idx = 0
          while True:
              ret, bgr = cap.read()
              if not ret:
                  break
              t = frame_idx / fps
              canvas = bg_base.copy()

              # --- المسرح العلوي التفاعلي (Top Micro-UI Stage) ---
              if t < 4.5:
                  p = ease_out_back(t / 0.5)
                  paste_centered(canvas, ui["sc1"], W/2, 470 - (1-p)*80, scale=max(0.2, p), alpha=min(1.0, t/0.3))
                  if t >= 2.0:
                      ps = ease_out_back((t - 2.0) / 0.45)
                      paste_centered(canvas, ui["zero_stamp"], W/2, 560, scale=max(0.2, ps), alpha=min(1.0, (t-2.0)/0.2), angle=6.0)
                  cap_img = ui["mcap1"]
              elif t < 9.0:
                  p = ease_out_back((t - 4.5) / 0.5)
                  paste_centered(canvas, ui["sc2"], W/2, 490 - (1-p)*80, scale=max(0.2, p), alpha=min(1.0, (t-4.5)/0.3))
                  cap_img = ui["mcap2"]
              elif t < 13.0:
                  p = ease_out_back((t - 9.0) / 0.5)
                  paste_centered(canvas, ui["sc3"], W/2, 500 - (1-p)*80, scale=max(0.2, p), alpha=min(1.0, (t-9.0)/0.3))
                  cap_img = ui["mcap3"]
              else:
                  p = ease_out_back((t - 13.0) / 0.5)
                  paste_centered(canvas, ui["sc4"], W/2, 430 - (1-p)*80, scale=max(0.2, p), alpha=min(1.0, (t-13.0)/0.3))
                  if t >= 14.2:
                      pb = ease_out_back((t - 14.2) / 0.4)
                      paste_centered(canvas, ui["cta_btn"], W/2, 860, scale=max(0.2, pb), alpha=1.0)
                  cap_img = ui["mcap4"]

              # --- إطار المتحدث السفلي المتحرك (PiP Speaker Card) ---
              rgb = cv2.cvtColor(bgr, cv2.COLOR_BGR2RGB)
              # زوم ديناميكي خفيف داخل الكاميرا عندما يشير بيده
              zoom = 1.08 if (4.5 <= t <= 8.5) else 1.0
              if zoom > 1.0:
                  zh, zw = int(800 / zoom), int(640 / zoom)
                  y0, x0 = (800 - zh)//2, (640 - zw)//2
                  rgb = cv2.resize(rgb[y0:y0+zh, x0:x0+zw], (CAM_W, CAM_H))
              else:
                  rgb = cv2.resize(rgb, (CAM_W, CAM_H))

              spk_pil = Image.fromarray(rgb, "RGB").convert("RGBA")
              spk_pil.putalpha(cam_mask)

              # حركة صعود ونزول ناعمة لإطار المتحدث مثل الفيديو التركي
              cam_y = 1460 + math.sin(t * 2.5) * 8.0
              canvas.paste(cam_border, (int(W/2 - (CAM_W+8)/2), int(cam_y - (CAM_H+8)/2)), cam_border)
              canvas.paste(spk_pil, (int(W/2 - CAM_W/2), int(cam_y - CAM_H/2)), spk_pil)

              # شريط الكابشن فوق إطار المتحدث
              paste_centered(canvas, cap_img, W/2, 1055, scale=1.0, alpha=1.0)

              try:
                  ffmpeg_proc.stdin.write(canvas.tobytes())
              except BrokenPipeError:
                  break

              frame_idx += 1
              if frame_idx % 90 == 0 or frame_idx == total_frames:
                  print(f"⚡ تقدم الرندر السريع: {frame_idx}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

          cap.release()
          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()
          print("✅ اكتمل إنتاج الفيديو بستايل الشاب التركي بنجاح ساحق وتكلفة 0$!", flush=True)
          EOF
          python3 -u viral_turkish_style.py

      - name: 📦 4. رفع الفيديو الجاهز للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: 🎬-Turkish-Viral-Style-Reel
          path: Turkish_Style_Master.mp4
          retention-days: 30

name: 🎬 AI Cinema Video Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_actor:
        description: 'المعلق الصوتي (shakir = رخيم / hamed = رسمي / salma = نسائي)'
        required: false
        default: 'ar-EG-ShakirNeural'

jobs:
  render_cinema_reel:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت المحركات السحابية
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright edge-tts
          playwright install --with-deps chromium

      - name: 🎨 3. الهندسة الصوتية ورندر المشهد السينمائي السريع
        env:
          VOICE_NAME: ${{ github.event.inputs.voice_actor || 'ar-EG-ShakirNeural' }}
        run: |
          cat << 'EOF' > build_studio.py
          import os, subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          os.makedirs("frames", exist_ok=True)
          voice_name = os.environ.get("VOICE_NAME", "ar-EG-ShakirNeural")

          # 1. توليد التعليق الصوتي والماسترينغ الإذاعي
          print("🎙️ [1/4] جاري توليد التعليق الصوتي ومعالجته إذاعياً...", flush=True)
          voice_text = "هل تتخيل أن يتحول كلامك أو فكرتك، إلى فيديو سينمائي متكامل وأنت نائم؟ كروت ثلاثية الأبعاد، مؤثرات صوتية متزامنة، وجودة استوديو احترافية تعمل بالخلفية على مدار الساعة."
          subprocess.run([
              "python3", "-m", "edge_tts",
              "--voice", voice_name, "--rate=-4%", "--pitch=-3Hz",
              "--text", voice_text, "--write-media", "raw_voice.mp3"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", "raw_voice.mp3",
              "-af", "equalizer=f=120:width_type=o:width=2:g=4.5,equalizer=f=3500:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=3:attack=5:release=50:makeup=3dB",
              "voice_mastered.wav"
          ], check=True)

          dur_out = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", "voice_mastered.wav"
          ]).decode().strip()
          duration = float(dur_out) + 1.0
          fps = 24
          total_frames = int(duration * fps)

          # 2. توليد المؤثرات الصوتية السينمائية (Auto-SFX)
          print("🔊 [2/4] جاري توليد ومزامنة المؤثرات الصوتية...", flush=True)
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", f"aevalsrc='0.035*sin(2*PI*65*t)+0.025*sin(2*PI*97.5*t)+0.015*sin(2*PI*130*t)':s=44100:d={duration}",
              "-af", f"afade=t=in:st=0:d=1.0,afade=t=out:st={duration-1.5}:d=1.5",
              "ambient.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "anoisesrc=d=0.45:c=pink:r=44100:a=0.18",
              "-af", "bandpass=f=700:width_type=h:w=500,afade=t=in:st=0:d=0.18,afade=t=out:st=0.22:d=0.23",
              "whoosh.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", "voice_mastered.wav", "-i", "ambient.wav", "-i", "whoosh.wav",
              "-filter_complex",
              "[2:a]adelay=300|300[w0];[2:a]adelay=1400|1400[w1];[2:a]adelay=2900|2900[w2];[2:a]adelay=4400|4400[w3];"
              "[0:a][1:a][w0][w1][w2][w3]amix=inputs=6:duration=first:dropout_transition=0,volume=2.2[aout]",
              "-map", "[aout]", "final_audio.aac"
          ], check=True)

          # 3. بناء المشهد السينمائي الثلاثي الأبعاد (بدون فلاتر Blur المعطلة للمعالج)
          html_scene = """<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              width: 1080px; height: 1920px; overflow: hidden;
              background: radial-gradient(circle at 85% 12%, rgba(249,115,22,0.28) 0%, rgba(15,23,42,0.95) 42%, #050811 85%);
              color: #ffffff; font-family: 'Cairo', sans-serif;
              perspective: 1400px; position: relative;
            }
            .glow-orb {
              position: absolute; width: 900px; height: 900px; border-radius: 50%;
              background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, rgba(14,165,233,0.05) 45%, transparent 70%);
              bottom: -150px; left: -250px; z-index: 1;
            }
            .grid-bg {
              position: absolute; inset: 0; z-index: 1; opacity: 0.12;
              background-image: 
                linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px);
              background-size: 72px 72px;
            }
            .stage {
              position: relative; z-index: 5; width: 100%; height: 100%;
              padding: 110px 75px; display: flex; flex-direction: column;
              justify-content: space-between;
            }
            .header-area { text-align: center; }
            .pill-badge {
              display: inline-flex; align-items: center; gap: 14px;
              background: linear-gradient(135deg, rgba(249,115,22,0.25), rgba(15,23,42,0.9));
              border: 2px solid #f97316;
              padding: 14px 38px; border-radius: 60px; margin-bottom: 36px;
            }
            .dot { width: 16px; height: 16px; border-radius: 50%; background: #fb923c; }
            .pill-text { font-size: 30px; font-weight: 800; color: #fed7aa; }
            .hero-title { font-size: 76px; font-weight: 900; line-height: 1.25; }
            .hero-title .grad { color: #fb923c; }
            .cards-stack { display: flex; flex-direction: column; gap: 38px; margin: 20px 0; }
            .glass-card {
              position: relative; overflow: hidden;
              background: linear-gradient(135deg, rgba(30,41,59,0.92) 0%, rgba(15,23,42,0.96) 100%);
              border: 2px solid rgba(255,255,255,0.18);
              border-right: 10px solid #f97316;
              border-radius: 38px; padding: 42px 45px;
              display: flex; align-items: center; gap: 36px;
              box-shadow: 0 25px 50px rgba(0,0,0,0.65);
            }
            .glass-card.blue-accent { border-right-color: #38bdf8; }
            .glass-card.emerald-accent { border-right-color: #10b981; }
            .shimmer {
              position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
              background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
              transform: skewX(-25deg);
            }
            .icon-box {
              width: 110px; height: 110px; border-radius: 28px; flex-shrink: 0;
              background: linear-gradient(135deg, #f97316, #c2410c);
              display: flex; align-items: center; justify-content: center;
              font-size: 46px; font-weight: 900; color: #fff;
            }
            .blue-accent .icon-box { background: linear-gradient(135deg, #38bdf8, #0284c7); }
            .emerald-accent .icon-box { background: linear-gradient(135deg, #10b981, #047857); }
            .card-body { flex: 1; }
            .card-tag { font-size: 24px; font-weight: 800; color: #fb923c; margin-bottom: 6px; display: block; }
            .blue-accent .card-tag { color: #7dd3fc; }
            .emerald-accent .card-tag { color: #6ee7b7; }
            .card-title { font-size: 44px; font-weight: 900; margin-bottom: 10px; color: #f8fafc; }
            .card-desc { font-size: 30px; font-weight: 600; color: #94a3b8; font-family: 'Tajawal', sans-serif; line-height: 1.4; }
            .footer-bar {
              background: rgba(15,23,42,0.92); border: 2px solid rgba(255,255,255,0.15);
              border-radius: 30px; padding: 28px 42px;
              display: flex; align-items: center; justify-content: space-between;
            }
            .status-text { font-size: 30px; font-weight: 800; color: #e2e8f0; }
            .counter-num { font-size: 44px; font-weight: 900; color: #38bdf8; }
          </style>
          </head>
          <body>
            <div class="glow-orb" id="g2"></div>
            <div class="grid-bg"></div>
            <div class="stage">
              <div class="header-area">
                <div class="pill-badge" id="badge">
                  <div class="dot"></div>
                  <span class="pill-text">محرك الإنتاج السينمائي الذاتي • 24/7</span>
                </div>
                <h1 class="hero-title" id="title">
                  مونتاج احترافي كامل<br>
                  <span class="grad">يعمل بالخلفية وأنت نائم</span>
                </h1>
              </div>
              <div class="cards-stack">
                <div class="glass-card" id="c1">
                  <div class="shimmer" id="sh1"></div>
                  <div class="icon-box">3D</div>
                  <div class="card-body">
                    <span class="card-tag">المرحلة الأولى • التصميم البصري</span>
                    <div class="card-title">كروت زجاجية بعمق ثلاثي الأبعاد</div>
                    <div class="card-desc">تحريك سينمائي انسيابي مع إضاءات وانعكاسات حقيقية بدقة 1080p</div>
                  </div>
                </div>
                <div class="glass-card blue-accent" id="c2">
                  <div class="shimmer" id="sh2"></div>
                  <div class="icon-box">SFX</div>
                  <div class="card-body">
                    <span class="card-tag">المرحلة الثانية • الهندسة الصوتية</span>
                    <div class="card-title">ماسترينغ إذاعي ومؤثرات متزامنة</div>
                    <div class="card-desc">دمج تلقائي لأصوات الانتقالات والخلفيات المحيطية بالجزء من الثانية</div>
                  </div>
                </div>
                <div class="glass-card emerald-accent" id="c3">
                  <div class="shimmer" id="sh3"></div>
                  <div class="icon-box">AI</div>
                  <div class="card-body">
                    <span class="card-tag">المرحلة الثالثة • الأتمتة الكاملة</span>
                    <div class="card-title">قص ذكي واستلام عبر التليجرام</div>
                    <div class="card-desc">طابور مهام سحابي ينجز فيديوهاتك المصورة والموشن بدون تدخل يدوي</div>
                  </div>
                </div>
              </div>
              <div class="footer-bar" id="footer">
                <div class="status-text">⚡ كفاءة خط الإنتاج الأوتوماتيكي</div>
                <div class="counter-num"><span id="cnt">0</span>%</div>
              </div>
            </div>
          <script>
            window.tl = gsap.timeline({ paused: true });
            window.tl.from("#badge", { y: -60, opacity: 0, duration: 0.7, ease: "back.out(1.7)" }, 0.15)
                     .from("#title", { scale: 0.85, y: 35, opacity: 0, duration: 0.8, ease: "power4.out" }, 0.35)
                     .from("#c1", { x: 220, rotationY: -20, opacity: 0, duration: 0.8, ease: "back.out(1.4)" }, 1.35)
                     .to("#sh1", { left: "140%", duration: 0.85, ease: "power2.inOut" }, 1.85)
                     .from("#c2", { x: 220, rotationY: -20, opacity: 0, duration: 0.8, ease: "back.out(1.4)" }, 2.85)
                     .to("#sh2", { left: "140%", duration: 0.85, ease: "power2.inOut" }, 3.35)
                     .from("#c3", { x: 220, rotationY: -20, opacity: 0, duration: 0.8, ease: "back.out(1.4)" }, 4.35)
                     .to("#sh3", { left: "140%", duration: 0.85, ease: "power2.inOut" }, 4.85);
            let obj = { val: 0 };
            window.tl.from("#footer", { y: 70, opacity: 0, duration: 0.7, ease: "power3.out" }, 1.0)
                     .to(obj, {
                       val: 100, duration: 5.5, ease: "power2.out",
                       onUpdate: function() { document.getElementById("cnt").innerText = Math.round(obj.val); }
                     }, 1.2);
          </script>
          </body>
          </html>"""

          Path("scene.html").write_text(html_scene, encoding="utf-8")

          # 4. تصوير المشهد مع طباعة فورية للعداد
          print(f"🎬 [3/4] بدء رندر {total_frames} إطاراً بدقة Full HD 1080x1920...", flush=True)
          t0 = time.time()
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 1920})
              page.goto(f"file://{os.path.abspath('scene.html')}", wait_until="domcontentloaded")
              page.wait_for_timeout(1200)
              for i in range(total_frames):
                  page.evaluate(f"window.tl.time({i / fps})")
                  page.screenshot(path=f"frames/f_{i:04d}.jpg", type="jpeg", quality=92)
                  if i % 48 == 0 or i == total_frames - 1:
                      elapsed = time.time() - t0
                      print(f"⚡ تقدم الرندر: {i+1}/{total_frames} إطار ({elapsed:.1f} ثانية)", flush=True)
              browser.close()

          # 5. التصدير النهائي
          print("🚀 [4/4] جاري دمج الفيديو النهائي...", flush=True)
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-framerate", str(fps),
              "-i", "frames/f_%04d.jpg", "-i", "final_audio.aac",
              "-c:v", "libx264", "-preset", "fast", "-crf", "18",
              "-pix_fmt", "yuv420p", "-c:a", "copy",
              "-shortest", "Studio_Master_Reel.mp4"
          ], check=True)
          print("✅ اكتمل إنتاج الفيديو السينمائي بنجاح!", flush=True)
          EOF
          python3 -u build_studio.py

      - name: 📦 4. رفع الفيديو الجاهز للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: 🎬-Finished-Cinema-Reel-MP4
          path: Studio_Master_Reel.mp4
          retention-days: 30

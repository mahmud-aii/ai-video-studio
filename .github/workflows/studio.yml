captions_timeline = [
              ("cap0", "الفيديو الماضي كان على خلفية", "بتشبه لون شعري ولون بشرتي 🎨", "0.0, 4.75"),
              ("cap1", "عم حاول هلق أصور", "على خلفية بيضاء صافية ⚪", "4.75, 7.85"),
              ("cap2", "حطيت فاصل صامت لأشوفك", "إذا رح تعرف تقصه أو لا ✂️", "7.85, 11.95"),
              ("cap3", "بدي إياك تحط الكابشن", "تماماً هون بأسفل الشاشة! 👇", "11.95, 15.15"),
              ("cap4", "ولا تنسى النص الفوقاني", "تحط فيه ما يناسب الكلام 🔝", "15.15, 18.95"),
              ("cap5", "تم قص الخطأ والإعادة..", "وخلينا نشوف شو طلع معك! 🔥", "18.95, 22.80")
          ]

          caps_html = ""
          for cid, l1, l2, _ in captions_timeline:
              caps_html += f'<div id="{cid}" class="bot-cap"><div class="c1">{l1}</div><div class="c2">{l2}</div></div>'

          html_ui = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl"><head><meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
          <style>
            * {{ box-sizing: border-box; margin: 0; padding: 0; }}
            body {{ background: transparent; font-family: 'Cairo', sans-serif; color: #fff; width: 1080px; padding: 20px; }}
            .top-card {{
              width: 960px; padding: 26px 32px; margin-bottom: 35px;
              background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(9,13,24,0.98));
              border: 2.5px solid rgba(250,204,21,0.45); border-right: 12px solid #facc15;
              border-radius: 34px; display: flex; align-items: center; gap: 28px;
              box-shadow: 0 22px 45px rgba(0,0,0,0.8);
            }}
            .top-card.cyan {{ border-right-color: #38bdf8; border-color: rgba(56,189,248,0.45); }}
            .top-card.green {{ border-right-color: #10b981; border-color: rgba(16,185,129,0.45); }}
            .t-img {{ width: 135px; height: 135px; border-radius: 24px; object-fit: cover; border: 3px solid #facc15; flex-shrink: 0; }}
            .cyan .t-img {{ border-color: #38bdf8; }}
            .green .t-img {{ border-color: #10b981; }}
            .t-tag {{ font-size: 22px; font-weight: 800; color: #facc15; margin-bottom: 6px; display: block; }}
            .cyan .t-tag {{ color: #38bdf8; }}
            .green .t-tag {{ color: #34d399; }}
            .t-title {{ font-size: 38px; font-weight: 900; color: #fff; line-height: 1.25; margin-bottom: 8px; }}
            .t-sub {{ font-size: 25px; font-weight: 700; color: #cbd5e1; }}
            .bot-cap {{
              width: 960px; padding: 20px 34px; margin-bottom: 30px;
              background: rgba(9, 13, 24, 0.94); border: 3px solid rgba(255,255,255,0.22);
              border-bottom: 9px solid #facc15; border-radius: 32px; text-align: center;
              box-shadow: 0 20px 45px rgba(0,0,0,0.9);
            }}
            .c1 {{ font-size: 36px; font-weight: 800; color: #f8fafc; line-height: 1.25; }}
            .c2 {{ font-size: 44px; font-weight: 900; color: #facc15; line-height: 1.3; }}
          </style></head><body>
            <div id="top0" class="top-card">
              <img class="t-img" src="{p1_uri}"/>
              <div><span class="t-tag">🎨 01 • معالجة التباين اللوني</span><div class="t-title">تجاوز مشكلة الخلفية البيج السابقة</div><div class="t-sub">فصل ذكي للون البشرة والشعر عن الخلفية</div></div>
            </div>
            <div id="top1" class="top-card cyan">
              <img class="t-img" src="{p2_uri}"/>
              <div><span class="t-tag">⚪ 02 • الخلفية البيضاء الصافية</span><div class="t-title">عزل نقي 100% بدون هالة بيضاء</div><div class="t-sub">تنظيف تلقائي لأطراف الشعر واللحية (Alpha Choke)</div></div>
            </div>
            <div id="top2" class="top-card green">
              <img class="t-img" src="{p3_uri}"/>
              <div><span class="t-tag">✂️ 03 • قص الصمت التلقائي</span><div class="t-title">تم حذف الفاصل الصامت بنجاح!</div><div class="t-sub">اكتشاف السكتات ودمج الجمل بسلاسة تامة</div></div>
            </div>
            <div id="top3" class="top-card">
              <img class="t-img" src="{p1_uri}"/>
              <div><span class="t-tag">👇 04 • تمركز الكابشن السفلي</span><div class="t-title">الكابشن مثبت بأسفل الشاشة تماماً</div><div class="t-sub">متزامن كلمة بكلمة مع حركة يدك وصوتك</div></div>
            </div>
            <div id="top4" class="top-card cyan">
              <img class="t-img" src="{p2_uri}"/>
              <div><span class="t-tag">🔝 05 • المسرح التفاعلي العلوي</span><div class="t-title">نصوص وصور تتغير حسب سياق كلامك</div><div class="t-sub">كل جملة تنطقها يظهر فوقها الكرت المناسب لها</div></div>
            </div>
            <div id="top5" class="top-card green">
              <img class="t-img" src="{p3_uri}"/>
              <div><span class="t-tag">🔥 06 • قص الأخطاء والإعادة</span><div class="t-title">تم حذف اللعثمة وإعادة الجملة تلقائياً</div><div class="t-sub">مونتاج كامل جاهز للنشر الفوري بتكلفة 0$</div></div>
            </div>
            {caps_html}
          </body></html>"""

          Path("ui.html").write_text(html_ui, encoding="utf-8")
          ui_ids = [f"top{k}" for k in range(6)] + [c[0] for c in captions_timeline]
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 4200})
              page.goto(f"file://{os.path.abspath('ui.html')}", wait_until="networkidle")
              page.wait_for_timeout(600)
              for uid in ui_ids:
                  page.locator(f"#{uid}").screenshot(path=f"ui_layers/{uid}.png", omit_background=True)
              browser.close()

          ui = {uid: Image.open(f"ui_layers/{uid}.png").convert("RGBA") for uid in ui_ids}

          W, H = 1080, 1920
          SW, SH = 860, 1180
          y_idx, x_idx = np.ogrid[:H, :W]
          glow = np.clip(1.0 - np.sqrt((x_idx - W*0.5)**2 + (y_idx - 1250)**2) / 620.0, 0, 1)
          bg_arr = np.stack([
              (10 + 25 * glow).astype(np.uint8),
              (14 + 45 * glow).astype(np.uint8),
              (24 + 85 * glow).astype(np.uint8)
          ], axis=-1)
          bg_base = Image.fromarray(bg_arr, "RGB").convert("RGBA")
          bg_dr = ImageDraw.Draw(bg_base)
          for gx in range(60, W, 64):
              for gy in range(60, H, 64):
                  bg_dr.ellipse([gx-1, gy-1, gx+1, gy+1], fill=(255, 255, 255, 20))

          def ease_back(x):
              x = float(np.clip(x, 0.0, 1.0))
              return 1.0 + 2.3 * ((x - 1.0) ** 3) + 1.3 * ((x - 1.0) ** 2)

          def paste_ui(canvas, img, cx, cy, scale=1.0, alpha=1.0):
              if alpha <= 0.01 or scale <= 0.1:
                  return
              work = img
              if abs(scale - 1.0) > 0.01:
                  work = work.resize((max(10, int(work.width*scale)), max(10, int(work.height*scale))), Image.Resampling.BILINEAR)
              if alpha < 0.99:
                  work = work.copy()
                  work.putalpha(work.getchannel("A").point(lambda p: int(p * alpha)))
              canvas.paste(work, (int(cx - work.width/2), int(cy - work.height/2)), work)

          vid_list = [f for f in ["trimmed_video.mp4", "clean_video.mp4", "speaker_crop.mp4"] if os.path.exists(f)]
          work_vid = vid_list[0] if vid_list else "raw_input.mp4"
          aud_list = [f for f in ["final_audio.aac", "clean_audio.aac", "voice_clean.wav"] if os.path.exists(f)]
          work_aud = aud_list[0] if aud_list else work_vid

          session = new_session("u2net_human_seg")
          cap = cv2.VideoCapture(work_vid)
          fps = 30
          total_frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))

          ffmpeg_proc = subprocess.Popen([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgba", "-r", str(fps), "-i", "-",
              "-i", work_aud, "-c:v", "libx264", "-preset", "superfast",
              "-crf", "16", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "320k",
              "-shortest", "Smart_Edited_Reel.mp4"
          ], stdin=subprocess.PIPE)

          erode_k = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (5, 5))
          last_m, smooth_m = None, None
          t0 = time.time()
          frame_idx = 0

          while True:
              ret, bgr = cap.read()
              if not ret:
                  break
              t = frame_idx / fps
              bgr_s = cv2.resize(bgr, (SW, SH))
              rgb = cv2.cvtColor(bgr_s, cv2.COLOR_BGR2RGB)

              if frame_idx % 2 == 0 or last_m is None:
                  sm = cv2.resize(rgb, (320, 440))
                  raw_m = np.array(remove(Image.fromarray(sm), session=session, only_mask=True), dtype=np.float32) / 255.0
                  last_m = np.clip((raw_m - 0.48) / 0.45, 0.0, 1.0)

              smooth_m = last_m if smooth_m is None else (0.75 * last_m + 0.25 * smooth_m)
              mask_full = cv2.resize(smooth_m, (SW, SH), interpolation=cv2.INTER_LINEAR)

              # إزالة أي بكسلات بيضاء ساطعة على حواف الشعر (White Wall Despill)
              luma = (0.299 * rgb[...,0] + 0.587 * rgb[...,1] + 0.114 * rgb[...,2]) / 255.0
              edge_band = (mask_full > 0.05) & (mask_full < 0.92)
              white_spill = edge_band & (luma > 0.78)
              mask_full[white_spill] *= 0.15

              mask_clean = cv2.GaussianBlur(cv2.erode(mask_full, erode_k, iterations=1), (5, 5), 0)
              rgb_clean = (rgb.astype(np.float32) * np.clip(mask_clean * 1.25, 0.2, 1.0)[..., None]).clip(0, 255).astype(np.uint8)

              canvas = bg_base.copy()
              person_pil = Image.fromarray(rgb_clean, "RGB").convert("RGBA")
              person_pil.putalpha(Image.fromarray((mask_clean * 255).clip(0, 255).astype(np.uint8)))
              canvas.paste(person_pil, (int((W - SW)/2), 540), person_pil)

              for idx, (cid, _, _, trange) in enumerate(captions_timeline):
                  ts, te = [float(x) for x in trange.split(",")]
                  if ts <= t < te or (idx == len(captions_timeline)-1 and t >= ts):
                      p_in = ease_back((t - ts) / 0.4)
                      # 1. النص الفوقاني المتزامن مع كل جملة (أعلى الشاشة)
                      paste_ui(canvas, ui[f"top{idx}"], W/2, 270 - (1-p_in)*60, scale=max(0.2, p_in), alpha=min(1.0, (t-ts)/0.25))
                      # 2. الكابشن في أسفل الشاشة تماماً كما أشار محمود
                      cap_boost = 1.07 if cid == "cap3" else 1.0
                      paste_ui(canvas, ui[cid], W/2, 1735, scale=cap_boost * min(1.04, max(0.75, p_in)), alpha=1.0)
                      break

              try:
                  ffmpeg_proc.stdin.write(canvas.tobytes())
              except BrokenPipeError:
                  break
              frame_idx += 1
              if frame_idx % 60 == 0 or frame_idx == total_frames:
                  print(f"⚡ تقدم الرندر الذكي: {frame_idx}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

          cap.release()
          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()
          print("✅ اكتمل مونتاج الفيديو الجديد بنجاح ساحق!", flush=True)
          EOF
          python3 -u $(ls -t *.py | head -n 1)

      - name: 📦 4. رفع الفيديو الجاهز للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: 🎬-Smart-WhiteBG-Edited-Reel
          path: Smart_Edited_Reel.mp4
          retention-days: 30

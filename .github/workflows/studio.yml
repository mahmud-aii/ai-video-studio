                  // في المشهد الرابع تنزلق البطاقة جزئياً لإبراز النوافذ الثلاث ثم تصعد
                  dockSlideY = (prog < 0.65) ? 240 : Math.max(0, 240 - (prog - 0.65) * 900);
                } else {
                  const enterP = easeOutBack(tScene / 0.45);
                  dockSlideY = (1 - enterP) * 320;
                }
                dock.style.transform = 'translateY(' + dockSlideY + 'px)';
                pillWrap.style.transform = 'translateY(' + (dockSlideY * 0.38) + 'px)';

                // 3. تحريك عناصر الـ Micro-UI داخل كل مشهد
                const cursorSvg = document.getElementById('cursor-svg');
                const cArrow = document.getElementById('c-arrow');
                const cRing = document.getElementById('c-ring');
                cursorSvg.style.display = 'none';


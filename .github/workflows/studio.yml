            <script>
              const SCENES = __SCENES_JSON__;
              const TOTAL_DUR = __TOTAL_DUR__;

              const DOCK_DATA = [
                { tag: 'ALERT // 01', big: 'إعلانات بدون أتمتة = نزيف مستمر', sub: 'ضياع العملاء في زحمة الواتساب والورق اليدوي', metric: '-$4,850 / MO' },
                { tag: 'SHIFT // 02', big: 'نبني (عقل) أعمالك الرقمي المتكامل', sub: 'منظومة SaaS تربط التسويق بالإدارة والمبيعات', metric: '100% AUTOMATED' },
                { tag: 'MAGIC // 03', big: 'لا تدخل بشري.. ولا عملاء ضائعين!', sub: 'من إعلان فيسبوك لشاشة السكرتيرة والواتساب في ثانية', metric: '0.1s WEBHOOK' },
                { tag: 'CLOUD // 04', big: 'سيطرة كاملة من أي مكان في العالم', sub: 'عيادات طبية • شركات عقارية • مراكز أعمال', metric: '24/7 CONTROL' },
                { tag: 'START // 05', big: 'لا تسوّق فقط.. قُد سوقك بذكاء.', sub: 'تواصل مع TEKVIYO اليوم واحجز استشارتك للمستقبل', metric: 'TEKVIYO.COM' }
              ];

              function easeOutBack(x) {
                x = Math.max(0, Math.min(1, x));
                return 1 + 2.3 * Math.pow(x - 1, 3) + 1.3 * Math.pow(x - 1, 2);
              }

              function wTime(sc, idx) {
                const wt = sc.word_times;
                const safeIdx = Math.max(0, Math.min(wt.length - 1, idx));
                return wt[safeIdx].start;
              }

              function placeCursorAtElement(el, approachProg, isClicking) {
                const rect = el.getBoundingClientRect();
                const targetX = rect.left + rect.width * 0.52;
                const targetY = rect.top + rect.height * 0.54;
                const startX = targetX + 340;
                const startY = targetY + 240;
                const p = Math.max(0, Math.min(1, approachProg));
                const easeP = 1 - Math.pow(1 - p, 3);
                const cx = startX + (targetX - startX) * easeP;
                const cy = startY + (targetY - startY) * easeP;

                const cursorSvg = document.getElementById('cursor-svg');
                const cArrow = document.getElementById('c-arrow');
                const cRing = document.getElementById('c-ring');
                cursorSvg.style.display = 'block';
                cArrow.setAttribute('transform', 'translate(' + cx.toFixed(1) + ',' + cy.toFixed(1) + ')');
                cRing.setAttribute('cx', cx.toFixed(1));
                cRing.setAttribute('cy', cy.toFixed(1));
                cRing.setAttribute('opacity', isClicking ? '1' : '0');
              }

              window.renderFrame = function(scIdx, tGlobal, tScene) {
                const sc = SCENES[scIdx];
                const durScene = sc.duration;
                const prog = Math.max(0, Math.min(1, tScene / Math.max(0.1, durScene)));

                document.getElementById('ch-num').innerText = sc.num_tag;
                document.getElementById('ch-title').innerText = sc.title_tag;
                document.getElementById('pace-fill').style.width = ((tGlobal / TOTAL_DUR) * 100).toFixed(2) + '%';

                for (let i = 1; i <= 5; i++) {
                  document.getElementById('sc-' + i).style.display = (i === scIdx + 1) ? 'flex' : 'none';
                }

                // 1. العثور على الكلمة المنطوقة الحالية بالضبط من توقيتات Faster-Whisper!
                const wt = sc.word_times;
                let wIdx = 0;
                for (let k = 0; k < wt.length; k++) {
                  if (tScene >= wt[k].start - 0.02) {
                    wIdx = k;
                  }
                }
                const wObj = wt[wIdx];
                const currentWord = wObj.word;
                const wSpan = Math.max(0.08, wObj.end - wObj.start);
                const wLocalProg = Math.max(0, Math.min(1, (tScene - wObj.start) / wSpan));

                const isHighlight = sc.highlights.indexOf(currentWord) !== -1;
                const pill = document.getElementById('single-word-pill');
                pill.innerText = currentWord;
                const popBounce = Math.sin(wLocalProg * Math.PI);
                const pillScale = isHighlight ? (1.06 + 0.10 * popBounce) : (0.97 + 0.05 * popBounce);
                pill.style.background = isHighlight ? '#F05A28' : '#141519';
                pill.style.transform = 'scale(' + pillScale.toFixed(3) + ')';

                // 2. انزلاق البطاقة السفلية بتناغم مباشر مع لحظات السرد
                const dock = document.getElementById('sliding-bottom-dock');
                const pillWrap = document.getElementById('word-pill-wrap');
                const dInfo = DOCK_DATA[scIdx];
                document.getElementById('dock-tag').innerText = dInfo.tag;
                document.getElementById('dock-big').innerText = dInfo.big;
                document.getElementById('dock-sub').innerText = dInfo.sub;
                document.getElementById('dock-metric').innerText = dInfo.metric;

                let dockSlideY = 0;
                if (scIdx === 2) {
                  // تنزلق للأسفل عند بدء شرح الـ Webhook وتصعد لحظة نطق "لا تدخل بشري ولا عملاء ضائعين" (الكلمة 25)
                  const tUp = wTime(sc, 25);
                  if (tScene < tUp) {
                    dockSlideY = Math.min(485, (tScene / 0.38) * 485);
                  } else {
                    const pUp = easeOutBack((tScene - tUp) / 0.36);
                    dockSlideY = Math.max(0, 485 * (1 - pUp));
                  }
                } else if (scIdx === 3) {
                  // تنزلق جزئياً لإظهار شريط مؤشرات السيطرة ثم تصعد عند "من أي مكان في العالم" (الكلمة 19)
                  const tUp4 = wTime(sc, 19);
                  if (tScene < tUp4) {
                    dockSlideY = Math.min(340, (tScene / 0.35) * 340);
                  } else {
                    const pUp4 = easeOutBack((tScene - tUp4) / 0.36);
                    dockSlideY = Math.max(0, 340 * (1 - pUp4));
                  }
                } else {
                  const enterP = easeOutBack(tScene / 0.32);
                  dockSlideY = (1 - enterP) * 280;
                }
                dock.style.transform = 'translateY(' + dockSlideY.toFixed(1) + 'px)';
                pillWrap.style.transform = 'translateY(' + (dockSlideY * 0.34).toFixed(1) + 'px)';

                document.getElementById('cursor-svg').style.display = 'none';

                // 3. تحريك كل مشهد بناءً على توقيت الكلمة المنطوقة بالمللي ثانية!
                if (scIdx === 0) {
                  const p1 = easeOutBack(tScene / 0.32);
                  document.getElementById('s1-main').style.transform = 'scale(' + p1.toFixed(3) + ')';

                  const tLost = wTime(sc, 7); // "يضيعون!"
                  const tWa   = wTime(sc, 11); // "الواتساب،"
                  const tMan  = wTime(sc, 15); // "الإدخال"
                  const tCh   = wTime(sc, 17); // "والفوضى؟"

                  const lossRatio = Math.min(1, tScene / Math.max(0.4, tLost));
                  const lossVal = Math.floor(1250 + lossRatio * 3600);
                  document.getElementById('s1-big-num').innerText = '-$' + lossVal.toLocaleString();

                  const stP = (tScene >= tLost) ? easeOutBack((tScene - tLost) / 0.25) : 0;
                  document.getElementById('s1-stamp').style.transform = 'rotate(-5deg) scale(' + stP.toFixed(3) + ')';

                  document.getElementById('b1').className = (tScene >= wTime(sc, 4)) ? 'g-box active-warn' : 'g-box';
                  const b2El = document.getElementById('b2');
                  b2El.className = (tScene >= tWa) ? 'g-box active-warn' : 'g-box';
                  b2El.style.transform = (tScene >= tWa && tScene < tMan) ? ('translateX(' + (Math.sin(tGlobal*38)*6).toFixed(1) + 'px)') : 'none';

                  ['b3', 'b4', 'b5'].forEach(function(bid, idx) {
                    document.getElementById(bid).className = (tScene >= tMan + idx*0.12) ? 'g-box active-warn' : 'g-box';
                  });

                  const isChaos = (tScene >= tCh - 0.05);
                  document.getElementById('b6-txt').innerText = isChaos ? '[ فوضى! ]' : '[ ? ]';
                  document.getElementById('b6').style.transform = isChaos ? ('scale(' + (0.9 + 0.16*easeOutBack((tScene-tCh)/0.25)).toFixed(3) + ') rotate(-2deg)') : 'scale(1)';
                }
                else if (scIdx === 1) {
                  const p2 = easeOutBack(tScene / 0.32);
                  document.getElementById('s2-core').style.transform = 'scale(' + p2.toFixed(3) + ')';

                  const tBrand = wTime(sc, 6);  // "TEKVIYO"
                  const tAds   = wTime(sc, 11); // "إعلانات"
                  const tBrain = wTime(sc, 15); // "(عقل)"

                  const bBoost = (tScene >= tBrand && tScene < tBrand + 0.45) ? (1 + 0.08 * Math.sin(((tScene - tBrand)/0.45)*Math.PI)) : 1;
                  document.getElementById('s2-brand').style.transform = 'scale(' + bBoost.toFixed(3) + ')';

                  const pDiag = easeOutBack((tScene - 0.25) / 0.35);
                  document.getElementById('s2-diagram').style.transform = 'scale(' + Math.max(0.01, pDiag).toFixed(3) + ')';

                  const dashOff = -(tGlobal * 65);
                  ['s2-line-1', 's2-line-2', 's2-line-3'].forEach(function(lid) {
                    document.getElementById(lid).setAttribute('stroke-dashoffset', dashOff.toFixed(1));
                  });

                  document.getElementById('s2-n1').setAttribute('fill', (tScene >= tAds) ? '#FFF7ED' : '#FFFFFF');
                  document.getElementById('s2-n3').setAttribute('fill', (tScene >= tBrain) ? '#ECFDF5' : '#FFFFFF');
                }
                else if (scIdx === 2) {
                  // التوقيت الدقيق لكلمات المشهد الثالث من Whisper:
                  // 13="يضغط", 17="تظهر", 20="سكرتيرتك،", 21="ورسالة", 24="أوتوماتيكياً!"
                  const tClick = wTime(sc, 13);
                  const tShow  = wTime(sc, 17);
                  const tSec   = wTime(sc, 20);
                  const tMsg   = wTime(sc, 21);

                  const pForm = easeOutBack(tScene / 0.30);
                  document.getElementById('s3-form').style.transform = 'scale(' + pForm.toFixed(3) + ')';

                  const isClicking = (tScene >= tClick - 0.04 && tScene <= tClick + 0.22);
                  const btn3 = document.getElementById('s3-submit-btn');
                  btn3.style.background = (tScene >= tClick) ? '#F05A28' : '#141519';
                  btn3.style.transform = isClicking ? 'scale(0.91)' : 'scale(1)';

                  document.getElementById('s3-pipe').setAttribute('stroke-dashoffset', (-(tGlobal * 80)).toFixed(1));
                  const pktBoost = (tScene >= tClick && tScene <= tShow) ? (1.14 + 0.06 * Math.sin(tGlobal*25)) : 1.0;
                  document.getElementById('s3-packet').style.transform = 'scale(' + pktBoost.toFixed(3) + ')';

                  // ظهور شاشة السكرتيرة بالضبط عند كلمة "تظهر" (وليس قبلها بـ 4 ثوانٍ!)
                  const pDb = (tScene >= tShow - 0.08) ? easeOutBack((tScene - (tShow - 0.08)) / 0.30) : 0;
                  const dbEl = document.getElementById('s3-db');
                  dbEl.style.transform = 'scale(' + Math.max(0.001, pDb).toFixed(3) + ')';
                  dbEl.style.opacity = (pDb > 0.02) ? '1' : '0';

                  const st3 = (tScene >= tSec - 0.10) ? easeOutBack((tScene - (tSec - 0.10)) / 0.24) : 0;
                  document.getElementById('s3-stamp').style.transform = 'rotate(-4deg) scale(' + st3.toFixed(3) + ')';

                  ['db-p1', 'db-p2', 'db-p3'].forEach(function(pid, idx) {
                    const dp = (tScene >= tShow + idx * 0.10) ? easeOutBack((tScene - (tShow + idx * 0.10)) / 0.25) : 0;
                    document.getElementById(pid).style.transform = 'scale(' + Math.max(0.001, dp).toFixed(3) + ')';
                  });

                  // ظهور رسالة الواتساب بالضبط عند كلمة "ورسالة"
                  const pWa = (tScene >= tMsg - 0.06) ? easeOutBack((tScene - (tMsg - 0.06)) / 0.30) : 0;
                  const waEl = document.getElementById('s3-wa');
                  waEl.style.transform = 'scale(' + Math.max(0.001, pWa).toFixed(3) + ')';
                  waEl.style.opacity = (pWa > 0.02) ? '1' : '0';

                  // الماوس يظهر قبل كلمة "يضغط" بـ 0.75 ثانية وينقر في قلب الزر تماماً لحظة نطق "يضغط"!
                  if (tScene >= tClick - 0.75 && tScene <= tClick + 0.32) {
                    const approach = (tScene - (tClick - 0.75)) / 0.75;
                    placeCursorAtElement(btn3, approach, isClicking);
                  }
                }
                else if (scIdx === 3) {
                  // 2="عيادة", 4="مؤسسة", 7="مركز", 13="السيطرة", 16="موظفيك،", 17="مبيعاتك،", 18="ونموك،"
                  const triggers = [
                    ['s4-w1', Math.max(0, wTime(sc, 2) - 0.12)],
                    ['s4-w2', Math.max(0, wTime(sc, 4) - 0.08)],
                    ['s4-w3', Math.max(0, wTime(sc, 7) - 0.08)]
                  ];
                  triggers.forEach(function(pair) {
                    const el = document.getElementById(pair[0]);
                    const ts = pair[1];
                    const pw = (tScene >= ts) ? easeOutBack((tScene - ts) / 0.30) : 0;
                    el.style.transform = 'translateX(' + ((1 - Math.min(1, pw)) * 70).toFixed(1) + 'px) scale(' + Math.max(0.001, pw).toFixed(3) + ')';
                    el.style.opacity = (pw > 0.02) ? '1' : '0';
                  });

                  const tCtrl = wTime(sc, 13);
                  const kpiRow = document.getElementById('s4-kpis');
                  kpiRow.style.opacity = (tScene >= tCtrl - 0.1) ? '1' : '0';

                  const kpiTimes = [wTime(sc, 16), wTime(sc, 17), wTime(sc, 18)];
                  ['kpi-1', 'kpi-2', 'kpi-3'].forEach(function(kid, idx) {
                    const kt = kpiTimes[idx];
                    const kEl = document.getElementById(kid);
                    const kp = (tScene >= tCtrl - 0.1) ? easeOutBack((tScene - (tCtrl - 0.1 + idx*0.08)) / 0.28) : 0;
                    const active = (tScene >= kt - 0.05);
                    kEl.style.background = active ? (idx === 2 ? '#4ADE80' : '#F05A28') : '#FFFFFF';
                    kEl.querySelector('.kpi-val').style.color = active ? (idx === 2 ? '#141519' : '#FFFFFF') : '#141519';
                    kEl.querySelector('.kpi-lbl').style.color = active ? (idx === 2 ? '#141519' : '#FFFFFF') : '#52525B';
                    kEl.style.transform = 'scale(' + (active ? (1.05 * Math.min(1, kp)) : Math.max(0.001, kp)).toFixed(3) + ')';
                  });
                }
                else if (scIdx === 4) {
                  // 7="تُقهر!", 8="تواصل", 12="واحجز"
                  const tUnb  = wTime(sc, 7);
                  const tCont = wTime(sc, 8);
                  const tBook = wTime(sc, 12);

                  const pTop = easeOutBack(tScene / 0.30);
                  document.getElementById('s5-top').style.transform = 'scale(' + pTop.toFixed(3) + ')';

                  const st5 = (tScene >= tUnb - 0.05) ? easeOutBack((tScene - (tUnb - 0.05)) / 0.25) : 0;
                  document.getElementById('s5-stamp').style.transform = 'rotate(-5deg) scale(' + st5.toFixed(3) + ')';

                  const pBox = (tScene >= 0.25) ? easeOutBack((tScene - 0.25) / 0.32) : 0;
                  document.getElementById('s5-box').style.transform = 'scale(' + Math.max(0.001, pBox).toFixed(3) + ')';

                  const domainStr = 'www.tekviyo.com';
                  const typeRatio = Math.max(0, Math.min(1, (tScene - (tCont - 0.2)) / Math.max(0.35, tBook - tCont)));
                  const cLen = Math.floor(typeRatio * domainStr.length);
                  document.getElementById('s5-typed').innerText = domainStr.substring(0, cLen);

                  const sendBtn = document.getElementById('s5-send');
                  const click5 = (tScene >= tBook - 0.04 && tScene <= tBook + 0.24);
                  const booked = (tScene >= tBook + 0.12);
                  sendBtn.style.background = booked ? '#4ADE80' : '#F05A28';
                  sendBtn.style.color = booked ? '#141519' : '#FFFFFF';
                  sendBtn.innerText = booked ? 'تم الحجز ✓' : 'احجز الآن ↗';
                  sendBtn.style.transform = click5 ? 'scale(0.91)' : 'scale(1)';

                  if (tScene >= tBook - 0.70 && tScene <= tBook + 0.45) {
                    const app5 = (tScene - (tBook - 0.70)) / 0.70;
                    placeCursorAtElement(sendBtn, app5, click5);
                  }
                }
              };
            </script>
          </body>
          </html>""".replace("__SCENES_JSON__", scenes_json).replace("__TOTAL_DUR__", f"{total_dur:.4f}")

          Path("synced_stage.html").write_text(html_stage, encoding="utf-8")

          print("🎬 [4/5] رندر 30 إطاراً حقيقياً في الثانية بتزامن Whisper الكامل...", flush=True)
          fps = 30
          total_frames = int(total_dur * fps)

          ffmpeg_proc = subprocess.Popen([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "image2pipe", "-vcodec", "mjpeg", "-r", str(fps), "-i", "-",
              "-i", "final_audio.aac",
              "-c:v", "libx264", "-preset", "superfast", "-crf", "16", "-pix_fmt", "yuv420p",
              "-c:a", "copy", "-shortest", "TEKVIYO_Synced_Fast.mp4"
          ], stdin=subprocess.PIPE)

          qa_snapshots = {}
          t0 = time.time()

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 1920})
              page.goto(f"file://{os.path.abspath('synced_stage.html')}", wait_until="networkidle")
              page.evaluate("() => document.fonts.ready")
              page.wait_for_timeout(300)

              for i in range(total_frames):
                  t = i / fps
                  sc_idx = 0
                  for k in range(5):
                      if t >= s_starts[k]:
                          sc_idx = k
                  t_sc = t - s_starts[sc_idx]
                  dur_sc = scene_durations[sc_idx]
                  prog_sc = t_sc / max(0.1, dur_sc)

                  page.evaluate(f"window.renderFrame({sc_idx}, {t:.4f}, {t_sc:.4f})")
                  jpg_bytes = page.screenshot(type="jpeg", quality=94)

                  if abs(prog_sc - 0.72) < 0.03 and sc_idx not in qa_snapshots:
                      Path(f"qa_{sc_idx}.jpg").write_bytes(jpg_bytes)
                      qa_snapshots[sc_idx] = f"qa_{sc_idx}.jpg"

                  try:
                      ffmpeg_proc.stdin.write(jpg_bytes)
                  except BrokenPipeError:
                      break

                  if i % 150 == 0 or i == total_frames - 1:
                      print(f"⚡ رندر متزامن 30FPS: {i+1}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

              browser.close()

          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()

          print("🔍 [5/5] تجميع لوحة الفحص البصري...", flush=True)
          sheet = Image.new("RGB", (1800, 640), (247, 247, 245))
          for k in range(5):
              if k in qa_snapshots:
                  im = Image.open(qa_snapshots[k]).resize((360, 640))
                  sheet.paste(im, (k * 360, 0))
          sheet.save("QA_Synced_Sheet.jpg", quality=94)
          print("✅ اكتمل إنتاج النسخة السريعة المتزامنة 100% بنجاح!", flush=True)
          EOF
          python3 -u build_synced_studio.py

      - name: 📦 4. رفع الفيديو السريع المتزامن ولوحة الفحص
        uses: actions/upload-artifact@v4
        with:
          name: ⚡-TEKVIYO-Whisper-Synced-Reel
          path: |
            TEKVIYO_Synced_Fast.mp4
            QA_Synced_Sheet.jpg
          retention-days: 30

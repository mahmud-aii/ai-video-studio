name: 🌌 Tekviyo 2.0 Pro Brand Studio (Zero-Gap + Clean Emotional Voice)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_name:
        description: 'شخصية المعلق في Gemini TTS (Charon = عميق وفخم / Fenrir = حماسي)'
        required: false
        default: 'Charon'

jobs:
  render_tekviyo_pro:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت Faster-Whisper ومحركات الرندر والصوت
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper playwright edge-tts pillow numpy requests
          playwright install chromium

      - name: 🚀 3. توليد الصوت العاطفي المعزول + رندر المسرح المتكامل بدون فراغات
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_PERSONA: ${{ github.event.inputs.voice_name || 'Charon' }}
        run: |
          cat << 'EOF' > build_tekviyo_v3.py
          import os, re, subprocess, time, wave, math, base64, json, difflib
          import requests
          from pathlib import Path
          from PIL import Image
          from faster_whisper import WhisperModel
          from playwright.sync_api import sync_playwright

          os.makedirs("audio", exist_ok=True)

          scenes_script = [
              {
                  "id": 1,
                  "num_tag": "01 / 05",
                  "title_tag": "نزيف الإعلانات",
                  "style_cue": "Say in an urgent, suspenseful, dramatic tone: ",
                  "edge_rate": "+14%",
                  "edge_pitch": "+2Hz",
                  "tempo": "1.12",
                  "stop_sil": "0.10",
                  "voice": "تَصْرِفُ آلافَ الدُّولَارَاتِ عَلَى الإِعْلَانَات... لَكِنَّ العُمَلَاءَ يَضِيعُونَ فِي زَحْمَةِ رَسَائِلِ الوَاتْسَاب، وَمُوَظَّفُوكَ غَارِقُونَ فِي الإِدْخَالِ اليَدَوِيِّ وَالفَوْضَى؟!",
                  "words": ["تصرف", "آلاف", "الدولارات", "على", "الإعلانات،", "لكن", "العملاء", "يضيعون!", "في", "زحمة", "رسائل", "الواتساب،", "وموظفوك", "غارقون", "في", "الإدخال", "اليدوي", "والفوضى؟"],
                  "highlights": ["آلاف", "الدولارات", "يضيعون!", "الواتساب،", "غارقون", "والفوضى؟"]
              },
              {
                  "id": 2,
                  "num_tag": "02 / 05",
                  "title_tag": "عقل الأعمال",
                  "style_cue": "Say in a deep, bold, confident visionary tone: ",
                  "edge_rate": "+6%",
                  "edge_pitch": "-3Hz",
                  "tempo": "1.08",
                  "stop_sil": "0.15",
                  "voice": "التَّسْوِيقُ وَحْدَهُ، لَمْ يَعُدْ يَكْفِي! فِي تِكْ فِيُو، نَحْنُ لَا نُصَمِّمُ لَكَ إِعْلَانَاتٍ فَقَط... نَحْنُ نَبْنِي، عَقْلَ أَعْمَالِكَ!",
                  "words": ["التسويق", "وحده", "لم", "يعد", "يكفي!", "في", "Tekviyo", "نحن", "لا", "نصمم", "لك", "إعلانات", "فقط،", "نحن", "نبني", "(عقل)", "أعمالك!"],
                  "highlights": ["يكفي!", "Tekviyo", "نبني", "(عقل)", "أعمالك!"]
              },
              {
                  "id": 3,
                  "num_tag": "03 / 05",
                  "title_tag": "الربط اللحظي",
                  "style_cue": "Say in an excited, fast-paced, crisp tech tone: ",
                  "edge_rate": "+16%",
                  "edge_pitch": "+2Hz",
                  "tempo": "1.14",
                  "stop_sil": "0.09",
                  "voice": "اِكْتَشِفْ قُوَّةَ الرَّبْطِ الذَّكِيّ! إِعْلَانَاتُكَ الآنَ تَصُبُّ مُبَاشَرَةً فِي نِظَامِكَ الإِدَارِيِّ لَحْظِيًّا! العَمِيلُ يَضْغَطُ عَلَى الإِعْلَان، بَيَانَاتُهُ تَظْهَرُ فِي شَاشَةِ سِكْرِتِيرَتِكَ، وَرِسَالَةُ التَّأْكِيدِ تَصِلُهُ أُوتُومَاتِيكِيًّا! لَا تَدَخُّلَ بَشَرِيّ، وَلَا عُمَلَاءَ ضَائِعِين.",
                  "words": ["اكتشف", "قوة", "الربط", "الذكي!", "إعلاناتك", "الآن", "تصب", "مباشرة", "في", "نظامك", "الإداري", "لحظياً!", "العميل", "يضغط", "على", "الإعلان،", "بياناته", "تظهر", "في", "شاشة", "سكرتيرتك،", "ورسالة", "التأكيد", "تصله", "أوتوماتيكياً!", "لا", "تدخل", "بشري،", "ولا", "عملاء", "ضائعين!"],
                  "highlights": ["الذكي!", "لحظياً!", "يضغط", "تظهر", "سكرتيرتك،", "أوتوماتيكياً!", "ضائعين!"]
              },
              {
                  "id": 4,
                  "num_tag": "04 / 05",
                  "title_tag": "الأنظمة السحابية",
                  "style_cue": "Say in a warm, proud, executive B2B tone: ",
                  "edge_rate": "+12%",
                  "edge_pitch": "-1Hz",
                  "tempo": "1.12",
                  "stop_sil": "0.11",
                  "voice": "سَوَاءٌ كُنْتَ عِيَادَةً طِبِّيَّة، مُؤَسَّسَةً عَقَارِيَّة، أَوْ مَرْكَزَ أَعْمَال، أَنْظِمَتُنَا السَّحَابِيَّةُ المُخَصَّصَةُ تَمْنَحُكَ السَّيْطَرَةَ الكَامِلَةَ عَلَى مُوَظَّفِيك، مَبِيعَاتِك، وَنُمُوِّك، مِنْ أَيِّ مَكَانٍ فِي العَالَم!",
                  "words": ["سواء", "كنت", "عيادة", "طبية،", "مؤسسة", "عقارية،", "أو", "مركز", "أعمال،", "أنظمتنا", "السحابية", "المخصصة", "تمنحك", "السيطرة", "الكاملة", "على", "موظفيك،", "مبيعاتك،", "ونموك،", "من", "أي", "مكان", "في", "العالم!"],
                  "highlights": ["عيادة", "عقارية،", "أعمال،", "السيطرة", "موظفيك،", "مبيعاتك،", "ونموك،", "العالم!"]
              },
              {
                  "id": 5,
                  "num_tag": "05 / 05",
                  "title_tag": "قُد سوقك بذكاء",
                  "style_cue": "Say in an inspiring, triumphant, decisive finale tone: ",
                  "edge_rate": "+10%",
                  "edge_pitch": "+0Hz",
                  "tempo": "1.10",
                  "stop_sil": "0.12",
                  "voice": "لَا تَكْتَفِ بِالوَاجِهَة... اِبْنِ مَنْظُومَةً مُتَكَامِلَةً لَا تُقْهَر! تَوَاصَلْ مَعَ تِكْ فِيُو اليَوْم، وَاحْجِزْ اسْتِشَارَتَكَ التِّقْنِيَّةَ لِنَقْلِ أَعْمَالِكَ لِلْمُسْتَقْبَل!",
                  "words": ["لا", "تكتفِ", "بالواجهة،", "ابنِ", "منظومة", "متكاملة", "لا", "تُقهر!", "تواصل", "مع", "Tekviyo", "اليوم،", "واحجز", "استشارتك", "التقنية", "لنقل", "أعمالك", "للمستقبل!"],
                  "highlights": ["منظومة", "تُقهر!", "Tekviyo", "واحجز", "للمستقبل!"]
              }
          ]

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          persona = os.environ.get("VOICE_PERSONA", "Charon").strip()

          def norm_ar(w):
              if "tekviyo" in w.lower():
                  return "تكفيو"
              w = re.sub(r"[\u064B-\u065F\u0670\W_]+", "", w)
              w = re.sub(r"[أإآ]", "ا", w)
              w = w.replace("ة", "ه").replace("ى", "ي").replace("ڤ", "ف")
              return w

          print("🎯 [1/5] تهيئة حارس Faster-Whisper الصارم لفحص نقاء الصوت...", flush=True)
          whisper_model = WhisperModel("base", device="cpu", compute_type="int8")

          def call_gemini_tts(model_id, prompt_text, out_raw_wav):
              r = requests.post(
                  f"https://generativelanguage.googleapis.com/v1beta/models/{model_id}:generateContent?key={gemini_key}",
                  json={
                      "contents": [{"parts": [{"text": prompt_text}]}],
                      "generationConfig": {
                          "responseModalities": ["AUDIO"],
                          "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": persona}}}
                      }
                  },
                  timeout=40
              )
              if r.status_code == 200:
                  part = r.json()["candidates"][0]["content"]["parts"][0]["inlineData"]
                  raw_b = base64.b64decode(part["data"])
                  if "wav" in part.get("mimeType", "") or raw_b[:4] == b"RIFF":
                      Path(out_raw_wav).write_bytes(raw_b)
                  else:
                      pcm_p = out_raw_wav + ".pcm"
                      Path(pcm_p).write_bytes(raw_b)
                      subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", pcm_p, out_raw_wav], check=True)
                  return True
              return False

          def merge_tekviyo_tokens(raw_sp):
              merged = []
              i = 0
              while i < len(raw_sp):
                  if i + 1 < len(raw_sp) and raw_sp[i]["n"] in ("تيك", "تك") and raw_sp[i+1]["n"] in ("فيو", "فيوا", "فييو"):
                      merged.append({"n": "تكفيو", "s": raw_sp[i]["s"], "e": raw_sp[i+1]["e"]})
                      i += 2
                  else:
                      merged.append(raw_sp[i])
                      i += 1
              return merged

          def verify_and_crop_arabic(raw_wav, expected_words):
              """يمنع 100% أي تسرب لتعليمات إنجليزية أو تكرار للجملة عبر فحص مزدوج وقص جراحي"""
              if not os.path.exists(raw_wav):
                  return False
              with wave.open(raw_wav, "rb") as wf:
                  raw_dur = wf.getnframes() / float(wf.getframerate())

              N = len(expected_words)
              min_dur = max(2.2, N * 0.24)
              max_dur = N * 0.72 + 2.3

              # فحص 1: كشف أي كلمة إنجليزية منطوقة بدون إجبار اللغة على العربية
              segs_auto, _ = whisper_model.transcribe(raw_wav, word_timestamps=True, condition_on_previous_text=False)
              has_latin = False
              for s in segs_auto:
                  for w in (s.words or []):
                      if re.search(r"[A-Za-z]{2,}", w.word):
                          has_latin = True

              # فحص 2: تفريغ الكلمات العربية بتوقيتاتها
              segs_ar, _ = whisper_model.transcribe(raw_wav, language="ar", word_timestamps=True, condition_on_previous_text=False)
              sp_raw = []
              for s in segs_ar:
                  for w in (s.words or []):
                      tw = w.word.strip()
                      if tw:
                          sp_raw.append({"n": norm_ar(tw), "s": float(w.start), "e": float(w.end)})
              sp = merge_tekviyo_tokens(sp_raw)
              if len(sp) < max(4, int(N * 0.55)):
                  return False

              n_exp = [norm_ar(x) for x in expected_words]

              # المسار السريع: صوت عربي نقي بدون أي حرف إنجليزي وبطول طبيعي وتطابق عالٍ
              if not has_latin and (min_dur <= raw_dur <= max_dur):
                  n_sp = [x["n"] for x in sp]
                  ratio = difflib.SequenceMatcher(None, n_exp, n_sp).ratio()
                  if ratio >= 0.62 and (int(N * 0.65) <= len(sp) <= int(N * 1.32)):
                      return True

              # مسار القص الجراحي: البحث عن النافذة المتصلة المطابقة للنص العربي فقط (مع تفضيل القراءة الأخيرة النظيفة)
              best_score = -1.0
              best_span = None
              min_w = max(4, int(N * 0.68))
              max_w = min(len(sp), int(N * 1.28) + 2)
              for w_len in range(min_w, max_w + 1):
                  for st_i in range(0, len(sp) - w_len + 1):
                      sub = sp[st_i : st_i + w_len]
                      span_d = sub[-1]["e"] - sub[0]["s"]
                      if not (min_dur * 0.85 <= span_d <= max_dur):
                          continue
                      sub_n = [x["n"] for x in sub]
                      head_r = difflib.SequenceMatcher(None, n_exp[:3], sub_n[:3]).ratio()
                      tail_r = difflib.SequenceMatcher(None, n_exp[-3:], sub_n[-3:]).ratio()
                      full_r = difflib.SequenceMatcher(None, n_exp, sub_n).ratio()
                      if head_r >= 0.55 and tail_r >= 0.55 and full_r >= 0.66:
                          sc_val = full_r + (st_i / max(1, len(sp))) * 0.06
                          if sc_val > best_score:
                              best_score = sc_val
                              best_span = (max(0.0, sub[0]["s"] - 0.04), sub[-1]["e"] + 0.08)

              if best_span is None:
                  return False

              c_s, c_e = best_span
              cropped = raw_wav + ".crop.wav"
              subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-ss", f"{c_s:.3f}", "-to", f"{c_e:.3f}", "-i", raw_wav, cropped], check=True)

              # فحص تأكيدي بعد القص للتأكد من خلوه 100% من أي كلمة إنجليزية
              segs_chk, _ = whisper_model.transcribe(cropped, word_timestamps=True, condition_on_previous_text=False)
              for s in segs_chk:
                  for w in (s.words or []):
                      if re.search(r"[A-Za-z]{2,}", w.word):
                          return False
              os.replace(cropped, raw_wav)
              print(f"✂️ تم عزل الأداء العربي الصافي بنجاح ({c_s:.2f}s -> {c_e:.2f}s)!", flush=True)
              return True

          def generate_clean_emotional_voice(sc, out_wav):
              idx = sc["id"]
              raw_wav = f"audio/raw_{idx}.wav"
              used_gem = False
              if gemini_key:
                  styled_req = sc["style_cue"] + sc["voice"]
                  for m_id in ["gemini-2.5-flash-preview-tts", "gemini-3.8-flash-tts"]:
                      try:
                          if call_gemini_tts(m_id, styled_req, raw_wav) and verify_and_crop_arabic(raw_wav, sc["words"]):
                              used_gem = True
                              print(f"🎭 المشهد {idx}: أداء عاطفي نقي ومفحوص عبر {m_id}", flush=True)
                              break
                          # إذا قرأ النموذج أي تعليمات، نعيد التوليد فوراً بالنص العربي الصافي فقط بدون أي حرف إنجليزي!
                          if call_gemini_tts(m_id, sc["voice"], raw_wav) and verify_and_crop_arabic(raw_wav, sc["words"]):
                              used_gem = True
                              print(f"🎙️ المشهد {idx}: أداء عربي صافي 100% عبر {m_id}", flush=True)
                              break
                      except Exception as e:
                          print(f"TTS try {m_id}:", e, flush=True)

              if not used_gem:
                  subprocess.run([
                      "python3", "-m", "edge_tts",
                      "--voice", "ar-SA-HamedNeural",
                      f"--rate={sc['edge_rate']}",
                      f"--pitch={sc['edge_pitch']}",
                      "--text", sc["voice"],
                      "--write-media", f"audio/raw_{idx}.mp3"
                  ], check=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.mp3", raw_wav], check=True)
                  print(f"🎙️ المشهد {idx}: تم التوليد عبر المحرك الرديف", flush=True)

              tempo_f = f"atempo={sc['tempo']}," if used_gem else ""
              stop_s = sc["stop_sil"]
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", raw_wav,
                  "-af", f"silenceremove=start_periods=1:start_silence=0.03:start_threshold=-40dB:stop_periods=-1:stop_duration=0.30:stop_silence={stop_s}:stop_threshold=-39dB,{tempo_f}highpass=f=70,equalizer=f=115:width_type=o:width=1.8:g=3.5,equalizer=f=3900:width_type=o:width=2.0:g=2.8,acompressor=threshold=-16dB:ratio=2.5:makeup=3.4dB,apad=pad_dur=0.14",
                  "-ar", "48000", "-ac", "2", out_wav
              ], check=True)

          print("🔊 [2/5] توليد التعليق الصوتي المفحوص ضد التسرب أو التكرار...", flush=True)
          for sc in scenes_script:
              generate_clean_emotional_voice(sc, f"audio/v_{sc['id']}.wav")

          def align_scene_words(wav_path, display_words, dur):
              spoken = []
              try:
                  segs, _ = whisper_model.transcribe(wav_path, language="ar", word_timestamps=True, condition_on_previous_text=False)
                  raw_w = []
                  for s in segs:
                      for w in (s.words or []):
                          txt = w.word.strip()
                          if txt:
                              raw_w.append({"w": txt, "n": norm_ar(txt), "s": float(w.start), "e": float(w.end)})
                  spoken = merge_tekviyo_tokens(raw_w)
              except Exception as e:
                  print("Align note:", e, flush=True)

              n_disp = [norm_ar(x) for x in display_words]
              n_spok = [x["n"] for x in spoken]
              anchors = {}

              if spoken:
                  sm = difflib.SequenceMatcher(None, n_disp, n_spok)
                  used_sj = set()
                  for blk in sm.get_matching_blocks():
                      for k in range(blk.size):
                          anchors[blk.a + k] = (spoken[blk.b + k]["s"], spoken[blk.b + k]["e"])
                          used_sj.add(blk.b + k)

                  for di in range(len(n_disp)):
                      if di in anchors:
                          continue
                      t_min = anchors[max([k for k in anchors if k < di], default=-1)][1] if any(k < di for k in anchors) else 0.0
                      t_max = anchors[min([k for k in anchors if k > di], default=999)][0] if any(k > di for k in anchors) else dur
                      for sj, sp_item in enumerate(spoken):
                          if sj in used_sj:
                              continue
                          if t_min - 0.05 <= sp_item["s"] <= t_max + 0.05:
                              if difflib.SequenceMatcher(None, n_disp[di], sp_item["n"]).ratio() >= 0.68:
                                  anchors[di] = (sp_item["s"], sp_item["e"])
                                  used_sj.add(sj)
                                  break

              N = len(display_words)
              result = [None] * N
              speech_end = max(0.2, dur - 0.14)
              weights = [max(2, len(norm_ar(w))) + (2.3 if any(p in w for p in "،.!؟") else 0.0) for w in display_words]

              idx = 0
              while idx < N:
                  if idx in anchors:
                      s_t, e_t = anchors[idx]
                      result[idx] = {"word": display_words[idx], "start": round(s_t, 3), "end": round(max(s_t + 0.08, e_t), 3)}
                      idx += 1
                  else:
                      g_start = idx
                      while idx < N and idx not in anchors:
                          idx += 1
                      g_end = idx
                      t_left = result[g_start - 1]["end"] if g_start > 0 else 0.02
                      t_right = anchors[g_end][0] if g_end < N else speech_end
                      if t_right <= t_left + 0.05:
                          t_right = min(dur, t_left + 0.12 * (g_end - g_start))
                      w_slice = weights[g_start:g_end]
                      w_sum = sum(w_slice) or 1.0
                      cur = t_left
                      for offset, wt in enumerate(w_slice):
                          span = (t_right - t_left) * (wt / w_sum)
                          result[g_start + offset] = {"word": display_words[g_start + offset], "start": round(cur, 3), "end": round(cur + span, 3)}
                          cur += span
              return result

          # توليد المؤثرات الصوتية النيونية المربوطة بالكلمات
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "anoisesrc=d=0.18:c=pink:r=48000:a=0.38", "-af", "bandpass=f=1150:width_type=h:w=750,afade=t=in:st=0:d=0.03,afade=t=out:st=0.07:d=0.11", "-ar", "48000", "-ac", "2", "audio/whoosh.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.68*sin(2*PI*1650*t)*exp(-55*t)+0.42*sin(2*PI*3200*t)*exp(-75*t)':s=48000:d=0.09", "-ar", "48000", "-ac", "2", "audio/click.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.52*sin(2*PI*(560+720*t)*t)*exp(-24*t)':s=48000:d=0.16", "-ar", "48000", "-ac", "2", "audio/pop.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.62*sin(2*PI*(150-85*t)*t)*exp(-11*t)+0.26*sin(2*PI*780*t)*exp(-24*t)':s=48000:d=0.28", "-ar", "48000", "-ac", "2", "audio/stamp.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.44*sin(2*PI*(400+1100*t)*t)*exp(-7*t)':s=48000:d=0.30", "-ar", "48000", "-ac", "2", "audio/zap.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.46*sin(2*PI*988*t)*exp(-9*t)+0.38*sin(2*PI*1480*t)*exp(-7*t)':s=48000:d=0.42", "-ar", "48000", "-ac", "2", "audio/ping.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.50*sin(2*PI*(130-60*t)*t)*exp(-3.8*t)+0.24*sin(2*PI*523.25*t)*exp(-5*t)+0.20*sin(2*PI*659.25*t)*exp(-4.5*t)':s=48000:d=0.70", "-ar", "48000", "-ac", "2", "audio/power.wav"], check=True)

          scene_durations = []
          s_starts = [0.0]
          sfx_events = []

          for sc in scenes_script:
              sid = sc["id"]
              v_wav = f"audio/v_{sid}.wav"
              with wave.open(v_wav, "rb") as wf:
                  dur = wf.getnframes() / float(wf.getframerate())
              scene_durations.append(dur)
              wt = align_scene_words(v_wav, sc["words"], dur)
              sc["word_times"] = wt
              sc["duration"] = round(dur, 4)
              sc_base = s_starts[-1]
              sc["start_global"] = round(sc_base, 4)
              s_starts.append(sc_base + dur)

              def w_ms(w_idx, offset=0.0):
                  w_idx = max(0, min(len(wt) - 1, w_idx))
                  return int(max(0.0, (sc_base + wt[w_idx]["start"] + offset)) * 1000)

              if sid == 1:
                  sfx_events.append((20, "whoosh", 0.90))
                  sfx_events.append((w_ms(7), "stamp", 1.15))
                  sfx_events.append((w_ms(11), "pop", 1.05))
                  sfx_events.append((w_ms(17), "stamp", 1.25))
              elif sid == 2:
                  sfx_events.append((int(sc_base * 1000) + 10, "power", 1.15))
                  sfx_events.append((w_ms(6), "ping", 1.10))
                  sfx_events.append((w_ms(15), "power", 1.05))
              elif sid == 3:
                  sfx_events.append((int(sc_base * 1000) + 20, "whoosh", 0.90))
                  sfx_events.append((w_ms(13), "click", 1.35))
                  sfx_events.append((w_ms(14, 0.04), "zap", 1.15))
                  sfx_events.append((w_ms(17), "pop", 1.15))
                  sfx_events.append((w_ms(20), "stamp", 1.10))
                  sfx_events.append((w_ms(21), "ping", 1.20))
              elif sid == 4:
                  sfx_events.append((int(sc_base * 1000) + 20, "whoosh", 0.90))
                  sfx_events.append((w_ms(2), "pop", 0.95))
                  sfx_events.append((w_ms(4), "pop", 0.95))
                  sfx_events.append((w_ms(7), "pop", 0.95))
                  sfx_events.append((w_ms(16), "ping", 0.95))
                  sfx_events.append((w_ms(17), "ping", 0.95))
                  sfx_events.append((w_ms(18), "ping", 1.05))
              elif sid == 5:
                  sfx_events.append((int(sc_base * 1000) + 15, "power", 1.05))
                  sfx_events.append((w_ms(7), "stamp", 1.15))
                  sfx_events.append((w_ms(10), "ping", 1.05))
                  sfx_events.append((w_ms(12), "click", 1.35))
                  sfx_events.append((w_ms(12, 0.08), "ping", 1.25))

          total_dur = sum(scene_durations)
          t_shift = s_starts[1]
          print(f"✅ مدد المشاهد النقية: {[round(d, 2) for d in scene_durations]} | المجموع المشدود: {total_dur:.2f} ثانية", flush=True)

          concat_in = []
          for k in range(1, 6):
              concat_in.extend(["-i", f"audio/v_{k}.wav"])
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + concat_in + ["-filter_complex", "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1[vo]", "-map", "[vo]", "audio/full_voice.wav"], check=True)


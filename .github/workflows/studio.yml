              },
              {
                  "id": 5,
                  "num_tag": "∑",
                  "title_tag": "05 // الخلاصة والانطلاق",
                  "voice": "لَا تَكْتَفِ بِالوَاجِهَة، اِبْنِ مَنْظُومَةً مُتَكَامِلَةً لَا تُقْهَر. تَوَاصَلْ مَعَ تِكْ فِيو اليَوْم، وَاحْجِزْ اسْتِشَارَتَكَ التِّقْنِيَّةَ لِنَقْلِ أَعْمَالِكَ لِلْمُسْتَقْبَل.",
                  "words": ["لا", "تكتفِ", "بالواجهة،", "ابنِ", "منظومة", "متكاملة", "لا", "تُقهر!", "تواصل", "مع", "TEKVIYO", "اليوم،", "واحجز", "استشارتك", "التقنية", "لنقل", "أعمالك", "للمستقبل!"],
                  "highlights": ["منظومة", "تُقهر!", "TEKVIYO", "واحجز", "للمستقبل!"]
              }
          ]

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          persona = os.environ.get("VOICE_PERSONA", "Charon").strip()

          def norm_ar(w):
              if "tekviyo" in w.lower():
                  return "تكفيو"
              w = re.sub(r"[\u064B-\u065F\u0670\W_]+", "", w)
              w = re.sub(r"[أإآ]", "ا", w)
              w = w.replace("ة", "ه").replace("ى", "ي")
              return w

          def generate_fast_voice(idx, pure_text_ar, out_wav):
              used_gem = False
              if gemini_key:
                  for m_id in ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]:
                      try:
                          r = requests.post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/{m_id}:generateContent?key={gemini_key}",
                              json={
                                  "contents": [{"parts": [{"text": pure_text_ar}]}],
                                  "generationConfig": {
                                      "responseModalities": ["AUDIO"],
                                      "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": persona}}}
                                  }
                              },
                              timeout=35
                          )
                          if r.status_code == 200:
                              part = r.json()["candidates"][0]["content"]["parts"][0]["inlineData"]
                              raw_b = base64.b64decode(part["data"])
                              if "wav" in part.get("mimeType", "") or raw_b[:4] == b"RIFF":
                                  Path(f"audio/raw_{idx}.wav").write_bytes(raw_b)
                              else:
                                  Path(f"audio/raw_{idx}.pcm").write_bytes(raw_b)
                                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", f"audio/raw_{idx}.pcm", f"audio/raw_{idx}.wav"], check=True)
                              used_gem = True
                              print(f"🎙️ المشهد {idx}: تم توليد الصوت البشري عبر {m_id}", flush=True)
                              break
                      except Exception:
                          pass
              if not used_gem:
                  subprocess.run(["python3", "-m", "edge_tts", "--voice", "ar-SA-HamedNeural", "--rate=+18%", "--pitch=+0Hz", "--text", pure_text_ar, "--write-media", f"audio/raw_{idx}.mp3"], check=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.mp3", f"audio/raw_{idx}.wav"], check=True)

              tempo_filter = "atempo=1.18," if used_gem else ""
              # ضغط السكتات الداخلية الطويلة إلى نفس طبيعي رشيق (0.09s) وتسريع الإيقاع بنسبة 18%
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.wav",
                  "-af", f"silenceremove=start_periods=1:start_silence=0.03:start_threshold=-40dB:stop_periods=-1:stop_duration=0.26:stop_silence=0.09:stop_threshold=-38dB,{tempo_filter}highpass=f=75,equalizer=f=125:width_type=o:width=2:g=3.2,equalizer=f=3800:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=2.6:makeup=3.2dB,apad=pad_dur=0.14",
                  "-ar", "48000", "-ac", "2", out_wav
              ], check=True)

          print("🔊 [1/5] توليد الصوت السريع وضغط السكتات...", flush=True)
          for sc in scenes_script:
              generate_fast_voice(sc["id"], sc["voice"], f"audio/v_{sc['id']}.wav")

          print("🎯 [2/5] تشغيل Faster-Whisper لاستخراج توقيت كل كلمة بالمللي ثانية...", flush=True)
          whisper_model = None
          try:
              whisper_model = WhisperModel("base", device="cpu", compute_type="int8")
          except Exception as e:
              print("⚠️ تعذر تحميل Whisper، سيتم استخدام التوزيع الوزني بالحروف:", e, flush=True)

          def align_scene_words(wav_path, display_words, dur):
              spoken = []
              if whisper_model is not None:
                  try:
                      segs, _ = whisper_model.transcribe(wav_path, language="ar", word_timestamps=True, condition_on_previous_text=False)
                      raw_w = []
                      for s in segs:
                          for w in (s.words or []):
                              txt = w.word.strip()
                              if txt:
                                  raw_w.append({"w": txt, "n": norm_ar(txt), "s": float(w.start), "e": float(w.end)})
                      # دمج "تيك" + "فيو" في كلمة واحدة لتطابق TEKVIYO
                      i = 0
                      while i < len(raw_w):
                          if i + 1 < len(raw_w) and raw_w[i]["n"] in ("تيك", "تك") and raw_w[i+1]["n"] in ("فيو", "فيوا"):
                              spoken.append({"n": "تكفيو", "s": raw_w[i]["s"], "e": raw_w[i+1]["e"]})
                              i += 2
                          else:
                              spoken.append(raw_w[i])
                              i += 1
                  except Exception as e:
                      print("Whisper align note:", e, flush=True)

              n_disp = [norm_ar(x) for x in display_words]
              n_spok = [x["n"] for x in spoken]
              anchors = {}

              if spoken:
                  sm = difflib.SequenceMatcher(None, n_disp, n_spok)
                  for tag, i1, i2, j1, j2 in sm.get_matching_blocks():
                      # get_matching_blocks returns (i, j, n)
                      pass
                  for blk in sm.get_matching_blocks():
                      di, sj, ln = blk.a, blk.b, blk.size
                      for k in range(ln):
                          anchors[di + k] = (spoken[sj + k]["s"], spoken[sj + k]["e"])

              # تعبئة أي كلمة غير مربوطة بالتدرج الدقيق بين الكلمات المجاورة المربوطة
              N = len(display_words)
              result = [None] * N
              speech_end = max(0.2, dur - 0.14)
              weights = [max(2, len(norm_ar(w))) + (2.5 if any(p in w for p in "،.!؟") else 0.0) for w in display_words]

              idx = 0
              while idx < N:
                  if idx in anchors:
                      s_t, e_t = anchors[idx]
                      result[idx] = {"word": display_words[idx], "start": round(s_t, 3), "end": round(max(s_t + 0.08, e_t), 3)}
                      idx += 1
                  else:
                      g_start = idx
                      while idx < N and idx not in anchors:
                          idx += 1
                      g_end = idx
                      t_left = result[g_start - 1]["end"] if g_start > 0 else 0.02
                      t_right = anchors[g_end][0] if g_end < N else speech_end
                      if t_right <= t_left + 0.05:
                          t_right = min(dur, t_left + 0.12 * (g_end - g_start))
                      w_slice = weights[g_start:g_end]
                      w_sum = sum(w_slice) or 1.0
                      cur = t_left
                      for offset, wt in enumerate(w_slice):
                          span = (t_right - t_left) * (wt / w_sum)
                          result[g_start + offset] = {"word": display_words[g_start + offset], "start": round(cur, 3), "end": round(cur + span, 3)}
                          cur += span
              return result

          # تجهيز المؤثرات الصوتية الرشيقة
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "anoisesrc=d=0.18:c=pink:r=48000:a=0.38", "-af", "bandpass=f=1050:width_type=h:w=700,afade=t=in:st=0:d=0.03,afade=t=out:st=0.07:d=0.11", "-ar", "48000", "-ac", "2", "audio/whoosh.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.68*sin(2*PI*1600*t)*exp(-55*t)+0.42*sin(2*PI*3100*t)*exp(-75*t)':s=48000:d=0.09", "-ar", "48000", "-ac", "2", "audio/click.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.52*sin(2*PI*(540+700*t)*t)*exp(-24*t)':s=48000:d=0.16", "-ar", "48000", "-ac", "2", "audio/pop.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.62*sin(2*PI*(155-85*t)*t)*exp(-12*t)+0.25*sin(2*PI*760*t)*exp(-25*t)':s=48000:d=0.28", "-ar", "48000", "-ac", "2", "audio/stamp.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.42*sin(2*PI*(360+950*t)*t)*exp(-7*t)':s=48000:d=0.32", "-ar", "48000", "-ac", "2", "audio/zap.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.48*sin(2*PI*920*t)*exp(-9*t)+0.38*sin(2*PI*1380*t)*exp(-7*t)':s=48000:d=0.42", "-ar", "48000", "-ac", "2", "audio/ping.wav"], check=True)

          scene_durations = []
          s_starts = [0.0]
          sfx_events = [] # (global_ms, sfx_file, weight)

          for sc in scenes_script:
              sid = sc["id"]
              v_wav = f"audio/v_{sid}.wav"
              with wave.open(v_wav, "rb") as wf:
                  dur = wf.getnframes() / float(wf.getframerate())
              scene_durations.append(dur)
              wt = align_scene_words(v_wav, sc["words"], dur)
              sc["word_times"] = wt
              sc["duration"] = round(dur, 4)
              sc_base = s_starts[-1]
              sc["start_global"] = round(sc_base, 4)
              s_starts.append(sc_base + dur)

              def w_ms(w_idx, offset=0.0):
                  w_idx = max(0, min(len(wt) - 1, w_idx))
                  return int(max(0.0, (sc_base + wt[w_idx]["start"] + offset)) * 1000)

              # ربط كل مؤثر صوتي بالكلمة المنطوقة نفسها بالمللي ثانية!
              sfx_events.append((int(sc_base * 1000) + 20, "whoosh", 0.9))
              if sid == 1:
                  sfx_events.append((w_ms(7), "stamp", 1.15))   # "يضيعون!"
                  sfx_events.append((w_ms(11), "pop", 1.05))    # "الواتساب،"
                  sfx_events.append((w_ms(17), "stamp", 1.25))  # "والفوضى؟"
              elif sid == 2:
                  sfx_events.append((w_ms(6), "pop", 1.1))      # "TEKVIYO"
                  sfx_events.append((w_ms(11), "whoosh", 0.95)) # "إعلانات"
                  sfx_events.append((w_ms(15), "ping", 1.1))    # "(عقل)"
              elif sid == 3:
                  sfx_events.append((w_ms(13), "click", 1.35))       # "يضغط" -> نقرة الماوس بالضبط!
                  sfx_events.append((w_ms(14, 0.05), "zap", 1.15))   # انطلاق الـ Webhook فوراً بعد النقرة
                  sfx_events.append((w_ms(17), "pop", 1.15))         # "تظهر" -> ظهور شاشة السكرتيرة
                  sfx_events.append((w_ms(20), "stamp", 1.1))        # "سكرتيرتك" -> ختم مريض جديد
                  sfx_events.append((w_ms(21), "ping", 1.2))         # "ورسالة" -> ظهور رسالة الواتساب
              elif sid == 4:
                  sfx_events.append((w_ms(2), "whoosh", 0.95))  # "عيادة"
                  sfx_events.append((w_ms(4), "whoosh", 0.95))  # "مؤسسة"
                  sfx_events.append((w_ms(7), "whoosh", 0.95))  # "مركز"
                  sfx_events.append((w_ms(16), "pop", 1.0))     # "موظفيك"
                  sfx_events.append((w_ms(17), "pop", 1.0))     # "مبيعاتك"
                  sfx_events.append((w_ms(18), "ping", 1.05))   # "ونموك"
              elif sid == 5:
                  sfx_events.append((w_ms(7), "stamp", 1.15))   # "تُقهر!"
                  sfx_events.append((w_ms(10), "pop", 1.0))     # "TEKVIYO"
                  sfx_events.append((w_ms(12), "click", 1.35))  # "واحجز" -> نقرة زر الحجز بالضبط!
                  sfx_events.append((w_ms(12, 0.08), "ping", 1.2))

          total_dur = sum(scene_durations)
          print(f"⚡ المدة الجديدة السريعة بعد ضغط السكتات: {total_dur:.2f} ثانية (بدل 63 ثانية!)", flush=True)

          # دمج مسارات الصوت الخمسة + جميع المؤثرات المربوطة بالكلمات + إيقاع تقني عصري خفيف بالخلفية
          concat_in = []
          for k in range(1, 6):
              concat_in.extend(["-i", f"audio/v_{k}.wav"])
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + concat_in + ["-filter_complex", "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1[vo]", "-map", "[vo]", "audio/full_voice.wav"], check=True)

          # خلفية إيقاعية حديثة ناعمة (Modern 120BPM Subtle Tech Pulse) لزيادة الانسجام الحركي
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", f"aevalsrc='(0.022*sin(2*PI*65*t)+0.014*sin(2*PI*130*t))*(0.65+0.35*sin(2*PI*2.0*t))+0.010*sin(2*PI*196*t)*exp(-8*mod(t,0.5))':s=48000:d={total_dur}",
              "-af", f"afade=t=in:st=0:d=0.6,afade=t=out:st={max(0.4, total_dur-1.4)}:d=1.4",
              "-ar", "48000", "-ac", "2", "audio/pulse_bg.wav"
          ], check=True)

          sfx_files_map = {
              "whoosh": "audio/whoosh.wav",
              "click": "audio/click.wav",
              "pop": "audio/pop.wav",
              "stamp": "audio/stamp.wav",
              "zap": "audio/zap.wav",
              "ping": "audio/ping.wav"
          }
          mix_inputs = ["-i", "audio/full_voice.wav", "-i", "audio/pulse_bg.wav"]
          fc_delays = []
          mix_labels = "[0:a][1:a]"
          weights_list = ["2.4", "0.55"]

          for idx_e, (ms_delay, s_key, wt_val) in enumerate(sfx_events):
              mix_inputs.extend(["-i", sfx_files_map[s_key]])
              in_idx = idx_e + 2
              lbl = f"s{idx_e}"
              fc_delays.append(f"[{in_idx}:a]adelay={ms_delay}|{ms_delay}[{lbl}];")
              mix_labels += f"[{lbl}]"
              weights_list.append(f"{wt_val:.2f}")

          fc_full = "".join(fc_delays) + f"{mix_labels}amix=inputs={len(weights_list)}:duration=first:dropout_transition=0:weights='{' '.join(weights_list)}'[aout]"
          subprocess.run(
              ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + mix_inputs +
              ["-filter_complex", fc_full, "-map", "[aout]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"],
              check=True
          )

          print("🎨 [3/5] بناء المسرح المتزامن بالكلمات (Exact Word-Triggered Micro-UI)...", flush=True)
          scenes_json = json.dumps(scenes_script, ensure_ascii=False)

          html_stage = """<!DOCTYPE html>

                  const p1 = easeOutBack(tScene / 0.45);
                  document.getElementById('s1-main').style.transform = 'scale(' + p1 + ')';
                  const lossVal = Math.min(4850, Math.floor(1200 + prog * 4500));
                  document.getElementById('s1-big-num').innerText = '-$' + lossVal.toLocaleString();
                  document.getElementById('b6-txt').innerText = (prog > 0.55) ? '[ فوضى! ]' : '[ ? ]';
                  document.getElementById('b6').style.transform = (prog > 0.55) ? 'scale(1.06) rotate(-2deg)' : 'scale(1)';
                }
                else if (scIdx === 1) {
                  const p2 = easeOutBack(tScene / 0.45);
                  document.getElementById('s2-core').style.transform = 'scale(' + p2 + ')';
                  const pDiag = easeOutBack(Math.max(0, tScene - 0.35) / 0.45);
                  document.getElementById('s2-diagram').style.transform = 'scale(' + Math.max(0.01, pDiag) + ')';
                }
                else if (scIdx === 2) {
                  // محاكاة نقرة الإعلان ⬅ طيران الـ Webhook ⬅ سقوط كبسولات البيانات في شاشة السكرتيرة
                  const clicked = (prog >= 0.26 && prog <= 0.34);
                  document.getElementById('s3-submit-btn').style.background = clicked ? '#F05A28' : '#141519';
                  document.getElementById('s3-submit-btn').style.transform = clicked ? 'scale(0.92)' : 'scale(1)';

                  const pDb = easeOutBack((prog - 0.32) * 3.2);
                  document.getElementById('s3-db').style.transform = 'scale(' + Math.max(0.01, pDb) + ')';
                  document.getElementById('s3-db').style.opacity = Math.max(0, Math.min(1, (prog - 0.30) * 5));

                  ['db-p1', 'db-p2', 'db-p3'].forEach(function(pid, idx) {
                    const dp = easeOutBack((prog - (0.38 + idx * 0.06)) * 4.0);
                    document.getElementById(pid).style.transform = 'translateY(' + ((1 - Math.min(1, dp)) * -35) + 'px) scale(' + Math.max(0.01, dp) + ')';
                  });

                  const pWa = easeOutBack((prog - 0.56) * 3.2);
                  document.getElementById('s3-wa').style.transform = 'scale(' + Math.max(0.01, pWa) + ')';
                  document.getElementById('s3-wa').style.opacity = Math.max(0, Math.min(1, (prog - 0.54) * 5));

                  if (prog < 0.38) {
                    cursorSvg.style.display = 'block';
                    const cp = Math.min(1, prog / 0.26);
                    const cx = 640 - 420 * cp;
                    const cy = 540 - 210 * cp;
                    cArrow.setAttribute('transform', 'translate(' + cx + ',' + cy + ')');
                    cRing.setAttribute('cx', cx); cRing.setAttribute('cy', cy);
                    cRing.setAttribute('opacity', clicked ? '1' : '0');
                  }
                }
                else if (scIdx === 3) {
                  ['s4-w1', 's4-w2', 's4-w3'].forEach(function(wid, idx) {
                    const st = idx * 0.16;
                    const pw = easeOutBack((prog - st) * 3.0);
                    const el = document.getElementById(wid);
                    el.style.transform = 'translateX(' + ((1 - Math.min(1, pw)) * 80) + 'px) scale(' + Math.max(0.01, pw) + ')';
                    el.style.opacity = Math.max(0, Math.min(1, (prog - st) * 4));
                  });
                }
                else if (scIdx === 4) {
                  const fullTxt = 'www.tekviyo.com';
                  const charCount = Math.min(fullTxt.length, Math.floor(prog * fullTxt.length * 1.6));
                  document.getElementById('s5-typed').innerText = fullTxt.substring(0, charCount);
                  const clicked = (prog >= 0.58 && prog <= 0.68);
                  document.getElementById('s5-send').style.transform = clicked ? 'scale(0.92)' : 'scale(1)';

                  if (prog >= 0.40) {
                    cursorSvg.style.display = 'block';

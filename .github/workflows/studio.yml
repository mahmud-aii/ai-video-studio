              "-vf", "fps=60",
              "-c:v", "libx264", "-preset", "superfast", "-crf", "16", "-pix_fmt", "yuv420p",
              "-c:a", "copy", "-shortest", "TEKVIYO_Turkish_Wireframe.mp4"
          ], stdin=subprocess.PIPE)

          qa_snapshots = {}
          t0 = time.time()

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 1920})
              page.goto(f"file://{os.path.abspath('turkish_stage.html')}", wait_until="networkidle")
              page.wait_for_timeout(400)

              for i in range(total_frames):
                  t = i / fps
                  sc_idx = 0
                  for k in range(5):
                      if t >= s_starts[k]:
                          sc_idx = k
                  t_sc = t - s_starts[sc_idx]
                  dur_sc = scene_durations[sc_idx]
                  prog_sc = float(max(0.0, min(1.0, t_sc / max(0.1, dur_sc))))

                  page.evaluate(f"window.renderFrame({sc_idx}, {prog_sc:.4f}, {t:.4f}, {t_sc:.4f}, {dur_sc:.4f})")
                  jpg_bytes = page.screenshot(type="jpeg", quality=94)

                  if abs(prog_sc - 0.68) < 0.03 and sc_idx not in qa_snapshots:
                      Path(f"qa_{sc_idx}.jpg").write_bytes(jpg_bytes)
                      qa_snapshots[sc_idx] = f"qa_{sc_idx}.jpg"

                  try:
                      ffmpeg_proc.stdin.write(jpg_bytes)
                  except BrokenPipeError:
                      break

                  if i % 120 == 0 or i == total_frames - 1:
                      print(f"⚡ تقدم الرندر التركي: {i+1}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

              browser.close()

          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()

          print("🔍 [4/4] تجميع لوحة الفحص البصري للستايل التركي...", flush=True)
          sheet = Image.new("RGB", (1800, 640), (247, 247, 245))
          for k in range(5):
              if k in qa_snapshots:
                  im = Image.open(qa_snapshots[k]).resize((360, 640))
                  sheet.paste(im, (k * 360, 0))
          sheet.save("QA_Turkish_Style_Sheet.jpg", quality=94)
          print("✅ اكتمل إنتاج فيديو TEKVIYO بالستايل التركي بنجاح!", flush=True)
          EOF
          python3 -u build_turkish_style.py

      - name: 📦 4. رفع فيديو الستايل التركي ولوحة الفحص
        uses: actions/upload-artifact@v4
        with:
          name: 🎬-TEKVIYO-Turkish-Wireframe-Reel
          path: |
            TEKVIYO_Turkish_Wireframe.mp4
            QA_Turkish_Style_Sheet.jpg
          retention-days: 30

                      if prog_sc >= prog_start:
                          pp = ease_out_back((prog_sc - prog_start) * dur_sc / 0.45)
                          float_y = math.sin(t * 2.8 + idx_p) * 5.0
                          paste_c(canvas, ui[pid], W/2, py + float_y, max(0.2, pp))

                  feats = [("s4_f1", 0.44, 765, 1080), ("s4_f2", 0.52, 315, 1080), ("s4_f3", 0.60, 765, 1230), ("s4_f4", 0.68, 315, 1230)]
                  for fid, df, fx, fy in feats:
                      if prog_sc >= df:
                          pf = ease_out_back((prog_sc - df) * dur_sc / 0.4)
                          paste_c(canvas, ui[fid], fx, fy, max(0.2, pf))

              else:
                  canvas = bg_cta.copy()
                  dr = ImageDraw.Draw(canvas)
                  ph = ease_out_back(t_sc / 0.5)
                  paste_c(canvas, ui["s5_hero"], W/2, 450 + math.sin(t*2.5)*6.0, max(0.2, ph))
                  if prog_sc >= 0.20:
                      pb = ease_out_back((prog_sc - 0.20) * dur_sc / 0.45)
                      btn_click = 0.96 if (0.52 <= prog_sc <= 0.60) else max(0.2, pb)
                      paste_c(canvas, ui["s5_btn"], W/2, 945, btn_click)
                  if prog_sc >= 0.38:
                      pl = ease_out_back((prog_sc - 0.38) * dur_sc / 0.45)
                      paste_c(canvas, ui["s5_links"], W/2, 1200, max(0.2, pl))
                  if prog_sc >= 0.42:
                      cp = float(np.clip((prog_sc - 0.42) / 0.14, 0.0, 1.0))
                      # وضع الماوس على الطرف الأيسر للزر بعيداً عن كلمة "الآن" حتى لا يطمسها!
                      draw_cursor(dr, int(420 - 210*cp), int(1180 - 215*cp), clicked=(prog_sc >= 0.54))

              # شريط التقدم العلوي (01/05 -> 05/05)
              dr_top = ImageDraw.Draw(canvas)
              seg_w = 170
              for s_bar in range(5):
                  bx = 85 + s_bar * (seg_w + 18)
                  col_b = (74, 222, 128, 255) if s_bar < sc_idx else ((56, 189, 248, 255) if s_bar == sc_idx else (255, 255, 255, 45))
                  dr_top.rounded_rectangle([bx, 65, bx + seg_w, 81], radius=8, fill=col_b)

              cap_key = f"cap_{sc_idx+1}_a" if prog_sc < 0.50 else f"cap_{sc_idx+1}_b"
              paste_c(canvas, ui[cap_key], W/2, 1660, 1.0)

              if t_sc < 0.20 and sc_idx > 0:
                  wipe_w = int(W * (1.0 - t_sc / 0.20))
                  if wipe_w > 10:
                      wipe_col = (56, 189, 248, 230) if sc_idx in (1, 3) else (16, 185, 129, 230)
                      dr_top.rectangle([0, 0, wipe_w, H], fill=wipe_col)

              # أخذ لقطة الفحص الذاتي عند اكتمال ظهور جميع عناصر المشهد (78% من مدة كل مشهد)
              if abs(prog_sc - 0.78) < 0.025 and sc_idx not in qa_frames:
                  qa_frames[sc_idx] = canvas.convert("RGB").resize((360, 640))

              try:
                  ffmpeg_proc.stdin.write(canvas.tobytes())
              except BrokenPipeError:
                  break

              if i % 90 == 0 or i == total_frames - 1:
                  print(f"⚡ تقدم الرندر: {i+1}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()

          print("🔍 [4/5] توليد لوحة الفحص البصري الذاتي للمشاهد الخمسة...", flush=True)
          sheet = Image.new("RGB", (1800, 640), (9, 13, 24))
          for k in range(5):
              if k in qa_frames:
                  sheet.paste(qa_frames[k], (k * 360, 0))
          sheet.save("QA_Inspection_Sheet.jpg", quality=92)
          print("✅ [5/5] اكتمل إنتاج النسخة المصححة من إعلان TEKVIYO 2.0!", flush=True)
          EOF
          python3 -u build_tekviyo_v2.py

      - name: 📦 4. رفع فيديو الإطلاق المصحح ولوحة الفحص
        uses: actions/upload-artifact@v4
        with:
          name: 🚀-TEKVIYO-2.0-Clean-Launch
          path: |
            TEKVIYO_2_Launch_Reel.mp4
            QA_Inspection_Sheet.jpg
          retention-days: 30

name: 🎬 AI Cinema Video Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_actor:
        description: 'المعلق الصوتي (shakir = رخيم حذر / hamed = رسمي / salma = نسائي)'
        required: false
        default: 'ar-EG-ShakirNeural'

jobs:
  render_cinema_reel:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت محركات المونتاج والصوتيات والمتصفح
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-hosny-amiri
          pip install -q playwright edge-tts
          playwright install --with-deps chromium

      - name: 🎨 3. بناء المشهد السينمائي الثلاثي الأبعاد والهندسة الصوتية
        env:
          VOICE_NAME: ${{ github.event.inputs.voice_actor || 'ar-EG-ShakirNeural' }}
        run: |
          cat << 'EOF' > build_studio.py
          import os, subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          os.makedirs("frames", exist_ok=True)
          voice_name = os.environ.get("VOICE_NAME", "ar-EG-ShakirNeural")

          # 1. توليد التعليق الصوتي مع ضبط سرعة وعمق النبرة (-5% سرعة، -4Hz لعمق الصوت)
          voice_text = "هل تتخيل أن يتحول كلامك أو فكرتك، إلى فيديو سينمائي متكامل وأنت نائم؟ كروت ثلاثية الأبعاد، مؤثرات صوتية متزامنة، وجودة استوديو احترافية تعمل بالخلفية على مدار الساعة."
          print("🎙️ جاري توليد التعليق الصوتي ومعالجته إذاعياً...")
          subprocess.run([
              "python3", "-m", "edge_tts",
              "--voice", voice_name,
              "--rate=-4%",
              "--pitch=-3Hz",
              "--text", voice_text,
              "--write-media", "raw_voice.mp3"
          ], check=True)

          # فلتر ماسترينغ إذاعي (Podcast Warmth EQ + Compression + Echo خفيف)
          subprocess.run([
              "ffmpeg", "-y", "-i", "raw_voice.mp3",
              "-af", "equalizer=f=120:width_type=o:width=2:g=4.5,equalizer=f=3500:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=3:attack=5:release=50:makeup=3dB",
              "voice_mastered.wav"
          ], check=True)

          dur_out = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", "voice_mastered.wav"
          ]).decode().strip()
          duration = float(dur_out) + 1.2
          fps = 30
          total_frames = int(duration * fps)

          # 2. توليد المؤثرات الصوتية السينمائية (Whoosh + Bass Drop + Ambient Pad) برمجياً
          print("🔊 جاري توليد ومزامنة المؤثرات الصوتية (Auto-SFX)...")
          # خلفية صوتية سينمائية دافئة (Ambient Drone)
          subprocess.run([
              "ffmpeg", "-y", "-f", "lavfi",
              "-i", f"aevalsrc='0.035*sin(2*PI*65*t)+0.025*sin(2*PI*97.5*t)+0.015*sin(2*PI*130*t)':s=44100:d={duration}",
              "-af", f"afade=t=in:st=0:d=1.0,afade=t=out:st={duration-1.5}:d=1.5",
              "ambient.wav"
          ], check=True)

          # مؤثر انتقال هوائي ناعم (Cinematic Whoosh) للكروت
          subprocess.run([
              "ffmpeg", "-y", "-f", "lavfi",
              "-i", "anoisesrc=d=0.45:c=pink:r=44100:a=0.18",
              "-af", "bandpass=f=700:width_type=h:w=500,afade=t=in:st=0:d=0.18,afade=t=out:st=0.22:d=0.23",
              "whoosh.wav"
          ], check=True)

          # دمج الصوت الماستر مع الخلفية والمؤثرات في اللحظات الدقيقة لحركة الكروت (1.2s, 2.8s, 4.4s)
          subprocess.run([
              "ffmpeg", "-y",
              "-i", "voice_mastered.wav",
              "-i", "ambient.wav",
              "-i", "whoosh.wav",
              "-filter_complex",
              "[2:a]adelay=300|300[w0];"
              "[2:a]adelay=1400|1400[w1];"
              "[2:a]adelay=2900|2900[w2];"
              "[2:a]adelay=4400|4400[w3];"
              "[0:a][1:a][w0][w1][w2][w3]amix=inputs=6:duration=first:dropout_transition=0,volume=2.2[aout]",
              "-map", "[aout]", "final_audio.aac"
          ], check=True)

          # 3. كتابة مشهد الموشن جرافيك السينمائي الثلاثي الأبعاد (1080x1920)
          html_scene = """<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              width: 1080px; height: 1920px; overflow: hidden;
              background: #050811; color: #ffffff;
              font-family: 'Cairo', sans-serif;
              perspective: 1400px; position: relative;
            }
            /* إضاءات خلفية سينمائية متحركة */
            .glow-1 {
              position: absolute; width: 750px; height: 750px; border-radius: 50%;
              background: radial-gradient(circle, rgba(249,115,22,0.32) 0%, rgba(234,88,12,0.08) 45%, transparent 70%);
              top: -80px; right: -150px; filter: blur(50px); z-index: 1;
            }
            .glow-2 {
              position: absolute; width: 800px; height: 800px; border-radius: 50%;
              background: radial-gradient(circle, rgba(56,189,248,0.22) 0%, rgba(14,165,233,0.05) 50%, transparent 70%);
              bottom: 50px; left: -200px; filter: blur(60px); z-index: 1;
            }
            /* شبكة ثلاثية الأبعاد في الخلفية */
            .grid-bg {
              position: absolute; inset: 0; z-index: 1; opacity: 0.18;
              background-image: 
                linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
              background-size: 72px 72px;
              mask-image: radial-gradient(circle at 50% 45%, black 30%, transparent 80%);
              -webkit-mask-image: radial-gradient(circle at 50% 45%, black 30%, transparent 80%);
            }
            .stage {
              position: relative; z-index: 5; width: 100%; height: 100%;
              padding: 110px 75px; display: flex; flex-direction: column;
              justify-content: space-between; transform-style: preserve-3d;
            }
            /* الهيدر العلوي */
            .header-area { text-align: center; transform-style: preserve-3d; }
            .pill-badge {
              display: inline-flex; align-items: center; gap: 14px;
              background: linear-gradient(135deg, rgba(249,115,22,0.2), rgba(249,115,22,0.05));
              border: 2px solid rgba(249,115,22,0.55);
              box-shadow: 0 0 35px rgba(249,115,22,0.3);
              padding: 14px 38px; border-radius: 60px; margin-bottom: 36px;
            }
            .dot {
              width: 16px; height: 16px; border-radius: 50%;
              background: #fb923c; box-shadow: 0 0 15px #fb923c;
            }
            .pill-text { font-size: 30px; font-weight: 800; color: #fed7aa; letter-spacing: 0.5px; }
            .hero-title {
              font-size: 78px; font-weight: 900; line-height: 1.22;
              text-shadow: 0 20px 50px rgba(0,0,0,0.8);
            }
            .hero-title .grad {
              background: linear-gradient(90deg, #fb923c, #f97316, #38bdf8);
              -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            }
            /* الكروت الزجاجية ثلاثية الأبعاد */
            .cards-stack {
              display: flex; flex-direction: column; gap: 38px;
              transform-style: preserve-3d; margin: 20px 0;
            }
            .glass-card {
              position: relative; overflow: hidden;
              background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
              border: 2px solid rgba(255,255,255,0.16);
              border-right: 8px solid #f97316;
              border-radius: 38px; padding: 42px 45px;
              display: flex; align-items: center; gap: 36px;
              box-shadow: 0 30px 60px rgba(0,0,0,0.55), inset 0 1px 2px rgba(255,255,255,0.25);
              backdrop-filter: blur(24px);
            }
            .glass-card.blue-accent { border-right-color: #38bdf8; }
            .glass-card.emerald-accent { border-right-color: #10b981; }
            .shimmer {
              position: absolute; top: 0; left: -120%; width: 65%; height: 100%;
              background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
              transform: skewX(-25deg);
            }
            .icon-box {
              width: 110px; height: 110px; border-radius: 28px; flex-shrink: 0;
              background: linear-gradient(135deg, #f97316, #c2410c);
              box-shadow: 0 15px 35px rgba(249,115,22,0.4);
              display: flex; align-items: center; justify-content: center;
              font-size: 48px; font-weight: 900; color: #fff;
            }
            .blue-accent .icon-box {
              background: linear-gradient(135deg, #38bdf8, #0284c7);
              box-shadow: 0 15px 35px rgba(56,189,248,0.4);
            }
            .emerald-accent .icon-box {
              background: linear-gradient(135deg, #10b981, #047857);
              box-shadow: 0 15px 35px rgba(16,185,129,0.4);
            }
            .card-body { flex: 1; }
            .card-tag {
              font-size: 24px; font-weight: 800; color: #fb923c;
              margin-bottom: 6px; display: block;
            }
            .blue-accent .card-tag { color: #7dd3fc; }
            .emerald-accent .card-tag { color: #6ee7b7; }
            .card-title { font-size: 44px; font-weight: 900; margin-bottom: 10px; color: #f8fafc; }
            .card-desc { font-size: 30px; font-weight: 600; color: #94a3b8; font-family: 'Tajawal', sans-serif; line-height: 1.4; }
            /* الفوتر وشريط الموجة الصوتية */
            .footer-bar {
              background: rgba(15,23,42,0.75); border: 2px solid rgba(255,255,255,0.12);
              border-radius: 30px; padding: 28px 42px;
              display: flex; align-items: center; justify-content: space-between;
            }
            .status-text { font-size: 30px; font-weight: 800; color: #e2e8f0; }
            .counter-num { font-size: 44px; font-weight: 900; color: #38bdf8; }
          </style>
          </head>
          <body>
            <div class="glow-1" id="g1"></div>
            <div class="glow-2" id="g2"></div>
            <div class="grid-bg"></div>

            <div class="stage" id="stage">
              <div class="header-area">
                <div class="pill-badge" id="badge">
                  <div class="dot"></div>
                  <span class="pill-text">محرك الإنتاج السينمائي الذاتي • 24/7</span>
                </div>
                <h1 class="hero-title" id="title">
                  مونتاج احترافي كامل<br>
                  <span class="grad">يعمل بالخلفية وأنت نائم</span>
                </h1>
              </div>

              <div class="cards-stack">
                <div class="glass-card" id="c1">
                  <div class="shimmer" id="sh1"></div>
                  <div class="icon-box">3D</div>
                  <div class="card-body">
                    <span class="card-tag">المرحلة الأولى • التصميم البصري</span>
                    <div class="card-title">كروت زجاجية بعمق ثلاثي الأبعاد</div>
                    <div class="card-desc">تحريك سينمائي انسيابي مع إضاءات وانعكاسات حقيقية بدقة 1080p</div>
                  </div>
                </div>

                <div class="glass-card blue-accent" id="c2">
                  <div class="shimmer" id="sh2"></div>
                  <div class="icon-box">SFX</div>
                  <div class="card-body">
                    <span class="card-tag">المرحلة الثانية • الهندسة الصوتية</span>
                    <div class="card-title">ماسترينغ إذاعي ومؤثرات متزامنة</div>
                    <div class="card-desc">دمج تلقائي لأصوات الانتقالات والخلفيات المحيطية بالجزء من الثانية</div>
                  </div>
                </div>

                <div class="glass-card emerald-accent" id="c3">
                  <div class="shimmer" id="sh3"></div>
                  <div class="icon-box">AI</div>
                  <div class="card-body">
                    <span class="card-tag">المرحلة الثالثة • الأتمتة الكاملة</span>
                    <div class="card-title">قص ذكي واستلام عبر التليجرام</div>
                    <div class="card-desc">طابور مهام سحابي ينجز فيديوهاتك المصورة والموشن بدون تدخل يدوي</div>
                  </div>
                </div>
              </div>

              <div class="footer-bar" id="footer">
                <div class="status-text">⚡ كفاءة خط الإنتاج الأوتوماتيكي</div>
                <div class="counter-num"><span id="cnt">0</span>%</div>
              </div>
            </div>

          <script>
            window.tl = gsap.timeline({ paused: true });

            // حركة الإضاءات الخلفية المستمرة
            window.tl.to("#g1", { x: -120, y: 100, scale: 1.25, duration: 6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0)
                     .to("#g2", { x: 140, y: -90, scale: 1.3, duration: 6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);

            // دخول الهيدر بعمق ثلاثي الأبعاد
            window.tl.from("#badge", { y: -70, rotationX: 45, opacity: 0, duration: 0.7, ease: "back.out(1.8)" }, 0.15)
                     .from("#title", { scale: 0.82, y: 40, rotationX: -25, opacity: 0, duration: 0.85, ease: "power4.out" }, 0.35);

            // دخول الكروت الثلاثية الأبعاد مع لمعة الضوء (Shimmer) متزامنة مع صوت الـ Whoosh
            window.tl.from("#c1", { x: 260, z: -300, rotationY: -28, opacity: 0, duration: 0.85, ease: "back.out(1.4)" }, 1.35)
                     .to("#sh1", { left: "140%", duration: 0.9, ease: "power2.inOut" }, 1.85)

                     .from("#c2", { x: 260, z: -300, rotationY: -28, opacity: 0, duration: 0.85, ease: "back.out(1.4)" }, 2.85)
                     .to("#sh2", { left: "140%", duration: 0.9, ease: "power2.inOut" }, 3.35)

                     .from("#c3", { x: 260, z: -300, rotationY: -28, opacity: 0, duration: 0.85, ease: "back.out(1.4)" }, 4.35)
                     .to("#sh3", { left: "140%", duration: 0.9, ease: "power2.inOut" }, 4.85);

            // دخول الفوتر وعداد النسبة المئوية
            let obj = { val: 0 };
            window.tl.from("#footer", { y: 80, opacity: 0, duration: 0.7, ease: "power3.out" }, 1.0)
                     .to(obj, {
                       val: 100, duration: 5.5, ease: "power2.out",
                       onUpdate: function() {
                         document.getElementById("cnt").innerText = Math.round(obj.val);
                       }
                     }, 1.2);
          </script>
          </body>
          </html>"""

          Path("scene.html").write_text(html_scene, encoding="utf-8")

          # 4. تصوير المشهد بدقة Full HD 1080x1920
          print(f"🎬 جاري رندر {total_frames} إطاراً بدقة 1080x1920...")
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
              page = browser.new_page(viewport={"width": 1080, "height": 1920})
              page.goto(f"file://{os.path.abspath('scene.html')}", wait_until="networkidle")
              page.evaluate("document.fonts.ready")
              page.wait_for_timeout(500)
              for i in range(total_frames):
                  t = i / fps
                  page.evaluate(f"window.tl.time({t})")
                  page.screenshot(path=f"frames/f_{i:04d}.jpg", type="jpeg", quality=94)
                  if i % 60 == 0:
                      print(f"⚡ تقدم الرندر: {i}/{total_frames} إطار...")
              browser.close()

          # 5. التصدير النهائي بأعلى جودة
          print("🚀 جاري دمج الفيديو النهائي...")
          subprocess.run([
              "ffmpeg", "-y", "-framerate", str(fps),
              "-i", "frames/f_%04d.jpg", "-i", "final_audio.aac",
              "-c:v", "libx264", "-preset", "medium", "-crf", "18",
              "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k",
              "-shortest", "Studio_Master_Reel.mp4"
          ], check=True)
          print("✅ اكتمل إنتاج الفيديو السينمائي بنجاح!")
          EOF
          python3 build_studio.py

      - name: 📦 4. رفع الفيديو الجاهز للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: 🎬-Finished-Cinema-Reel-MP4
          path: Studio_Master_Reel.mp4
          retention-days: 30

name: 🚀 TEKVIYO 2026 Kinetic Bento & 3D Camera Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_name:
        description: 'شخصية المعلق في Gemini 3.8 TTS (Charon / Fenrir)'
        required: false
        default: 'Charon'

jobs:
  render_2026_edition:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت محرك الرندر الحقيقي (Playwright + FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright edge-tts pillow numpy requests
          playwright install chromium

      - name: 🎬 3. رندر إعلان TEKVIYO 2.0 بمحرك 2026 (3D Camera + Live SVG + Blur Captions)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_PERSONA: ${{ github.event.inputs.voice_name || 'Charon' }}
        run: |
          cat << 'EOF' > build_2026_studio.py
          import os, subprocess, time, wave, math, base64, json
          import requests
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright

          os.makedirs("audio", exist_ok=True)

          scenes_script = [
              {
                  "id": 1,
                  "voice": "تَصْرِفُ آلافَ الدُّولَارَاتِ عَلَى الإِعْلَانَات... لَكِنَّ العُمَلَاءَ يَضِيعُونَ فِي زَحْمَةِ رَسَائِلِ الوَاتْسَاب، وَمُوَظَّفُوكَ غَارِقُونَ فِي الإِدْخَالِ اليَدَوِيِّ وَالفَوْضَى؟",
                  "words": ["تصرف", "آلاف", "الدولارات", "على", "الإعلانات..", "لكن", "العملاء", "يضيعون", "في", "زحمة", "الواتساب", "وموظفوك", "غارقون", "في", "الفوضى؟"]
              },
              {
                  "id": 2,
                  "voice": "التَّسْوِيقُ وَحْدَهُ لَمْ يَعُدْ يَكْفِي! فِي تِكْ فِيو، نَحْنُ لَا نُصَمِّمُ لَكَ إِعْلَانَاتٍ فَقَط... نَحْنُ نَبْنِي عَقْلَ أَعْمَالِكَ.",
                  "words": ["التسويق", "وحده", "لم", "يعد", "يكفي!", "في", "TEKVIYO", "نحن", "لا", "نصمم", "إعلانات", "فقط..", "نحن", "نبني", "عقل", "أعمالك."]
              },
              {
                  "id": 3,
                  "voice": "اِكْتَشِفْ قُوَّةَ الرَّبْطِ الذَّكِيّ! إِعْلَانَاتُكَ الآنَ تَصُبُّ مُبَاشَرَةً فِي نِظَامِكَ الإِدَارِيِّ لَحْظِيًّا. العَمِيلُ يَضْغَطُ عَلَى الإِعْلَان، بَيَانَاتُهُ تَظْهَرُ فِي شَاشَةِ سِكْرِتِيرَتِكَ، وَرِسَالَةُ التَّأْكِيدِ تَصِلُهُ أُوتُومَاتِيكِيًّا. لَا تَدَخُّلَ بَشَرِيّ، وَلَا عُمَلَاءَ ضَائِعِين.",
                  "words": ["اكتشف", "قوة", "الربط", "الذكي!", "العميل", "يضغط", "الإعلان..", "بياناته", "تظهر", "بشاشة", "السكرتيرة", "ورسالة", "التأكيد", "تصله", "لحظياً", "بلا", "عملاء", "ضائعين."]
              },
              {
                  "id": 4,
                  "voice": "سَوَاءٌ كُنْتَ عِيَادَةً طِبِّيَّة، مُؤَسَّسَةً عَقَارِيَّة، أَوْ مَرْكَزَ أَعْمَال.. أَنْظِمَتُنَا السَّحَابِيَّةُ المُخَصَّصَةُ تَمْنَحُكَ السَّيْطَرَةَ الكَامِلَةَ عَلَى مُوَظَّفِيك، مَبِيعَاتِك، وَنُمُوِّك، مِنْ أَيِّ مَكَانٍ فِي العَالَم.",
                  "words": ["سواء", "كنت", "عيادة", "طبية،", "مؤسسة", "عقارية،", "أو", "مركز", "أعمال..", "أنظمتنا", "السحابية", "تمنحك", "السيطرة", "الكاملة", "من", "أي", "مكان", "في", "العالم."]
              },
              {
                  "id": 5,
                  "voice": "لَا تَكْتَفِ بِالوَاجِهَة.. اِبْنِ مَنْظُومَةً مُتَكَامِلَةً لَا تُقْهَر. تَوَاصَلْ مَعَ تِكْ فِيو اليَوْم، وَاحْجِزْ اسْتِشَارَتَكَ التِّقْنِيَّةَ لِنَقْلِ أَعْمَالِكَ لِلْمُسْتَقْبَل.",
                  "words": ["لا", "تكتفِ", "بالواجهة..", "ابنِ", "منظومة", "متكاملة", "لا", "تُقهر.", "تواصل", "مع", "TEKVIYO", "اليوم", "واحجز", "استشارتك", "للمستقبل."]
              }
          ]

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          persona = os.environ.get("VOICE_PERSONA", "Charon").strip()

          def generate_scene_voice(idx, pure_text_ar, out_wav):
              used_gem = False
              if gemini_key:
                  for m_id in ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]:
                      try:
                          r = requests.post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/{m_id}:generateContent?key={gemini_key}",
                              json={
                                  "contents": [{"parts": [{"text": pure_text_ar}]}],
                                  "generationConfig": {
                                      "responseModalities": ["AUDIO"],
                                      "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": persona}}}
                                  }
                              },
                              timeout=35
                          )
                          if r.status_code == 200:
                              part = r.json()["candidates"][0]["content"]["parts"][0]["inlineData"]
                              raw_b = base64.b64decode(part["data"])
                              if "wav" in part.get("mimeType", "") or raw_b[:4] == b"RIFF":
                                  Path(f"audio/raw_{idx}.wav").write_bytes(raw_b)
                              else:
                                  Path(f"audio/raw_{idx}.pcm").write_bytes(raw_b)
                                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", f"audio/raw_{idx}.pcm", f"audio/raw_{idx}.wav"], check=True)
                              used_gem = True
                              print(f"🎙️ المشهد {idx}: تم توليد الصوت الصافي عبر {m_id}", flush=True)
                              break
                      except Exception:
                          pass
              if not used_gem:
                  subprocess.run(["python3", "-m", "edge_tts", "--voice", "ar-SA-HamedNeural", "--rate=+2%", "--pitch=+0Hz", "--text", pure_text_ar, "--write-media", f"audio/raw_{idx}.mp3"], check=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.mp3", f"audio/raw_{idx}.wav"], check=True)

              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.wav",
                  "-af", "silenceremove=start_periods=1:start_silence=0.05:start_threshold=-38dB,highpass=f=75,equalizer=f=120:width_type=o:width=2:g=3.5,equalizer=f=3800:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=2.5:makeup=3dB,apad=pad_dur=0.40",
                  "-ar", "48000", "-ac", "2", out_wav
              ], check=True)

          print("🔊 [1/4] توليد التعليق الصوتي وهندسة المؤثرات الصوتية...", flush=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "anoisesrc=d=0.28:c=pink:r=48000:a=0.42", "-af", "bandpass=f=900:width_type=h:w=600,afade=t=in:st=0:d=0.05,afade=t=out:st=0.12:d=0.16", "-ar", "48000", "-ac", "2", "audio/whoosh.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.65*sin(2*PI*1400*t)*exp(-45*t)+0.40*sin(2*PI*2800*t)*exp(-60*t)':s=48000:d=0.12", "-ar", "48000", "-ac", "2", "audio/click.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.50*sin(2*PI*880*t)*exp(-8*t)+0.40*sin(2*PI*1320*t)*exp(-6*t)':s=48000:d=0.55", "-ar", "48000", "-ac", "2", "audio/ping.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.42*sin(2*PI*(320+900*t)*t)*exp(-5*t)':s=48000:d=0.45", "-ar", "48000", "-ac", "2", "audio/zap.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.35*sin(2*PI*780*t)*(1+sin(2*PI*14*t))/2*exp(-2.2*t)':s=48000:d=0.90", "-ar", "48000", "-ac", "2", "audio/ring.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.55*sin(2*PI*(150-80*t)*t)*exp(-3.5*t)+0.30*sin(2*PI*528*t)*exp(-4*t)':s=48000:d=0.80", "-ar", "48000", "-ac", "2", "audio/shift.wav"], check=True)

          scene_durations = []
          for sc in scenes_script:
              sid = sc["id"]
              v_wav = f"audio/v_{sid}.wav"
              generate_scene_voice(sid, sc["voice"], v_wav)
              with wave.open(v_wav, "rb") as wf:
                  dur = wf.getnframes() / float(wf.getframerate())
              scene_durations.append(dur)

              s_out = f"audio/scene_{sid}_mix.wav"
              if sid == 1:
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", v_wav, "-i", "audio/ring.wav", "-i", "audio/whoosh.wav", "-filter_complex", "[1:a]adelay=500|500[r1];[2:a]adelay=1600|1600[w1];[1:a]adelay=3400|3400[r2];[0:a][r1][w1][r2]amix=inputs=4:duration=first:weights='2.3 0.75 0.9 0.75'[a]", "-map", "[a]", "-ar", "48000", "-ac", "2", s_out], check=True)
              elif sid == 2:
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", v_wav, "-i", "audio/shift.wav", "-i", "audio/ping.wav", "-filter_complex", "[1:a]adelay=50|50[sh];[2:a]adelay=2000|2000[pg];[0:a][sh][pg]amix=inputs=3:duration=first:weights='2.3 1.1 0.95'[a]", "-map", "[a]", "-ar", "48000", "-ac", "2", s_out], check=True)
              elif sid == 3:
                  t_click, t_zap, t_ping1, t_ping2 = int(dur*0.33*1000), int(dur*0.37*1000), int(dur*0.50*1000), int(dur*0.66*1000)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", v_wav, "-i", "audio/click.wav", "-i", "audio/zap.wav", "-i", "audio/ping.wav", "-filter_complex", f"[1:a]adelay={t_click}|{t_click}[c];[2:a]adelay={t_zap}|{t_zap}[z];[3:a]adelay={t_ping1}|{t_ping1}[p1];[3:a]adelay={t_ping2}|{t_ping2}[p2];[0:a][c][z][p1][p2]amix=inputs=5:duration=first:weights='2.3 1.3 1.1 1.05 1.05'[a]", "-map", "[a]", "-ar", "48000", "-ac", "2", s_out], check=True)
              elif sid == 4:
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", v_wav, "-i", "audio/whoosh.wav", "-i", "audio/click.wav", "-filter_complex", "[1:a]adelay=150|150[w1];[1:a]adelay=1100|1100[w2];[1:a]adelay=2000|2000[w3];[2:a]adelay=3200|3200[c1];[0:a][w1][w2][w3][c1]amix=inputs=5:duration=first:weights='2.3 0.9 0.9 0.9 1.0'[a]", "-map", "[a]", "-ar", "48000", "-ac", "2", s_out], check=True)
              else:
                  t_end_ping = int(max(1.0, dur - 1.1) * 1000)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", v_wav, "-i", "audio/shift.wav", "-i", "audio/click.wav", "-i", "audio/ping.wav", "-filter_complex", f"[1:a]adelay=100|100[s];[2:a]adelay=2500|2500[c];[3:a]adelay={t_end_ping}|{t_end_ping}[p];[0:a][s][c][p]amix=inputs=4:duration=first:weights='2.3 0.95 1.2 1.2'[a]", "-map", "[a]", "-ar", "48000", "-ac", "2", s_out], check=True)

          total_dur = sum(scene_durations)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", f"aevalsrc='0.018*sin(2*PI*65*t)+0.014*sin(2*PI*98*t)+0.010*sin(2*PI*147*t)':s=48000:d={total_dur}", "-af", f"afade=t=in:st=0:d=1.2,afade=t=out:st={max(0.5, total_dur-1.8)}:d=1.8", "-ar", "48000", "-ac", "2", "audio/ambient.wav"], check=True)

          concat_in = []
          for k in range(1, 6): concat_in.extend(["-i", f"audio/scene_{k}_mix.wav"])
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + concat_in + ["-filter_complex", "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1[vo]", "-map", "[vo]", "audio/all_vo.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", "audio/all_vo.wav", "-i", "audio/ambient.wav", "-filter_complex", "[0:a][1:a]amix=inputs=2:duration=first:weights='1.85 0.45'[aout]", "-map", "[aout]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"], check=True)

          # 2. بناء محرك 2026 التفاعلي الكامل (Live 3D DOM + SVG + Blur-Reveal Word Captions)
          print("🎨 [2/4] بناء مسرح 2026 التفاعلي (Apple/Linear Bento + 3D Camera + Blur Captions)...", flush=True)
          scenes_json = json.dumps(scenes_script, ensure_ascii=False)

          html_stage = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
          <style>
            * {{ box-sizing: border-box; margin: 0; padding: 0; }}
            body {{
              width: 1080px; height: 1920px; overflow: hidden;
              font-family: 'Cairo', sans-serif;
              background: #050811; color: #f8fafc;
              position: relative;
            }}
            .en {{ font-family: 'Plus Jakarta Sans', sans-serif; direction: ltr; display: inline-block; }}
            .mono {{ font-family: 'JetBrains Mono', monospace; direction: ltr; display: inline-block; }}

            /* الخلفية الحية المتغيرة (Dark Obsidian -> Apple Pearl Light Mode -> Royal Finale) */
            #bg-layer {{
              position: absolute; inset: 0; z-index: 0;
              background: radial-gradient(circle at 50% 25%, #1e1b4b 0%, #050811 70%);
            }}
            #orb1, #orb2 {{
              position: absolute; border-radius: 50%; filter: blur(95px); opacity: 0.55; z-index: 1;
            }}
            #orb1 {{ width: 680px; height: 680px; top: -120px; right: -120px; background: #ef4444; }}
            #orb2 {{ width: 620px; height: 620px; bottom: 220px; left: -120px; background: #f97316; }}

            #grid-overlay {{
              position: absolute; inset: 0; z-index: 2;
              background-image:
                linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
              background-size: 72px 72px;
            }}

            /* شريط الخطوات العلوي بستايل @ghalebgi (01/05 -> 05/05) */
            #top-hud {{
              position: absolute; top: 58px; left: 70px; right: 70px; z-index: 30;
              display: flex; align-items: center; justify-content: space-between;
            }}
            .step-bars {{ display: flex; gap: 14px; flex: 1; margin-left: 28px; }}
            .s-bar {{ height: 10px; flex: 1; border-radius: 99px; background: rgba(255,255,255,0.14); overflow: hidden; position: relative; }}
            .s-fill {{ position: absolute; inset: 0; width: 0%; background: #38bdf8; border-radius: 99px; }}
            .step-badge {{
              padding: 8px 22px; border-radius: 99px; font-size: 22px; font-weight: 900;
              background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
              color: #f8fafc; font-family: 'JetBrains Mono', monospace;
            }}

            /* الكاميرا ثلاثية الأبعاد (3D Camera Perspective Stage) */
            #viewport-3d {{
              position: absolute; top: 140px; left: 0; width: 1080px; height: 1280px;
              perspective: 1400px; z-index: 10;
              display: flex; align-items: center; justify-content: center;
            }}
            #camera-rig {{
              width: 960px; height: 1180px; position: relative;
              transform-style: preserve-3d;
            }}

            .scene {{
              position: absolute; inset: 0; display: none;
              flex-direction: column; justify-content: center; gap: 28px;
            }}

            /* بطاقات Bento الزجاجية لعام 2026 */
            .bento-card {{
              background: linear-gradient(145deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 100%);
              border: 1.5px solid rgba(255,255,255,0.14);
              border-radius: 40px; padding: 36px 42px;
              box-shadow: 0 30px 70px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
              position: relative; overflow: hidden;
            }}
            .bento-row {{ display: flex; gap: 28px; width: 100%; }}
            .bento-col {{ flex: 1; }}

            .pill-tag {{
              display: inline-flex; align-items: center; gap: 10px;
              padding: 8px 22px; border-radius: 99px; font-size: 22px; font-weight: 800;
              background: rgba(239,68,68,0.16); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35);
              margin-bottom: 18px;
            }}
            .hero-num {{ font-size: 78px; font-weight: 900; line-height: 1; letter-spacing: -2px; }}
            .card-h {{ font-size: 38px; font-weight: 900; line-height: 1.25; margin-top: 8px; }}
            .card-p {{ font-size: 25px; font-weight: 700; color: #94a3b8; margin-top: 8px; }}

            /* كابشن الضبابية الحركي كلمة بكلمة (@ghalebgi + @khaam.hq Style) */
            #kinetic-captions {{
              position: absolute; bottom: 85px; left: 60px; right: 60px; height: 320px;
              z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
              align-content: center; gap: 14px 20px; text-align: center;
            }}
            .k-word {{
              font-size: 52px; font-weight: 900; line-height: 1.25;
              padding: 4px 16px; border-radius: 20px;
              transition: none; display: inline-block;
            }}

            /* مؤشر الماوس ثلاثي الأبعاد والانتقال الهندسي */
            #cursor-layer {{
              position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
              pointer-events: none; z-index: 40; display: none;
            }}
            #wipe-layer {{
              position: absolute; inset: 0; z-index: 50; pointer-events: none;
              background: linear-gradient(135deg, #38bdf8, #10b981);
              transform: translateX(100%);
            }}
          </style>
          </head>
          <body>
            <div id="bg-layer"></div>
            <div id="orb1"></div>
            <div id="orb2"></div>
            <div id="grid-overlay"></div>

            <!-- شريط التقدم العلوي -->
            <div id="top-hud">
              <div class="step-bars">
                <div class="s-bar"><div id="bf0" class="s-fill"></div></div>
                <div class="s-bar"><div id="bf1" class="s-fill"></div></div>
                <div class="s-bar"><div id="bf2" class="s-fill"></div></div>
                <div class="s-bar"><div id="bf3" class="s-fill"></div></div>
                <div class="s-bar"><div id="bf4" class="s-fill"></div></div>
              </div>
              <div id="step-num" class="step-badge">01 / 05</div>
            </div>

            <!-- المسرح ثلاثي الأبعاد للمشاهد الخمسة -->
            <div id="viewport-3d">
              <div id="camera-rig">

                <!-- المشهد 1: الفوضى اليدوية ونزيف الإعلانات -->
                <div id="sc-1" class="scene">

                <!-- منصة حجز الاستشارة بحقل LTR سليم ومكان نقر آمن للماوس -->
                <div id="s5-box" class="glass-card" style="padding:34px 38px;flex:1;display:flex;flex-direction:column;justify-content:space-between">
                  <div style="display:flex;justify-content:space-between;align-items:center">

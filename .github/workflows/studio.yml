              <div style="display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid rgba(255,255,255,0.12);padding-top:18px">
                <span style="font-size:23px;font-weight:800;color:#00E5FF">● أتمتة سحابية 100%</span>
                <span id="dock-metric" class="mono" style="font-size:28px;font-weight:900;color:#FFB300">-$4,850 / MO</span>

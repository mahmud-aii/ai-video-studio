name: 🎬 TEKVIYO 2026 Turkish Wireframe Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      voice_name:
        description: 'شخصية المعلق في Gemini 3.8 TTS (Charon / Fenrir)'
        required: false
        default: 'Charon'

jobs:
  render_turkish_wireframe:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت محركات الرندر والصوتيات
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright edge-tts pillow numpy requests
          playwright install chromium

      - name: 🚀 3. رندر إعلان TEKVIYO 2.0 بالستايل التركي (Wireframe + Single-Word Pill + Sliding Dock)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_PERSONA: ${{ github.event.inputs.voice_name || 'Charon' }}
        run: |
          cat << 'EOF' > build_turkish_style.py
          import os, subprocess, time, wave, math, base64, json
          import requests
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright

          os.makedirs("audio", exist_ok=True)

          scenes_script = [
              {
                  "id": 1,
                  "badge": "[ 05 ] // 01 نزيف الإعلانات",
                  "voice": "تَصْرِفُ آلافَ الدُّولَارَاتِ عَلَى الإِعْلَانَات... لَكِنَّ العُمَلَاءَ يَضِيعُونَ فِي زَحْمَةِ رَسَائِلِ الوَاتْسَاب، وَمُوَظَّفُوكَ غَارِقُونَ فِي الإِدْخَالِ اليَدَوِيِّ وَالفَوْضَى؟",
                  "words": ["تصرف", "آلاف", "الدولارات", "على", "الإعلانات", "لكن", "العملاء", "يضيعون!", "في", "زحمة", "رسائل", "الواتساب", "وموظفوك", "غارقون", "في", "الإدخال", "اليدوي", "والفوضى؟"],
                  "highlights": ["آلاف", "الدولارات", "يضيعون!", "الواتساب", "والفوضى؟"]
              },
              {
                  "id": 2,
                  "badge": "[ 04 ] // 02 عقل الأعمال",
                  "voice": "التَّسْوِيقُ وَحْدَهُ لَمْ يَعُدْ يَكْفِي! فِي تِكْ فِيو، نَحْنُ لَا نُصَمِّمُ لَكَ إِعْلَانَاتٍ فَقَط... نَحْنُ نَبْنِي عَقْلَ أَعْمَالِكَ.",
                  "words": ["التسويق", "وحده", "لم", "يعد", "يكفي!", "في", "TEKVIYO", "نحن", "لا", "نصمم", "إعلانات", "فقط..", "نحن", "نبني", "(عقل)", "أعمالك!"],
                  "highlights": ["يكفي!", "TEKVIYO", "نبني", "(عقل)", "أعمالك!"]
              },
              {
                  "id": 3,
                  "badge": "[ 03 ] // 03 الربط اللحظي",
                  "voice": "اِكْتَشِفْ قُوَّةَ الرَّبْطِ الذَّكِيّ! إِعْلَانَاتُكَ الآنَ تَصُبُّ مُبَاشَرَةً فِي نِظَامِكَ الإِدَارِيِّ لَحْظِيًّا. العَمِيلُ يَضْغَطُ عَلَى الإِعْلَان، بَيَانَاتُهُ تَظْهَرُ فِي شَاشَةِ سِكْرِتِيرَتِكَ، وَرِسَالَةُ التَّأْكِيدِ تَصِلُهُ أُوتُومَاتِيكِيًّا. لَا تَدَخُّلَ بَشَرِيّ، وَلَا عُمَلَاءَ ضَائِعِين.",
                  "words": ["اكتشف", "قوة", "الربط", "الذكي!", "إعلاناتك", "تصب", "مباشرة", "في", "نظامك", "لحظياً!", "العميل", "يضغط", "الإعلان", "بياناته", "بشاشة", "السكرتيرة", "ورسالة", "التأكيد", "تصله", "أوتوماتيكياً", "بلا", "ضياع!"],
                  "highlights": ["الذكي!", "لحظياً!", "يضغط", "السكرتيرة", "أوتوماتيكياً", "ضياع!"]
              },
              {
                  "id": 4,
                  "badge": "[ 02 ] // 04 الأنظمة السحابية",
                  "voice": "سَوَاءٌ كُنْتَ عِيَادَةً طِبِّيَّة، مُؤَسَّسَةً عَقَارِيَّة، أَوْ مَرْكَزَ أَعْمَال.. أَنْظِمَتُنَا السَّحَابِيَّةُ المُخَصَّصَةُ تَمْنَحُكَ السَّيْطَرَةَ الكَامِلَةَ عَلَى مُوَظَّفِيك، مَبِيعَاتِك، وَنُمُوِّك، مِنْ أَيِّ مَكَانٍ فِي العَالَم.",
                  "words": ["سواء", "كنت", "عيادة", "طبية", "مؤسسة", "عقارية", "أو", "مركز", "أعمال", "أنظمتنا", "السحابية", "تمنحك", "السيطرة", "الكاملة", "على", "مبيعاتك", "ونموك", "من", "أي", "مكان", "في", "العالم!"],
                  "highlights": ["عيادة", "عقارية", "السحابية", "السيطرة", "ونموك", "العالم!"]
              },
              {
                  "id": 5,
                  "badge": "[ ∑ ] // 05 الخلاصة والانطلاق",
                  "voice": "لَا تَكْتَفِ بِالوَاجِهَة.. اِبْنِ مَنْظُومَةً مُتَكَامِلَةً لَا تُقْهَر. تَوَاصَلْ مَعَ تِكْ فِيو اليَوْم، وَاحْجِزْ اسْتِشَارَتَكَ التِّقْنِيَّةَ لِنَقْلِ أَعْمَالِكَ لِلْمُسْتَقْبَل.",
                  "words": ["لا", "تكتفِ", "بالواجهة..", "ابنِ", "منظومة", "متكاملة", "لا", "تُقهر!", "تواصل", "مع", "TEKVIYO", "اليوم", "واحجز", "استشارتك", "التقنية", "للمستقبل!"],
                  "highlights": ["منظومة", "تُقهر!", "TEKVIYO", "واحجز", "للمستقبل!"]
              }
          ]

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          persona = os.environ.get("VOICE_PERSONA", "Charon").strip()

          def generate_scene_voice(idx, pure_text_ar, out_wav):
              used_gem = False
              if gemini_key:
                  for m_id in ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-2.5-flash-preview-tts"]:
                      try:
                          r = requests.post(
                              f"https://generativelanguage.googleapis.com/v1beta/models/{m_id}:generateContent?key={gemini_key}",
                              json={
                                  "contents": [{"parts": [{"text": pure_text_ar}]}],
                                  "generationConfig": {
                                      "responseModalities": ["AUDIO"],
                                      "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": persona}}}
                                  }
                              },
                              timeout=35
                          )
                          if r.status_code == 200:
                              part = r.json()["candidates"][0]["content"]["parts"][0]["inlineData"]
                              raw_b = base64.b64decode(part["data"])
                              if "wav" in part.get("mimeType", "") or raw_b[:4] == b"RIFF":
                                  Path(f"audio/raw_{idx}.wav").write_bytes(raw_b)
                              else:
                                  Path(f"audio/raw_{idx}.pcm").write_bytes(raw_b)
                                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", f"audio/raw_{idx}.pcm", f"audio/raw_{idx}.wav"], check=True)
                              used_gem = True
                              print(f"🎙️ المشهد {idx}: تم توليد الصوت الصافي عبر {m_id}", flush=True)
                              break
                      except Exception:
                          pass
              if not used_gem:
                  subprocess.run(["python3", "-m", "edge_tts", "--voice", "ar-SA-HamedNeural", "--rate=+3%", "--pitch=+0Hz", "--text", pure_text_ar, "--write-media", f"audio/raw_{idx}.mp3"], check=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.mp3", f"audio/raw_{idx}.wav"], check=True)

              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", f"audio/raw_{idx}.wav",
                  "-af", "silenceremove=start_periods=1:start_silence=0.04:start_threshold=-38dB,highpass=f=75,equalizer=f=120:width_type=o:width=2:g=3.5,equalizer=f=3800:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=2.5:makeup=3dB,apad=pad_dur=0.35",
                  "-ar", "48000", "-ac", "2", out_wav
              ], check=True)

          print("🔊 [1/4] توليد التعليق الصوتي ومؤثرات الـ Micro-UI (Pop, Click, Stamp, Whoosh)...", flush=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "anoisesrc=d=0.24:c=pink:r=48000:a=0.40", "-af", "bandpass=f=950:width_type=h:w=650,afade=t=in:st=0:d=0.04,afade=t=out:st=0.10:d=0.14", "-ar", "48000", "-ac", "2", "audio/whoosh.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.65*sin(2*PI*1500*t)*exp(-48*t)+0.40*sin(2*PI*3000*t)*exp(-65*t)':s=48000:d=0.10", "-ar", "48000", "-ac", "2", "audio/click.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.55*sin(2*PI*(500+650*t)*t)*exp(-20*t)':s=48000:d=0.20", "-ar", "48000", "-ac", "2", "audio/pop.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.60*sin(2*PI*(150-85*t)*t)*exp(-10*t)+0.25*sin(2*PI*720*t)*exp(-22*t)':s=48000:d=0.35", "-ar", "48000", "-ac", "2", "audio/stamp.wav"], check=True)
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi", "-i", "aevalsrc='0.48*sin(2*PI*880*t)*exp(-8*t)+0.38*sin(2*PI*1320*t)*exp(-6*t)':s=48000:d=0.50", "-ar", "48000", "-ac", "2", "audio/ping.wav"], check=True)

          scene_durations = []
          for sc in scenes_script:
              sid = sc["id"]
              v_wav = f"audio/v_{sid}.wav"
              generate_scene_voice(sid, sc["voice"], v_wav)
              with wave.open(v_wav, "rb") as wf:
                  dur = wf.getnframes() / float(wf.getframerate())
              scene_durations.append(dur)

              s_out = f"audio/scene_{sid}_mix.wav"
              t_mid = int(dur * 0.42 * 1000)
              t_stamp = int(dur * 0.72 * 1000)
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-i", v_wav, "-i", "audio/whoosh.wav", "-i", "audio/pop.wav", "-i", "audio/click.wav", "-i", "audio/stamp.wav",
                  "-filter_complex",
                  f"[1:a]adelay=80|80[w];[2:a]adelay=650|650[p];[3:a]adelay={t_mid}|{t_mid}[c];[4:a]adelay={t_stamp}|{t_stamp}[st];"
                  "[0:a][w][p][c][st]amix=inputs=5:duration=first:weights='2.3 0.85 1.0 1.15 1.15'[a]",
                  "-map", "[a]", "-ar", "48000", "-ac", "2", s_out
              ], check=True)

          total_dur = sum(scene_durations)
          concat_in = []
          for k in range(1, 6):
              concat_in.extend(["-i", f"audio/scene_{k}_mix.wav"])
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"] + concat_in + ["-filter_complex", "[0:a][1:a][2:a][3:a][4:a]concat=n=5:v=0:a=1[vo]", "-map", "[vo]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"], check=True)

          print("🎨 [2/4] بناء المسرح الهندسي بالستايل التركي (3-Color Wireframe + Single-Word Pill + Sliding Dock)...", flush=True)
          scenes_json = json.dumps(scenes_script, ensure_ascii=False)

          html_stage = """<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              width: 1080px; height: 1920px; overflow: hidden;
              font-family: 'Cairo', sans-serif;
              background-color: #F7F7F5;
              color: #141519;
              position: relative;
              background-image:
                linear-gradient(to right, rgba(20,21,25,0.065) 1.5px, transparent 1.5px),
                linear-gradient(to bottom, rgba(20,21,25,0.065) 1.5px, transparent 1.5px);
              background-size: 48px 48px;
            }
            .mono { font-family: 'JetBrains Mono', monospace; direction: ltr; display: inline-block; }

            /* الشريط العلوي بستايل omergocmen: [ 05 ] // 01 */
            #top-bar {
              position: absolute; top: 56px; left: 60px; right: 60px; z-index: 30;
              display: flex; align-items: center; justify-content: space-between;
              direction: ltr;
            }
            .chapter-tag {
              background: #FFFFFF; border: 3px solid #141519;
              box-shadow: 5px 5px 0px #141519;
              border-radius: 14px; padding: 10px 24px;
              font-size: 26px; font-weight: 800; color: #141519;
              display: flex; align-items: center; gap: 12px;
            }
            .chapter-tag span.orange { color: #F05A28; font-weight: 900; }
            .brand-pill {
              background: #141519; color: #FFFFFF;
              border-radius: 14px; padding: 10px 24px;
              font-family: 'JetBrains Mono', monospace;
              font-size: 24px; font-weight: 800;
            }

            /* منطقة المخططات والـ Micro-UI العلوية والوسطى */
            #wireframe-stage {
              position: absolute; top: 155px; left: 60px; right: 60px; height: 1050px;
              z-index: 10; display: flex; flex-direction: column; justify-content: flex-start;
            }
            .scene { display: none; flex-direction: column; gap: 26px; width: 100%; }

            /* بطاقات الـ Wireframe الهندسية النظيفة */
            .wf-card {
              background: #FFFFFF;
              border: 3.5px solid #141519;
              border-radius: 28px;
              box-shadow: 8px 8px 0px #141519;
              padding: 32px 36px;
              position: relative;
            }
            .wf-card.orange-bg {
              background: #F05A28; color: #FFFFFF;
            }
            .wf-card.dark-bg {
              background: #141519; color: #FFFFFF;
            }
            .wf-header {
              display: flex; justify-content: space-between; align-items: center;
              border-bottom: 2.5px solid rgba(20,21,25,0.12);
              padding-bottom: 16px; margin-bottom: 20px;
            }
            .wf-dots { display: flex; gap: 8px; direction: ltr; }
            .wf-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #141519; background: #FFF; }
            .wf-dot.or { background: #F05A28; }

            /* شبكة المربعات الستة في المشهد الأول (6-Box Hook Grid) */
            .grid-6 {
              display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
            }
            .g-box {
              background: #FFFFFF; border: 3px solid #141519; border-radius: 20px;
              box-shadow: 5px 5px 0px #141519; padding: 22px 16px;
              text-align: center; font-size: 25px; font-weight: 800;
            }
            .g-box.mystery {
              background: #F05A28; color: #FFFFFF; font-size: 32px; font-weight: 900;
            }

            /* الأختام البرتقالية المائلة (CEZA / STAMP Style) */
            .stamp-badge {
              position: absolute; left: 34px; top: -18px;
              background: #F05A28; color: #FFFFFF;
              border: 3px solid #141519; box-shadow: 4px 4px 0px #141519;
              padding: 8px 26px; border-radius: 14px;
              font-size: 26px; font-weight: 900;
              transform: rotate(-6deg); z-index: 25;
            }

            /* كبسولة الكلمة الواحدة في المنتصف (Single-Word Black/Orange Pill) */
            #word-pill-wrap {
              position: absolute; top: 1175px; left: 0; right: 0;
              z-index: 35; display: flex; justify-content: center; align-items: center;
              pointer-events: none;
            }
            #single-word-pill {
              background: #141519; color: #FFFFFF;
              border: 3.5px solid #141519;
              box-shadow: 0 14px 30px rgba(20,21,25,0.22);
              padding: 14px 48px; border-radius: 99px;
              font-size: 50px; font-weight: 900; line-height: 1.2;
              text-align: center; min-width: 240px;
            }

            /* البطاقة السفلية المنزلقة للأعلى والأسفل (Sliding Speaker / Summary Dock Card) */
            #sliding-bottom-dock {
              position: absolute; bottom: 0; left: 50px; right: 50px; height: 590px;
              background: #141519; color: #FFFFFF;
              border: 4px solid #141519; border-bottom: none;
              border-radius: 44px 44px 0 0;
              box-shadow: 0 -20px 50px rgba(20,21,25,0.18);
              z-index: 20; overflow: hidden;
              display: flex; flex-direction: column; justify-content: space-between;
              padding: 36px 44px 44px;
            }
            .dock-top-bar {
              width: 110px; height: 8px; background: rgba(255,255,255,0.25);
              border-radius: 99px; margin: 0 auto 18px;
            }
            .dock-grid-bg {
              position: absolute; inset: 0; opacity: 0.08; pointer-events: none;
              background-image: radial-gradient(#FFFFFF 2px, transparent 2px);
              background-size: 32px 32px;
            }

            /* مؤشر الماوس الهندسي */
            #cursor-svg {
              position: absolute; top: 0; left: 0; width: 1080px; height: 1920px;
              z-index: 45; pointer-events: none; display: none;
            }
          </style>
          </head>
          <body>

            <!-- شريط الفصل العلوي بستايل الشاب التركي -->
            <div id="top-bar">
              <div class="chapter-tag">
                <span id="ch-num" class="mono orange">[ 05 ]</span>
                <span id="ch-title" style="font-family:'Cairo',sans-serif;direction:rtl">01 // نزيف الإعلانات</span>
              </div>
              <div class="brand-pill">TEKVIYO // 2.0</div>
            </div>

            <!-- مسرح الواجهات الخطية التفاعلية (Wireframe Stage) -->
            <div id="wireframe-stage">

              <!-- المشهد 1: خطاف الرقم الكبير + المربعات الستة -->
              <div id="sc-1" class="scene">
                <div id="s1-main" class="wf-card" style="text-align:center;padding:40px 36px">
                  <div id="s1-stamp" class="stamp-badge">هدر شهري // LOST</div>
                  <div style="font-size:28px;font-weight:800;color:#52525B;margin-bottom:8px">نزيف ميزانية الإعلانات بدون ربط برمجي</div>
                  <div id="s1-big-num" class="mono" style="font-size:92px;font-weight:900;color:#141519;letter-spacing:-3px;line-height:1">
                    -$4,850
                  </div>
                  <div style="margin-top:16px;display:inline-block;background:#F05A28;color:#FFF;padding:6px 24px;border-radius:12px;font-size:25px;font-weight:900">
                    64% من العملاء يضيعون في زحمة الواتساب
                  </div>
                </div>

                <!-- شبكة المربعات الستة على طريقة الفيديو التركي -->
                <div class="grid-6">
                  <div id="b1" class="g-box"><div class="mono" style="color:#71717A;font-size:18px">01</div>إعلان ممول</div>
                  <div id="b2" class="g-box"><div class="mono" style="color:#71717A;font-size:18px">02</div>+99 واتساب</div>
                  <div id="b3" class="g-box"><div class="mono" style="color:#71717A;font-size:18px">03</div>ورق يدوي</div>
                  <div id="b4" class="g-box"><div class="mono" style="color:#71717A;font-size:18px">04</div>تأخر الرد</div>
                  <div id="b5" class="g-box"><div class="mono" style="color:#71717A;font-size:18px">05</div>تشتت الموظف</div>
                  <div id="b6" class="g-box mystery"><div class="mono" style="font-size:18px">06</div><span id="b6-txt">[ ? ]</span></div>
                </div>
              </div>

              <!-- المشهد 2: تغيير القواعد وبناء عقل الأعمال -->
              <div id="sc-2" class="scene">
                <div id="s2-core" class="wf-card dark-bg" style="text-align:center;padding:44px">

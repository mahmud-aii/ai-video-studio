name: 🎬 Smart Auto-Cut + White-Wall Keyer + Bottom Captions

on:
  push:
    branches: [ main ]
  release:
    types: [ published, edited ]
  workflow_dispatch:

jobs:
  smart_edit_reel:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت محركات العزل الهجين والمونتاج
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q "rembg[cpu]" onnxruntime playwright pillow numpy opencv-python-headless requests
          playwright install chromium

      - name: 🚀 3. قص الصمت والأخطاء + عزل الخلفية البيضاء + الكابشن السفلي
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > smart_white_editor.py
          import os, glob, subprocess, time, math, urllib.request
          import numpy as np
          import cv2
          import requests
          from pathlib import Path
          from PIL import Image, ImageDraw
          from rembg import remove, new_session
          from playwright.sync_api import sync_playwright

          os.makedirs("ui_layers", exist_ok=True)
          os.makedirs("assets", exist_ok=True)
          os.makedirs("segments", exist_ok=True)
          input_video = None

          # 1. سحب أحدث فيديو مرفوع في Releases تلقائياً
          repo = os.environ.get("GH_REPO", "")
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Authorization": f"token {token}"} if token else {}
          try:
              resp = requests.get(f"https://api.github.com/repos/{repo}/releases", headers=headers, timeout=15)
              if resp.status_code == 200:
                  all_assets = []
                  for rel in resp.json():
                      for asset in rel.get("assets", []):
                          if asset.get("name", "").lower().endswith((".mp4", ".mov", ".mkv")):
                              all_assets.append(asset)
                  if all_assets:
                      # ترتيب لاختيار أحدث فيديو رفعه محمود
                      all_assets.sort(key=lambda x: x.get("updated_at", ""), reverse=True)
                      latest = all_assets[0]
                      print(f"📦 [1/5] سحب أحدث فيديو خام من Releases: {latest['name']}", flush=True)
                      urllib.request.urlretrieve(latest["browser_download_url"], "raw_input.mp4")
                      input_video = "raw_input.mp4"
          except Exception as e:
              print(f"⚠️ فحص Releases: {e}", flush=True)

          if not input_video or not os.path.exists(input_video):
              files = [f for f in glob.glob("*.mp4") if "Smart_" not in f and "seg_" not in f]
              if files:
                  input_video = files[0]

          if not input_video:
              raise FileNotFoundError("⚠️ يرجى رفع الفيديو الجديد في قسم Releases أولاً!")

          # 2. قص الفواصل الصامتة والخطأ المتعمد (30.8 - 22.8) ودمج المقاطع النظيفة مع Jump-Cut Zoom
          print("✂️ [2/5] قص الفواصل الصامتة وحذف مقطع الخطأ وإعادة الجملة تلقائياً...", flush=True)
          # المقاطع المعتمدة من الفيديو الخام: (البداية، النهاية، معامل الزوم لكسر الـ Jump Cut)
          keep_segments = [
              (0.20, 4.95, 1.00),  # 0.0 -> 4.75s: الفيديو الماضي كان عملياً...
              (5.05, 8.15, 1.06),  # 4.75 -> 7.85s: أنا عم حاول هلق إني أصور على خلفية بيضاء
              # [تم قص الصمت الأول: 8.15 -> 9.70]
              (9.70, 13.80, 1.00), # 7.85 -> 11.95s: وأنا أصلاً حطيت هلق فاصل صامت لأشوفك إذا رح تعرف تقصه أو لا
              # [تم قص الصمت الثاني: 13.80 -> 15.80]
              (15.80, 19.00, 1.07),# 11.95 -> 15.15s: فأنا بدي إياك تحط الكابشن تماماً هون (إشارة للأسفل)
              (19.00, 22.80, 1.00),# 15.15 -> 18.95s: ولا تنسى النص الفوقاني تحط فيه ما يناسب (تلويح للأعلى)
              # [تم قص الخطأ وإعادة الجملة: 22.80 -> 30.80]
              (30.80, 32.85, 1.06) # 18.95 -> 21.00s: خلينا نشوف شو رح يطلع معك!
          ]

          concat_list = []
          for idx, (st, et, zm) in enumerate(keep_segments):
              dur = et - st
              vw = int(860 * zm)
              vh = int(1120 * zm)
              seg_v = f"segments/v_{idx}.mp4"
              seg_a = f"segments/a_{idx}.wav"
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-ss", str(st), "-t", str(dur), "-i", input_video,
                  "-vf", f"scale={vw}:{vh}:force_original_aspect_ratio=increase,crop=860:1120,fps=30",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "14", "-an", seg_v
              ], check=True)
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-ss", str(st), "-t", str(dur), "-i", input_video,
                  "-af", f"afade=t=in:st=0:d=0.03,afade=t=out:st={max(0, dur-0.03)}:d=0.03",
                  "-ar", "48000", "-ac", "2", seg_a
              ], check=True)
              concat_list.append((seg_v, seg_a))

          Path("v_list.txt").write_text("\n".join([f"file '{v}'" for v, _ in concat_list]), encoding="utf-8")
          Path("a_list.txt").write_text("\n".join([f"file '{a}'" for _, a in concat_list]), encoding="utf-8")

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", "v_list.txt", "-c", "copy", "clean_speaker.mp4"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "concat", "-safe", "0", "-i", "a_list.txt",
              "-af", "highpass=f=80,equalizer=f=130:width_type=o:width=2:g=3.5,equalizer=f=3800:width_type=o:width=2:g=3.0,acompressor=threshold=-18dB:ratio=3:attack=5:release=60:makeup=4dB",
              "voice_master.wav"
          ], check=True)

          # 3. توليد المؤثرات الصوتية المتزامنة مع Timeline الجديد بعد القص
          print("🔊 [3/5] تصميم المؤثرات الصوتية للمشاهد وإشارات اليد...", flush=True)
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "anoisesrc=d=0.32:c=pink:r=48000:a=0.42",
              "-af", "bandpass=f=850:width_type=h:w=600,afade=t=in:st=0:d=0.07,afade=t=out:st=0.14:d=0.18",
              "-ar", "48000", "-ac", "2", "sfx_whoosh.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "aevalsrc='0.55*sin(2*PI*(540+620*t)*t)*exp(-18*t)':s=48000:d=0.25",
              "-ar", "48000", "-ac", "2", "sfx_pop.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "aevalsrc='0.50*sin(2*PI*980*t)*exp(-22*t)+0.35*sin(2*PI*1470*t)*exp(-18*t)':s=48000:d=0.30",
              "-ar", "48000", "-ac", "2", "sfx_ding.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", "voice_master.wav", "-i", "sfx_whoosh.wav", "-i", "sfx_pop.wav", "-i", "sfx_ding.wav",
              "-filter_complex",
              "[1:a]adelay=150|150[w1];"
              "[2:a]adelay=4750|4750[p1];"
              "[1:a]adelay=7850|7850[w2];"
              "[3:a]adelay=8600|8600[d1];"
              "[2:a]adelay=12200|12200[p2];"
              "[1:a]adelay=15150|15150[w3];"
              "[3:a]adelay=18950|18950[d2];"
              "[0:a][w1][p1][w2][d1][p2][w3][d2]amix=inputs=8:duration=first:dropout_transition=0:"
              "weights='2.2 0.9 1.1 0.9 1.1 1.2 1.0 1.2'[aout]",
              "-map", "[aout]", "-c:a", "aac", "-b:a", "320k", "final_audio.aac"
          ], check=True)

          # 4. تحميل الصور وبناء مشاهد النصف العلوي + الكابشن السفلي الحرفي
          print("🎨 [4/5] بناء المسرح العلوي والكابشن السفلي...", flush=True)
          img_urls = {
              "p1": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=85",
              "p2": "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=300&q=85",
              "p3": "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&w=300&q=85"
          }
          for k, u in img_urls.items():
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      Path(f"assets/{k}.jpg").write_bytes(r.read())
              except Exception:
                  Image.new("RGB", (300, 300), (40, 50, 70)).save(f"assets/{k}.jpg")

          p1_uri = Path("assets/p1.jpg").resolve().as_uri()
          p2_uri = Path("assets/p2.jpg").resolve().as_uri()
          p3_uri = Path("assets/p3.jpg").resolve().as_uri()

          captions_timeline = [
              ("cap0", "الفيديو الماضي كان على خلفية", "بتشبه لون شعري ولون بشرتي 🎨", 0.0, 4.75),
              ("cap1", "عم حاول هلق أصور", "على خلفية بيضاء صافية ⚪", 4.75, 7.85),
              ("cap2", "حطيت فاصل صامت لأشوفك", "إذا رح تعرف تقصه أو لا ✂️", 7.85, 11.95),
              ("cap3", "بدي إياك تحط الكابشن", "تماماً هون بأسفل الشاشة! 👇", 11.95, 15.15),
              ("cap4", "ولا تنسى النص الفوقاني", "تحط فيه ما يناسب الكلام 👋", 15.15, 18.95),
              ("cap5", "تم قص الخطأ والإعادة..", "وخلينا نشوف شو طلع معك! 🔥", 1

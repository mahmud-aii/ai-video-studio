name: 🎬 AI Cinema Video Studio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render_cinema_reel:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. تجهيز السيرفر السحابي
        uses: actions/checkout@v4

      - name: ⚙️ 2. تثبيت المحركات السحابية
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright edge-tts pillow numpy
          playwright install chromium

      - name: 🚀 3. الرندر الهجين فائق السرعة (5 طبقات + 8 ثوانٍ تحريك)
        run: |
          cat << 'EOF' > build_studio.py
          import os, subprocess, time
          import numpy as np
          from pathlib import Path
          from PIL import Image, ImageDraw
          from playwright.sync_api import sync_playwright

          os.makedirs("layers", exist_ok=True)

          # 1. توليد التعليق الصوتي والماسترينغ الإذاعي
          print("🎙️ [1/4] جاري توليد التعليق الصوتي ومعالجته إذاعياً...", flush=True)
          voice_text = "هل تتخيل أن يتحول كلامك أو فكرتك، إلى فيديو سينمائي متكامل وأنت نائم؟ كروت زجاجية، مؤثرات صوتية متزامنة، وجودة استوديو احترافية تعمل بالخلفية على مدار الساعة."
          subprocess.run([
              "python3", "-m", "edge_tts",
              "--voice", "ar-EG-ShakirNeural", "--rate=-4%", "--pitch=-3Hz",
              "--text", voice_text, "--write-media", "raw_voice.mp3"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", "raw_voice.mp3",
              "-af", "equalizer=f=120:width_type=o:width=2:g=4.5,equalizer=f=3500:width_type=o:width=2:g=2.5,acompressor=threshold=-16dB:ratio=3:attack=5:release=50:makeup=3dB",
              "voice_mastered.wav"
          ], check=True)

          dur_out = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", "voice_mastered.wav"
          ]).decode().strip()
          duration = float(dur_out) + 1.0
          fps = 30
          total_frames = int(duration * fps)

          # 2. توليد ومزامنة المؤثرات الصوتية السينمائية (Auto-SFX)
          print("🔊 [2/4] جاري توليد ومزامنة المؤثرات الصوتية...", flush=True)
          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", f"aevalsrc='0.035*sin(2*PI*65*t)+0.025*sin(2*PI*97.5*t)+0.015*sin(2*PI*130*t)':s=44100:d={duration}",
              "-af", f"afade=t=in:st=0:d=1.0,afade=t=out:st={duration-1.5}:d=1.5",
              "ambient.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "lavfi",
              "-i", "anoisesrc=d=0.42:c=pink:r=44100:a=0.22",
              "-af", "bandpass=f=750:width_type=h:w=500,afade=t=in:st=0:d=0.15,afade=t=out:st=0.20:d=0.22",
              "whoosh.wav"
          ], check=True)

          subprocess.run([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-i", "voice_mastered.wav", "-i", "ambient.wav", "-i", "whoosh.wav",
              "-filter_complex",
              "[2:a]adelay=200|200[w0];[2:a]adelay=1300|1300[w1];[2:a]adelay=2800|2800[w2];[2:a]adelay=4300|4300[w3];"
              "[0:a][1:a][w0][w1][w2][w3]amix=inputs=6:duration=first:dropout_transition=0,volume=2.2[aout]",
              "-map", "[aout]", "final_audio.aac"
          ], check=True)

          # 3. استخدام المتصفح لثانية واحدة فقط لاستخراج 5 طبقات شفافة فائقة الدقة
          print("🎨 [3/4] استخراج الطبقات الزجاجية الشفافة في ثانية واحدة...", flush=True)
          html_layers = """<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { background: transparent; color: #fff; font-family: 'Cairo', sans-serif; width: 1080px; padding: 20px; }
            .block { width: 930px; padding: 15px; margin-bottom: 40px; }
            #header { text-align: center; }
            .pill-badge {
              display: inline-flex; align-items: center; gap: 14px;
              background: linear-gradient(135deg, rgba(249,115,22,0.28), rgba(15,23,42,0.95));
              border: 2px solid #f97316; padding: 14px 38px; border-radius: 60px; margin-bottom: 30px;
            }
            .dot { width: 16px; height: 16px; border-radius: 50%; background: #fb923c; }
            .pill-text { font-size: 30px; font-weight: 800; color: #fed7aa; }
            .hero-title { font-size: 74px; font-weight: 900; line-height: 1.25; }
            .hero-title .grad { color: #fb923c; }
            .glass-card {
              width: 930px;
              background: linear-gradient(135deg, rgba(30,41,59,0.95) 0%, rgba(15,23,42,0.98) 100%);
              border: 2px solid rgba(255,255,255,0.22);
              border-right: 12px solid #f97316;
              border-radius: 38px; padding: 40px 44px;
              display: flex; align-items: center; gap: 36px;
              box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            }
            .glass-card.blue { border-right-color: #38bdf8; }
            .glass-card.emerald { border-right-color: #10b981; }
            .icon-box {
              width: 110px; height: 110px; border-radius: 28px; flex-shrink: 0;
              background: linear-gradient(135deg, #f97316, #c2410c);
              display: flex; align-items: center; justify-content: center;
              font-size: 46px; font-weight: 900; color: #fff;
            }
            .blue .icon-box { background: linear-gradient(135deg, #38bdf8, #0284c7); }
            .emerald .icon-box { background: linear-gradient(135deg, #10b981, #047857); }
            .card-body { flex: 1; }
            .card-tag { font-size: 24px; font-weight: 800; color: #fb923c; margin-bottom: 6px; display: block; }
            .blue .card-tag { color: #7dd3fc; }
            .emerald .card-tag { color: #6ee7b7; }
            .card-title { font-size: 42px; font-weight: 900; margin-bottom: 8px; color: #f8fafc; }
            .card-desc { font-size: 29px; font-weight: 600; color: #cbd5e1; font-family: 'Tajawal', sans-serif; line-height: 1.4; }
            #footer {
              width: 930px; background: rgba(15,23,42,0.95);
              border: 2px solid rgba(255,255,255,0.2); border-radius: 30px;
              padding: 28px 42px; display: flex; align-items: center; justify-content: space-between;
            }
            .status-text { font-size: 30px; font-weight: 800; color: #e2e8f0; }
            .counter-num { font-size: 38px; font-weight: 900; color: #38bdf8; }
          </style>
          </head>
          <body>
            <div id="header" class="block">
              <div class="pill-badge"><div class="dot"></div><span class="pill-text">محرك الإنتاج السينمائي الذاتي • 24/7</span></div>
              <h1 class="hero-title">مونتاج احترافي كامل<br><span class="grad">يعمل بالخلفية وأنت نائم</span></h1>
            </div>
            <div id="c1" class="glass-card">
              <div class="icon-box">3D</div>
              <div class="card-body">
                <span class="card-tag">المرحلة الأولى • التصميم البصري</span>
                <div class="card-title">كروت زجاجية بعمق ثلاثي الأبعاد</div>
                <div class="card-desc">تحريك سينمائي انسيابي مع إضاءات وانعكاسات حقيقية بدقة 1080p</div>
              </div>
            </div>
            <div id="c2" class="glass-card blue">
              <div class="icon-box">SFX</div>
              <div class="card-body">
                <span class="card-tag">المرحلة الثانية • الهندسة الصوتية</span>
                <div class="card-title">ماسترينغ إذاعي ومؤثرات متزامنة</div>
                <div class="card-desc">دمج تلقائي لأصوات الانتقالات والخلفيات المحيطية بالجزء من الثانية</div>
              </div>
            </div>
            <div id="c3" class="glass-card emerald">
              <div class="icon-box">AI</div>
              <div class="card-body">
                <span class="card-tag">المرحلة الثالثة • الأتمتة الكاملة</span>
                <div class="card-title">قص ذكي واستلام عبر التليجرام</div>
                <div class="card-desc">طابور مهام سحابي ينجز فيديوهاتك المصورة والموشن بدون تدخل يدوي</div>
              </div>
            </div>
            <div id="footer">
              <div class="status-text">⚡ كفاءة خط الإنتاج الأوتوماتيكي</div>
              <div class="counter-num">100% FULL HD</div>
            </div>
          </body>
          </html>"""

          Path("layers.html").write_text(html_layers, encoding="utf-8")

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 2400})
              page.goto(f"file://{os.path.abspath('layers.html')}", wait_until="networkidle")
              page.wait_for_timeout(800)
              for el_id in ["header", "c1", "c2", "c3", "footer"]:
                  page.locator(f"#{el_id}").screenshot(path=f"layers/{el_id}.png", omit_background=True, animations="disabled")
              browser.close()
          print("✅ تم استخراج الطبقات الخمس وإغلاق المتصفح بنجاح!", flush=True)

          # 4. التحريك الفوري فائق السرعة عبر المصفوفات وضخه مباشرة إلى FFmpeg
          print(f"🎬 [4/4] جاري تحريك ورندر {total_frames} إطاراً بسرعة الصاروخ...", flush=True)
          W, H = 1080, 1920
          y_idx, x_idx = np.ogrid[:H, :W]
          d1 = np.clip(np.sqrt((x_idx - W*0.85)**2 + (y_idx - H*0.12)**2) / (H*0.55), 0, 1)
          d2 = np.clip(np.sqrt((x_idx - W*0.15)**2 + (y_idx - H*0.85)**2) / (H*0.55), 0, 1)
          r = (5 + 65*(1-d1) + 12*(1-d2)).clip(0, 255).astype(np.uint8)
          g = (8 + 28*(1-d1) + 45*(1-d2)).clip(0, 255).astype(np.uint8)
          b = (17 + 8*(1-d1) + 85*(1-d2)).clip(0, 255).astype(np.uint8)
          bg_img = Image.fromarray(np.stack([r, g, b], axis=-1), "RGB").convert("RGBA")

          # رسم شبكة هندسية خفيفة على الخلفية
          grid_draw = ImageDraw.Draw(bg_img)
          for gx in range(0, W, 72):
              grid_draw.line([(gx, 0), (gx, H)], fill=(255, 255, 255, 12), width=1)
          for gy in range(0, H, 72):
              grid_draw.line([(0, gy), (W, gy)], fill=(255, 255, 255, 12), width=1)

          img_header = Image.open("layers/header.png").convert("RGBA")
          img_c1 = Image.open("layers/c1.png").convert("RGBA")
          img_c2 = Image.open("layers/c2.png").convert("RGBA")
          img_c3 = Image.open("layers/c3.png").convert("RGBA")
          img_footer = Image.open("layers/footer.png").convert("RGBA")

          def ease_back(x):
              x = float(np.clip(x, 0.0, 1.0))
              return 1.0 + 2.70158 * ((x - 1.0) ** 3) + 1.70158 * ((x - 1.0) ** 2)

          def paste_layer(canvas, layer, x, y, alpha_mult):
              if alpha_mult <= 0.01:
                  return
              if alpha_mult < 0.99:
                  l_copy = layer.copy()
                  a = l_copy.getchannel("A").point(lambda p: int(p * alpha_mult))
                  l_copy.putalpha(a)
                  canvas.alpha_composite(l_copy, (int(x), int(y)))
              else:
                  canvas.alpha_composite(layer, (int(x), int(y)))

          ffmpeg_proc = subprocess.Popen([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgba", "-r", str(fps), "-i", "-",
              "-i", "final_audio.aac", "-c:v", "libx264", "-preset", "ultrafast",
              "-crf", "18", "-pix_fmt", "yuv420p", "-c:a", "copy",
              "-shortest", "Studio_Master_Reel.mp4"
          ], stdin=subprocess.PIPE)

          t0 = time.time()
          for i in range(total_frames):
              t = i / fps
              frame = bg_img.copy()

              # تحريك الهيدر
              p_h = ease_back((t - 0.1) / 0.65)
              a_h = float(np.clip((t - 0.1) / 0.4, 0, 1))
              paste_layer(frame, img_header, 75, 110 - int((1 - p_h) * 80), a_h)

              # تحريك الكروت الثلاثة
              for idx, (card_img, delay, base_y) in enumerate([(img_c1, 1.3, 520), (img_c2, 2.8, 880), (img_c3, 4.3, 1240)]):
                  p_c = ease_back((t - delay) / 0.7)
                  a_c = float(np.clip((t - delay) / 0.35, 0, 1))
                  cx = 75 + int((1 - p_c) * 350)
                  if -400 < cx < W:
                      paste_layer(frame, card_img, max(0, cx), base_y, a_c)

              # تحريك الفوتر وشريط التقدم المضيء
              p_f = ease_back((t - 0.8) / 0.6)
              a_f = float(np.clip((t - 0.8) / 0.4, 0, 1))
              paste_layer(frame, img_footer, 75, 1650 + int((1 - p_f) * 70), a_f)

              # شريط تقدم برتقالي سفلي حي
              dr = ImageDraw.Draw(frame)
              prog_w = int(930 * (i / max(1, total_frames - 1)))
              dr.rounded_rectangle([75, 1815, 1005, 1829], radius=7, fill=(255, 255, 255, 45))
              dr.rounded_rectangle([75, 1815, 75 + max(15, prog_w), 1829], radius=7, fill=(249, 115, 22, 255))

              ffmpeg_proc.stdin.write(frame.tobytes())
              if i % 60 == 0 or i == total_frames - 1:
                  print(f"⚡ تقدم الرندر: {i+1}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

          ffmpeg_proc.stdin.close()
          ffmpeg_proc.wait()
          print("✅ اكتمل إنتاج الفيديو السينمائي بنجاح ساحق!", flush=True)
          EOF
          python3 -u build_studio.py

      - name: 📦 4. رفع الفيديو الجاهز للتحميل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: 🎬-Finished-Cinema-Reel-MP4
          path: Studio_Master_Reel.mp4
          retention-days: 30

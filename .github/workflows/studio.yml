                  <div id="s5-confirm-bar" style="background:rgba(16,185,129,0.12);border:1.5px solid rgba(74,222,128,0.4);border-radius:18px;padding:16px 24px;display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:22px;font-weight:800;color:#A7F3D0">فريق Tekviyo الهندسي جاهز لتحليل منظومتك مجاناً</span>

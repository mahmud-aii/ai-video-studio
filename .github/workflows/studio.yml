            <svg id="cursor-layer" viewBox="0 0 1080 1920">
              <circle id="click-ring" cx="0" cy="0" r="38" fill="none" stroke="#4ade80" stroke-width="5" opacity="0"/>
              <g id="cursor-arrow" transform="translate(500,500)">
                <path d="M0,0 L0,46 L14,34 L26,56 L36,50 L24,28 L42,28 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
              </g>
            </svg>

            <div id="wipe-layer"></div>

            <script>
              const SCENES = {scenes_json};

              function easeOutBack(x) {{
                x = Math.max(0, Math.min(1, x));
                return 1 + 2.3 * Math.pow(x - 1, 3) + 1.3 * Math.pow(x - 1, 2);
              }}

              window.renderFrame = function(scIdx, prog, tGlobal, tScene, durScene) {{
                // 1. تحديث شريط الخطوات العلوي
                document.getElementById('step-num').innerText = `0${{scIdx+1}} / 05`;
                for (let i = 0; i < 5; i++) {{
                  const fill = document.getElementById('bf' + i);
                  fill.style.width = (i < scIdx) ? '100%' : (i === scIdx ? (prog * 100) + '%' : '0%');
                  fill.style.background = (scIdx === 3) ? '#0284c7' : (scIdx === 0 ? '#ef4444' : '#38bdf8');
                }}

                // 2. تبديل الخلفية (الوضع النهاري اللؤلؤي في المشهد 4 مثل @ghalebgi، والداكن الفخم في البقية)
                const bg = document.getElementById('bg-layer');
                const o1 = document.getElementById('orb1');
                const o2 = document.getElementById('orb2');
                const stepNum = document.getElementById('step-num');
                if (scIdx === 0) {{
                  bg.style.background = 'radial-gradient(circle at 50% 25%, #2a0a18 0%, #050811 75%)';
                  o1.style.background = '#ef4444'; o2.style.background = '#f97316';
                  stepNum.style.color = '#f8fafc'; stepNum.style.background = 'rgba(255,255,255,0.08)';
                }} else if (scIdx === 3) {{
                  bg.style.background = 'linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%)';
                  o1.style.background = '#bae6fd'; o2.style.background = '#a7f3d0';
                  stepNum.style.color = '#0f172a'; stepNum.style.background = 'rgba(15,23,42,0.08)';
                }} else {{
                  bg.style.background = 'radial-gradient(circle at 50% 25%, #0c2444 0%, #040711 75%)';
                  o1.style.background = '#0284c7'; o2.style.background = '#10b981';
                  stepNum.style.color = '#f8fafc'; stepNum.style.background = 'rgba(255,255,255,0.08)';
                }}

                o1.style.transform = `translate(${{Math.sin(tGlobal*1.5)*45}}px, ${{Math.cos(tGlobal*1.2)*45}}px)`;
                o2.style.transform = `translate(${{Math.cos(tGlobal*1.4)*45}}px, ${{Math.sin(tGlobal*1.6)*45}}px)`;

                // 3. إظهار المشهد النشط وتحريك الكاميرا ثلاثية الأبعاد (3D Camera Rig)
                for (let i = 1; i <= 5; i++) {{
                  document.getElementById('sc-' + i).style.display = (i === scIdx + 1) ? 'flex' : 'none';
                }}

                const rig = document.getElementById('camera-rig');
                const rotX = Math.sin(tGlobal * 1.6) * 3.5;
                const rotY = Math.cos(tGlobal * 1.3) * 4.5;
                let camScale = 1.0;
                let camY = 0;

                const cursorLayer = document.getElementById('cursor-layer');
                const cursorArrow = document.getElementById('cursor-arrow');
                const clickRing = document.getElementById('click-ring');
                cursorLayer.style.display = 'none';

                if (scIdx === 0) {{
                  const pTop = easeOutBack(tScene / 0.45);
                  document.getElementById('s1-top').style.transform = `scale(${{pTop}}) translateY(${{(1-pTop)*50}}px)`;
                  const burnVal = Math.min(4850, Math.floor(1200 + prog * 4600));
                  document.getElementById('burn-counter').innerText = `-$${{burnVal.toLocaleString()}}`;
                  const waVal = Math.min(99, Math.floor(12 + prog * 115));
                  document.getElementById('wa-counter').innerText = `+${{waVal}}`;
                  const shake = (prog > 0.45) ? Math.sin(tGlobal * 32) * 6 : 0;
                  document.getElementById('s1-left').style.transform = `translateX(${{shake}}px)`;
                  document.getElementById('w-lost').style.transform = `scale(${{1 + Math.sin(tGlobal*10)*0.06}}) rotate(${{Math.sin(tGlobal*8)*2}}deg)`;
                }}
                else if (scIdx === 1) {{
                  const pHero = easeOutBack(tScene / 0.5);
                  document.getElementById('s2-hero').style.transform = `scale(${{pHero}})`;
                  const pGrid = easeOutBack(Math.max(0, tScene - 0.5) / 0.5);
                  document.getElementById('s2-grid').style.transform = `translateY(${{(1-pGrid)*80}}px) scale(${{Math.max(0.01, pGrid)}})`;
                  document.getElementById('brain-word').style.transform = `scale(${{1 + Math.sin(tGlobal*8)*0.08}})`;
                }}
                else if (scIdx === 2) {{
                  // كاميرا تفاعلية تتبع نقرة الإعلان ثم تنزل مع شعاع الـ Webhook
                  if (prog < 0.38) {{
                    camScale = 1.08; camY = 110;
                  }} else if (prog < 0.65) {{
                    camScale = 1.05; camY = 0;
                  }} else {{
                    camScale = 1.08; camY = -110;
                  }}
                  const beamH = Math.max(0, Math.min(100, ((prog - 0.32) / 0.25) * 100));
                  document.getElementById('webhook-beam').style.height = beamH + '%';
                  document.getElementById('s3-btn').style.transform = (prog >= 0.30 && prog <= 0.37) ? 'scale(0.91)' : 'scale(1)';

                  const p2 = easeOutBack((prog - 0.42) * 3.2);
                  document.getElementById('s3-step2').style.transform = `scale(${{Math.max(0.01, p2)}})`;
                  document.getElementById('s3-step2').style.opacity = Math.max(0, Math.min(1, (prog - 0.40)*5));

                  const p3 = easeOutBack((prog - 0.62) * 3.2);
                  document.getElementById('s3-step3').style.transform = `scale(${{Math.max(0.01, p3)}})`;
                  document.getElementById('s3-step3').style.opacity = Math.max(0, Math.min(1, (prog - 0.60)*5));

                  if (prog < 0.42) {{
                    cursorLayer.style.display = 'block';
                    const cp = Math.min(1, prog / 0.31);
                    const cx = 680 - 460 * cp;
                    const cy = 680 - 260 * cp;
                    cursorArrow.setAttribute('transform', `translate(${{cx}}, ${{cy}})`);
                    if (prog >= 0.31 && prog <= 0.38) {{
                      clickRing.setAttribute('cx', cx); clickRing.setAttribute('cy', cy);
                      clickRing.setAttribute('opacity', '0.9');
                    }} else {{
                      clickRing.setAttribute('opacity', '0');
                    }}
                  }}
                }}
                else if (scIdx === 3) {{
                  // انبثاق ثلاثي الأبعاد لبطاقات الوضع النهاري (@ghalebgi Flip)
                  ['s4-c1', 's4-c2', 's4-c3'].forEach((id, idx) => {{
                    const st = idx * 0.18;
                    const p = easeOutBack((prog - st) * 3.0);
                    const el = document.getElementById(id);
                    const rx = (1 - Math.min(1, p)) * 55;
                    el.style.transform = `perspective(1000px) rotateX(${{rx}}deg) scale(${{Math.max(0.01, p)}})`;
                    el.style.opacity = Math.max(0, Math.min(1, (prog - st)*4));
                  }});
                }}
                else if (scIdx === 4) {{
                  const p5 = easeOutBack(tScene / 0.5);
                  document.getElementById('s5-card').style.transform = `scale(${{p5}})`;
                  const clicked = (prog >= 0.52 && prog <= 0.62);
                  document.getElementById('s5-cta').style.transform = clicked ? 'scale(0.95)' : `scale(${{1 + Math.sin(tGlobal*6)*0.02}})`;

                  if (prog >= 0.35) {{
                    cursorLayer.style.display = 'block';
                    const cp = Math.min(1, (prog - 0.35) / 0.18);
                    // الماوس ينقر على الزاوية اليسرى السفلية للزر بعيداً تماماً عن النص العربي!
                    const cx = 260 - 95 * cp;
                    const cy = 1280 - 255 * cp;
                    cursorArrow.setAttribute('transform', `translate(${{cx}}, ${{cy}})`);
                    if (clicked) {{
                      clickRing.setAttribute('cx', cx); clickRing.setAttribute('cy', cy);
                      clickRing.setAttribute('opacity', '0.95');
                    }} else {{
                      clickRing.setAttribute('opacity', '0');
                    }}
                  }}
                }}

                rig.style.transform = `translateY(${{camY}}px) scale(${{camScale}}) rotateX(${{rotX}}deg) rotateY(${{rotY}}deg)`;

                // 4. كابشن الضبابية الحركي كلمة بكلمة (Blur-Reveal Word-by-Word)
                const words = SCENES[scIdx].words;
                const activeWordIdx = Math.min(words.length - 1, Math.floor(prog * words.length * 1.08));
                const capBox = document.getElementById('kinetic-captions');
                const isLight = (scIdx === 3);
                let htmlW = '';
                for (let w = 0; w < words.length; w++) {{
                  const dist = w - activeWordIdx;
                  let blur = 0, op = 1, sc = 1.0, bgW = 'transparent', colW = isLight ? '#0f172a' : '#f8fafc';
                  if (dist === 0) {{
                    sc = 1.16;
                    bgW = (scIdx === 0) ? '#ef4444' : (isLight ? '#0284c7' : '#10b981');
                    colW = (scIdx === 0 || isLight) ? '#ffffff' : '#04130d';
                  }} else if (dist > 0) {{
                    blur = Math.min(10, dist * 3.5);
                    op = Math.max(0.18, 0.65 - dist * 0.12);
                  }} else {{
                    op = 0.82;
                  }}
                  htmlW += `<span class="k-word" style="filter:blur(${{blur}}px);opacity:${{op}};transform:scale(${{sc}});background:${{bgW}};color:${{colW}}">${{words[w]}}</span>`;
                }}
                capBox.innerHTML = htmlW;

                // 5. انتقال المسح الهندسي الخاطف في بداية كل مشهد جديد
                const wipe = document.getElementById('wipe-layer');
                if (tScene < 0.22 && scIdx > 0) {{
                  const wp = tScene / 0.22;
                  wipe.style.transform = `translateX(${{(wp * 200) - 100}}%)`;
                }} else {{
                  wipe.style.transform = 'translateX(120%)';
                }}
              }};
            </script>
          </body>
          </html>"""

          Path("stage_2026.html").write_text(html_stage, encoding="utf-8")

          print("🎬 [3/4] رندر إطارات الجيل الجديد 2026 مباشرة عبر محرك Chromium...", flush=True)
          fps = 24
          total_frames = int(total_dur * fps)
          s_starts = [0.0]
          for d in scene_durations:
              s_starts.append(s_starts[-1] + d)

          ffmpeg_proc = subprocess.Popen([
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
              "-f", "image2pipe", "-vcodec", "mjpeg", "-r", str(fps), "-i", "-",
              "-i", "final_audio.aac",
              "-vf", "fps=60",
              "-c:v", "libx264", "-preset", "superfast", "-crf", "16", "-pix_fmt", "yuv420p",
              "-c:a", "copy", "-shortest", "TEKVIYO_2026_Edition.mp4"
          ], stdin=subprocess.PIPE)

          qa_snapshots = {}
          t0 = time.time()

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"])
              page = browser.new_page(viewport={"width": 1080, "height": 1920})
              page.goto(f"file://{os.path.abspath('stage_2026.html')}", wait_until="networkidle")
              page.wait_for_timeout(400)

              for i in range(total_frames):
                  t = i / fps
                  sc_idx = 0
                  for k in range(5):
                      if t >= s_starts[k]:
                          sc_idx = k
                  t_sc = t - s_starts[sc_idx]
                  dur_sc = scene_durations[sc_idx]
                  prog_sc = float(max(0.0, min(1.0, t_sc / max(0.1, dur_sc))))

                  page.evaluate(f"window.renderFrame({sc_idx}, {prog_sc:.4f}, {t:.4f}, {t_sc:.4f}, {dur_sc:.4f})")
                  jpg_bytes = page.screenshot(type="jpeg", quality=94)

                  if abs(prog_sc - 0.65) < 0.03 and sc_idx not in qa_snapshots:
                      Path(f"qa_{sc_idx}.jpg").write_bytes(jpg_bytes)
                      qa_snapshots[sc_idx] = f"qa_{sc_idx}.jpg"

                  try:
                      ffmpeg_proc.stdin.write(jpg_bytes)
                  except BrokenPipeError:
                      break

                  if i % 120 == 0 or i == total_frames - 1:
                      print(f"⚡ رندر 2026 الحي: {i+1}/{total_frames} إطار ({time.time()-t0:.1f} ثانية)", flush=True)

              browser.close()

          try:
              ffmpeg_proc.stdin.close()
          except Exception:
              pass
          ffmpeg_proc.wait()

          print("🔍 [4/4] تجميع لوحة الفحص الذاتي لنسخة 2026...", flush=True)
          sheet = Image.new("RGB", (1800, 640), (5, 8, 17))
          for k in range(5):
              if k in qa_snapshots:
                  im = Image.open(qa_snapshots[k]).resize((360, 640))
                  sheet.paste(im, (k * 360, 0))
          sheet.save("QA_2026_Inspection.jpg", quality=94)
          print("✅ اكتمل إنتاج فيديو TEKVIYO 2026 بنجاح ساحق!", flush=True)
          EOF
          python3 -u build_2026_studio.py

      - name: 📦 4. رفع فيديو نسخة 2026 ولوحة الفحص
        uses: actions/upload-artifact@v4
        with:
          name: 🚀-TEKVIYO-2026-Kinetic-Edition
          path: |
            TEKVIYO_2026_Edition.mp4
            QA_2026_Inspection.jpg
          retention-days: 30

                }

                // 1. كبسولة الكلمة الواحدة في منتصف الشاشة (Single-Word Pill)
                const words = sc.words;
                const wIdx = Math.min(words.length - 1, Math.floor(prog * words.length * 1.04));
                const currentWord = words[wIdx];
                const isHighlight = sc.highlights.indexOf(currentWord) !== -1;
                const pill = document.getElementById('single-word-pill');
                pill.innerText = currentWord;
                const wordPhase = (prog * words.length) % 1;
                const pillPop = isHighlight ? (1.08 + 0.06 * Math.sin(wordPhase * Math.PI)) : (0.96 + 0.04 * Math.sin(wordPhase * Math.PI));
